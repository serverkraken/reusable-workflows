# actions/post-prerelease-comment/action.yml
name: post-prerelease-comment
description: |
  Idempotently post or update a PR comment with a Docker pull command for a
  prerelease image. Detects an existing comment by a stable header marker.

inputs:
  image_ref:
    description: 'Full image reference, e.g. ghcr.io/serverkraken/foo:feat-x-a1b2c3d'
    required: true
  pr_number:
    description: 'PR number to post the comment on.'
    required: true
  trivy_status:
    description: 'Optional Trivy result line (e.g. "✓ no HIGH/CRITICAL").'
    required: false
    default: ''
  commit_sha:
    description: 'Optional commit SHA; if unset, derived from image_ref tag (best-effort).'
    required: false
    default: ''
  github_token:
    description: 'Token with pull-requests:write permission.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Find existing comment
      id: find
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-author: 'github-actions[bot]'
        body-includes: '<!-- prerelease-image-comment -->'
        token: ${{ inputs.github_token }}

    - name: Compose body
      id: body
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
        TRIVY_STATUS: ${{ inputs.trivy_status }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
      run: |
        set -euo pipefail
        if [[ -n "$COMMIT_SHA" ]]; then
          SHORT_SHA="${COMMIT_SHA:0:7}"
        else
          # printf, not echo: a value with a leading -n/-e would be eaten as a
          # flag. Same reason as actions/compute-prerelease-tag/sanitize.sh.
          SHORT_SHA=$(printf '%s' "$IMAGE_REF" | rev | cut -d- -f1 | rev | cut -c1-7)
        fi
        BODY=$(cat <<EOF
        <!-- prerelease-image-comment -->
        **Prerelease image ready**

        \`\`\`
        docker pull $IMAGE_REF
        \`\`\`

        Built from \`$SHORT_SHA\`
        EOF
        )
        if [[ -n "$TRIVY_STATUS" ]]; then
          BODY="$BODY · trivy: $TRIVY_STATUS"
        fi
        # Random delimiter per invocation. With a fixed one, a body containing
        # a line that is exactly the delimiter closes the block early and every
        # following line becomes a NEW step output — and both halves of this
        # body are caller-controlled (image_ref, trivy_status). That is output
        # injection, not a formatting nuisance.
        DELIM="body_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        if printf '%s' "$BODY" | grep -qxF "$DELIM"; then
          # Astronomically unlikely, but a silent truncation here would be
          # invisible. Refuse rather than emit a malformed output block.
          echo "::error::generated delimiter collides with the comment body" >&2
          exit 1
        fi
        {
          echo "body<<$DELIM"
          printf '%s\n' "$BODY"
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

    - name: Create or update comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
      with:
        comment-id: ${{ steps.find.outputs.comment-id }}
        issue-number: ${{ inputs.pr_number }}
        body: ${{ steps.body.outputs.body }}
        edit-mode: replace
        token: ${{ inputs.github_token }}
