# .github/workflows/test-flutter.yml
# Reusable workflow: run flutter test --coverage with a coverage gate.
#
# Auth: callers MUST pass `secrets: inherit` so the catalog-scoped App
# token can be minted. See lint-flutter.yml for the full explanation.
# Summary convention: docs/conventions/step-summary.md
name: test-flutter
on:
  workflow_call:
    inputs:
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux","X64","performance"]'
      working_directory:
        description: 'Path to the Flutter project root, relative to the repo root.'
        required: false
        type: string
        default: '.'
      java_version:
        description: 'Java major version.'
        required: false
        type: string
        default: '17'
      flutter_channel:
        description: 'Flutter release channel.'
        required: false
        type: string
        default: 'stable'
      flutter_version:
        description: 'Specific Flutter version (empty = latest on channel).'
        required: false
        type: string
        default: ''
      use_build_runner:
        description: 'When true, runs dart run build_runner build after pub get.'
        required: false
        type: boolean
        default: true
      coverage_threshold:
        description: 'Minimum line coverage percentage (integer 0-100).'
        required: false
        type: number
        default: 80
      sdk_cache:
        description: 'Cache the Flutter SDK via actions/cache. Off by default; see setup-flutter-toolchain.'
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 45
    secrets:
      release_please_app_client_id:
        required: true
        description: 'GitHub App Client ID with contents:read on the catalog repo.'
      release_please_app_private_key:
        required: true
        description: 'PEM private key for the GitHub App.'

permissions:
  contents: read

concurrency:
  group: test-flutter-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        # Fest auf den Workspace: der Waechter laeuft VOR dem Checkout, und ein
        # Job-Ebene `defaults.run.working-directory` (goreleaser.yml) zeigt auf
        # ein Verzeichnis, das es dann noch nicht gibt. Ohne diese Zeile
        # scheitert der Schritt mit "No such file or directory", statt den Wert
        # zu pruefen — gemessen an Lauf 33062297620.
        working-directory: ${{ github.workspace }}
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      - name: Validate coverage_threshold
        env:
          THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          set -euo pipefail
          # Der Eingang ist als "0-100" dokumentiert, erzwungen hat das NICHTS
          # (Audit G-3).
          #
          # Das Gate weiter unten rechnet mit `thr + 0`. awk macht daraus bei
          # einem leeren oder nicht numerischen Wert eine 0 — und damit besteht
          # das Gate IMMER. Gemessen bei 12,5 % Abdeckung:
          #
          #   thr=80    gescheitert      richtig
          #   thr=''    BESTANDEN        Gate still abgeschaltet
          #   thr=abc   BESTANDEN        Gate still abgeschaltet
          #   thr=-1    BESTANDEN        Gate still abgeschaltet
          #   thr=150   gescheitert      unerfuellbar, aber wenigstens laut
          #
          # Ueber die gerenderten Adopter-Workflows ist das weitgehend
          # abgefangen: dort steht `fromJSON(vars.SK_COVERAGE_THRESHOLD || '80')`,
          # eine nicht gesetzte Variable faellt also auf 80 zurueck. Die Atome
          # sind aber auch fuer handgeschriebene Aufrufer da — die README
          # fuehrt sie als Vertrag —, und ein Vertrag, den nichts prueft, ist
          # keiner.
          #
          # Dezimalwerte sind ausdruecklich ERLAUBT, obwohl die Beschreibung
          # von einem Integer spricht: pytest nimmt `--cov-fail-under=87.5`
          # anstandslos, und ein Waechter, der legitime Aufrufer abweist, waere
          # schlimmer als der Fund. Geprueft wird, was wirklich schadet: leer,
          # nicht numerisch, negativ, ueber 100.
          #
          # Frueh im Job und nicht erst im Gate: sonst laeuft erst die ganze
          # Testsuite, nur um die Konfiguration danach abzulehnen.
          if ! awk -v t="$THRESHOLD" 'BEGIN { exit (t ~ /^[0-9]+(\.[0-9]+)?$/ && t + 0 <= 100) ? 0 : 1 }'; then
            echo "::error::coverage_threshold must be a number between 0 and 100, got \"${THRESHOLD}\" — an empty or non-numeric value makes the coverage gate pass silently" >&2
            exit 1
          fi

      - name: Checkout adopter repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        # Self-CI (caller == catalog): use the caller's SHA so feature-branch
        # composite-action changes are exercised. Cross-repo (adopters):
        # pin to the floating major tag `v4`. Bump this hardcoded major when
        # a new major releases.
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout catalog (for composite actions)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog
      - name: Setup Flutter toolchain
        uses: ./.catalog/actions/setup-flutter-toolchain
        with:
          java-version: ${{ inputs.java_version }}
          flutter-channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ inputs.flutter_version }}
          use-build-runner: ${{ inputs.use_build_runner }}
          working-directory: ${{ inputs.working_directory }}
          sdk-cache: ${{ inputs.sdk_cache }}

      - name: flutter test --coverage
        id: flutter_test
        working-directory: ${{ inputs.working_directory }}
        run: flutter test --coverage

      - name: Coverage gate
        id: gate
        working-directory: ${{ inputs.working_directory }}
        env:
          THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          set -euo pipefail
          if [[ ! -f coverage/lcov.info ]]; then
            echo "::error::coverage/lcov.info not produced — flutter test --coverage failed silently"
            exit 1
          fi
          TOTAL_LF=$(awk -F: '/^LF:/ { sum += $2 } END { print sum+0 }' coverage/lcov.info)
          TOTAL_LH=$(awk -F: '/^LH:/ { sum += $2 } END { print sum+0 }' coverage/lcov.info)
          if [[ "$TOTAL_LF" -eq 0 ]]; then
            echo "::error::No instrumented lines found in lcov.info (LF total = 0)"
            exit 1
          fi
          PCT=$(awk -v h="$TOTAL_LH" -v f="$TOTAL_LF" 'BEGIN { printf "%.2f", (h/f)*100 }')
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          if awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN { exit !(p+0 >= t+0) }'; then
            echo "gate=pass" >> "$GITHUB_OUTPUT"
          else
            echo "gate=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          WD: ${{ inputs.working_directory }}
          FLUTTER_TEST_OUTCOME: ${{ steps.flutter_test.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          PCT: ${{ steps.gate.outputs.pct }}
          THRESHOLD: ${{ steps.gate.outputs.threshold }}
          GATE: ${{ steps.gate.outputs.gate }}
        run: |
          if [[ "$FLUTTER_TEST_OUTCOME" != "success" ]]; then
            result="✗ tests failed"
          elif [[ "$GATE" == "pass" ]]; then
            result="✓ pass (${PCT}% / ${THRESHOLD}%)"
          else
            result="✗ fail (${PCT}% / ${THRESHOLD}%)"
          fi
          {
            echo "## test-flutter"
            echo ""
            echo "**Tool:** flutter test --coverage"
            echo "**Working dir:** \`${WD}\`"
            echo "**Result:** ${result}"
          } >> "$GITHUB_STEP_SUMMARY" || true
