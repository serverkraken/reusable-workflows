# .github/workflows/test-python.yml
# Reusable workflow: run pytest with coverage gate. Package manager
# (poetry/uv/pip) is auto-detected by setup-python-deps.
#
# Auth: callers MUST pass `secrets: inherit` so the catalog-scoped App
# token can be minted. See lint-python.yml for the full explanation.
# Summary convention: docs/conventions/step-summary.md
name: test-python
on:
  workflow_call:
    inputs:
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux"]'
      working_directory:
        description: 'Component sub-path.'
        required: false
        type: string
        default: '.'
      python_version:
        description: 'Python version. Empty → read from <working_directory>/pyproject.toml.'
        required: false
        type: string
        default: ''
      coverage_threshold:
        description: 'Minimum line coverage percentage (integer 0-100).'
        required: false
        type: number
        default: 80
      coverage_source:
        description: >-
          What coverage measures, passed as `--cov=<value>` (a package name or
          a path). Leave empty when the project already configures it via
          `[tool.coverage.run] source` or pytest `addopts`; this workflow adds
          no `--cov` of its own then, so that config stays in charge. With
          neither, nothing is measured and the run fails loudly rather than
          reporting a gate it never ran.
        required: false
        type: string
        default: ''
    outputs:
      coverage_pct:
        description: >-
          Measured line coverage as reported by pytest-cov, or `N/A` when the
          run produced no report. Exposed so a caller can assert the gate
          actually ran, rather than only that the job failed.
        value: ${{ jobs.test.outputs.coverage_pct }}
    secrets:
      release_please_app_client_id:
        required: true
        description: 'GitHub App Client ID with contents:read on the catalog repo.'
      release_please_app_private_key:
        required: true
        description: 'PEM private key for the GitHub App.'

permissions:
  contents: read

concurrency:
  group: test-python-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    outputs:
      coverage_pct: ${{ steps.pytest.outputs.coverage_pct }}
    steps:
      - name: Checkout adopter repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout catalog (for composite actions)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog
      - id: setup
        uses: ./.catalog/actions/setup-python-deps
        with:
          working_directory: ${{ inputs.working_directory }}
          python_version: ${{ inputs.python_version }}
          install_test_extras: 'true'

      # Exclude .catalog/ from pytest discovery — see lint-python.yml.
      - name: pytest --cov-fail-under
        id: pytest
        working-directory: ${{ inputs.working_directory }}
        env:
          THRESHOLD: ${{ inputs.coverage_threshold }}
          COVERAGE_SOURCE: ${{ inputs.coverage_source }}
        run: |
          set -o pipefail
          # NEVER a bare `--cov`. pytest-cov normalises `--cov --cov=lib` down
          # to plain whole-run coverage, which measures only files that were
          # actually imported — for a trivial test that is the test file
          # itself, reporting 100%. Measured on one project: with the adopter's
          # own `addopts = "--cov=lib"` the gate correctly reported 0% and
          # failed; adding this workflow's bare `--cov` made the same project
          # report 100% and pass. The catalog was destroying a working gate.
          cov_args=()
          [ -n "${COVERAGE_SOURCE:-}" ] && cov_args=(--cov="$COVERAGE_SOURCE")
          rc=0
          ${{ steps.setup.outputs.run_prefix }} pytest --ignore=.catalog "${cov_args[@]}" --cov-report=term --cov-fail-under="$THRESHOLD" | tee pytest.out || rc=$?
          # With no source at all — neither from coverage_source nor from the
          # project's own config — pytest-cov never activates, no report is
          # produced and --cov-fail-under silently passes. A gate that measures
          # nothing is worse than no gate, so say so instead of going green.
          if ! grep -qE '^TOTAL' pytest.out; then
            echo "::error::coverage produced no report, so the ${THRESHOLD}% gate never ran." \
                 "Configure the measured source in the project ([tool.coverage.run] source," \
                 "or pytest addopts --cov=<pkg>), or pass coverage_source to this workflow."
            exit 1
          fi
          pct=$(awk '/^TOTAL/ {gsub("%","",$NF); print $NF}' pytest.out)
          echo "coverage_pct=${pct:-N/A}" >> "$GITHUB_OUTPUT"
          echo "threshold=${THRESHOLD}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summary
        if: always()
        env:
          WD: ${{ inputs.working_directory }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          PCT: ${{ steps.pytest.outputs.coverage_pct }}
          THRESHOLD: ${{ steps.pytest.outputs.threshold }}
        run: |
          if [[ "$PYTEST_OUTCOME" == "success" ]]; then
            result="✓ coverage ${PCT}% ≥ threshold ${THRESHOLD}%"
          elif [[ -n "$PCT" && "$PCT" != "N/A" ]]; then
            result="✗ coverage ${PCT}% < threshold ${THRESHOLD}% (or tests failed)"
          else
            result="✗ tests failed"
          fi
          {
            echo "## test-python"
            echo ""
            echo "**Tool:** pytest"
            echo "**Working dir:** \`${WD}\`"
            echo "**Result:** ${result}"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Coverage | ${PCT:-N/A}% |"
            echo "| Threshold | ${THRESHOLD}% |"
          } >> "$GITHUB_STEP_SUMMARY" || true
