# .github/workflows/onboard.yml
# Operational tool: dispatches per-target onboarding PRs into serverkraken/* repos.
# Not a public reusable workflow's API surface — input contract may evolve without semver bump.
# See docs/superpowers/specs/2026-05-16-onboarding-workflow-design.md.
# Summary convention: docs/conventions/step-summary.md
name: onboard
on:
  workflow_dispatch:
    inputs:
      target_repos:
        description: 'Comma-separated owner/repo list (e.g. serverkraken/blupod-ui,serverkraken/flow)'
        required: true
        type: string
      language:
        description: 'auto = detect, otherwise force release-type'
        required: false
        type: choice
        default: auto
        options: [auto, go, python, rust, helm, node, flutter, gitops, simple]
      dry_run:
        description: 'Render + log diff; do NOT push or open PRs'
        required: false
        type: boolean
        default: false
      use_go_cli:
        description: 'Use sk-workflows for detect, render, and repo-default application. Set false to use the Bash fallback.'
        required: false
        type: boolean
        default: true
      # pin_version: Catalog @version that rendered templates pin to.
      # When a new catalog major releases, bump this default, the matching
      # one in the workflow_call inputs block below, AND the ${PIN_VERSION:-vN}
      # fallback in the "Update docs/onboarding-status.md" step further below.
      pin_version:
        description: 'Catalog @version that rendered templates pin to'
        required: false
        type: string
        default: v4
      rendered_against:
        description: 'Full catalog tag for the lock file. Empty → fall back to pin_version.'
        required: false
        type: string
        default: ''
      add_branch_name:
        description: 'Branch for PR A (add new workflows)'
        required: false
        type: string
        default: chore/onboard-reusable-workflows
      cleanup_branch_name:
        description: 'Branch for PR B (remove legacy workflows)'
        required: false
        type: string
        default: chore/remove-legacy-workflows
  workflow_call:
    inputs:
      target_repos:
        description: 'Comma-separated owner/repo list (e.g. serverkraken/blupod-ui,serverkraken/flow)'
        required: true
        type: string
      language:
        description: 'auto = detect, otherwise force release-type (go, python, rust, helm, node, flutter, gitops, simple)'
        required: false
        type: string
        default: auto
      dry_run:
        description: 'Render + log diff; do NOT push or open PRs. Defaults to true here (unlike the dispatch form) so a programmatic caller has to opt IN to mutating adopter repos.'
        required: false
        type: boolean
        default: true
      use_go_cli:
        description: 'Use sk-workflows for detect, render, and repo-default application. Set false to use the Bash fallback.'
        required: false
        type: boolean
        default: true
      pin_version:
        description: 'Catalog @version that rendered templates pin to'
        required: false
        type: string
        default: v4
      rendered_against:
        description: 'Full catalog tag for the lock file. Empty → fall back to pin_version.'
        required: false
        type: string
        default: ''
      add_branch_name:
        description: 'Branch for PR A (add new workflows)'
        required: false
        type: string
        default: chore/onboard-reusable-workflows
      cleanup_branch_name:
        description: 'Branch for PR B (remove legacy workflows)'
        required: false
        type: string
        default: chore/remove-legacy-workflows

concurrency:
  # Hardcoded prefix per CLAUDE-patterns "concurrency group" rule.
  group: onboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # onboard.yml exposes workflow_call, mints an App token for ARBITRARY
  # target_repos from that call's inputs, and its finalize job pushes to this
  # catalog's main. Nothing checked WHO was calling.
  #
  # Today the cross-repo call happens to fail: the catalog checkout uses
  # github.workflow_sha, which in a called workflow is the CALLER's workflow
  # SHA and does not exist here. That is an accident of implementation, not a
  # boundary — code_security is already mutated by then, finalize runs under
  # always(), and a future fix to that checkout would silently open the door.
  #
  # Every in-repo caller (onboard-sweep.yml, integration.yml) passes this. A
  # fork that wants to drive its own org has to change the constant, which is
  # the honest place for that decision.
  guard-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse callers outside this catalog
        env:
          # In a reusable workflow this is the CALLER's repository.
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$CALLER" != "serverkraken/reusable-workflows" ]]; then
            echo "::error::onboard.yml is an internal operational workflow of" \
                 "serverkraken/reusable-workflows. It mints repo-admin tokens for" \
                 "arbitrary targets and writes to the catalog's main branch, so it" \
                 "does not accept cross-repo workflow_call. Caller was: $CALLER"
            exit 1
          fi
          echo "Caller $CALLER accepted."

  parse-inputs:
    needs: guard-caller
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - id: parse
        env:
          REPOS: ${{ inputs.target_repos }}
          ADD_BRANCH: ${{ inputs.add_branch_name }}
          CLEANUP_BRANCH: ${{ inputs.cleanup_branch_name }}
        run: |
          set -euo pipefail

          # Branch names reach `git checkout -B` and `git push -f` on a FOREIGN
          # repository. Unvalidated, `add_branch_name: main` commits the
          # rendered files straight onto that repo's default branch and
          # force-pushes them. Validate here, before any repo is touched.
          for pair in "add_branch_name:$ADD_BRANCH" "cleanup_branch_name:$CLEANUP_BRANCH"; do
            key="${pair%%:*}"; val="${pair#*:}"
            if [[ -z "$val" ]]; then
              echo "::error::$key must not be empty"; exit 1
            fi
            if [[ ! "$val" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::$key '$val' is not a plain branch name (allowed: A-Z a-z 0-9 . _ / -, not starting with a separator)"
              exit 1
            fi
            # A protected-looking name is refused outright. The per-target check
            # further down also compares against that repo's ACTUAL default
            # branch, which may be neither of these.
            case "$val" in
              main|master|develop|trunk|HEAD)
                echo "::error::$key must not be '$val' — this branch is force-pushed, which would overwrite it"
                exit 1
                ;;
            esac
          done
          if [[ "$ADD_BRANCH" == "$CLEANUP_BRANCH" ]]; then
            echo "::error::add_branch_name and cleanup_branch_name are both '$ADD_BRANCH'; PR B would force-replace PR A's branch and rewrite its title"
            exit 1
          fi

          IFS=',' read -ra raw <<< "$REPOS"
          declare -A seen=()
          out='['
          first=1
          for entry in "${raw[@]}"; do
            # Trim only the OUTSIDE. Deleting every space turned an invalid
            # 'serverkraken/pay ments' into the valid, existing
            # 'serverkraken/payments' — and the run then minted a token for
            # that repo and mutated it.
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [[ -z "$entry" ]] && continue
            if [[ ! "$entry" =~ ^serverkraken/[A-Za-z0-9._-]+$ ]]; then
              echo "::error::invalid target_repos entry: '$entry' (must match ^serverkraken/[A-Za-z0-9._-]+\$)"
              exit 1
            fi
            if [[ -n "${seen[$entry]:-}" ]]; then
              continue
            fi
            seen[$entry]=1
            owner="${entry%/*}"
            name="${entry#*/}"
            if [[ $first -eq 0 ]]; then out+=','; fi
            out+="{\"target\":\"$entry\",\"owner\":\"$owner\",\"name\":\"$name\"}"
            first=0
          done
          out+=']'
          if [[ "$out" == "[]" ]]; then
            echo "::error::target_repos is empty after parse"
            exit 1
          fi
          echo "matrix=$out" >> "$GITHUB_OUTPUT"
          echo "Parsed matrix: $out"

  onboard:
    needs: parse-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.parse-inputs.outputs.matrix) }}
    # Serialise per TARGET, not per caller ref. The workflow-level group keys
    # on github.ref, which only stops a second run from the same ref — two
    # runs against the same adopter from different refs (a manual dispatch and
    # the weekly sweep's workflow_call, say) fell into different groups and
    # raced: both force-push the same bot branch, and the loser's PR then
    # describes a tree that no longer exists. The matrix context is not
    # available at workflow level, so the guard has to live here.
    #
    # cancel-in-progress stays false: a half-finished onboard has already
    # force-pushed a branch and possibly opened a PR, and killing it mid-way
    # leaves that behind. Waiting is the cheaper failure mode.
    concurrency:
      group: onboard-target-${{ matrix.target.target }}
      cancel-in-progress: false
    steps:
      - name: Begin summary
        if: always()
        env:
          TARGET: ${{ matrix.target.target }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            mode="dry-run (no PR push)"
          else
            mode="apply"
          fi
          {
            echo "## onboard"
            echo ""
            echo "**Tool:** onboard render+PR"
            echo "**Target:** \`${TARGET}\`"
            echo "**Mode:** ${mode}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Mint App token scoped to target
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.target.owner }}
          repositories: ${{ matrix.target.name }}

      - name: Checkout target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ matrix.target.target }}
          token: ${{ steps.target-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Checkout catalog at this workflow's SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ github.workflow_sha }}
          path: .catalog

      # Code scanning needs `code_security` enabled on private repos before
      # SARIF upload works. Public repos get code-scanning for free and don't
      # have this knob, so the script reads visibility first and skips
      # non-private targets.
      #
      # Runs AFTER the catalog checkout because the logic now lives in a
      # script — as inline workflow bash it was untestable, and the one code
      # path that mattered (the PATCH) never ran in CI: the integration
      # dry-run targets this repo, which is public.
      #
      # `continue-on-error` so a 403 (App permissions not granted/propagated)
      # doesn't sink the onboard run — adopters with `code_security` already
      # enabled or a different policy can still onboard, they just won't get
      # SARIF reports until that's resolved manually. The outcome is written
      # to the step summary either way, so a swallowed failure stays visible.
      - name: Enable code_security on private targets
        id: code-security
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          TARGET: ${{ matrix.target.target }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: .catalog/scripts/enable-code-security.sh "$TARGET"

      - name: Report code_security outcome
        if: always()
        env:
          RESULT: ${{ steps.code-security.outcome }}
        run: |
          case "$RESULT" in
            success) note="handled (see job log for the exact outcome)" ;;
            *)       note="**failed** — SARIF upload will not work until this is resolved manually" ;;
          esac
          echo "**Code scanning:** ${note}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Setup Go for sk-workflows
        if: ${{ inputs.use_go_cli }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: .catalog/go.mod
          cache: true
          cache-dependency-path: .catalog/go.mod

      - name: Setup sk-workflows
        if: ${{ inputs.use_go_cli }}
        uses: ./.catalog/actions/setup-sk-workflows
        with:
          build_from_source: 'true'

      - name: Detect language and version
        id: detect
        uses: ./.catalog/actions/onboard-detect
        with:
          repo_path: target
          language_override: ${{ inputs.language }}
          target_repo: ${{ matrix.target.target }}
          github_token: ${{ steps.target-token.outputs.token }}
          use_go_cli: ${{ inputs.use_go_cli }}

      # Fingerprint the legacy CI files BEFORE anything touches the tree. PR B
      # hard-resets to a freshly fetched default branch before deleting, so
      # the tree it deletes from is not the tree that was classified. Comparing
      # these two fingerprints is what keeps PR B from removing a file a human
      # replaced in between (E-3), and from trusting a bare existence check
      # (E-9).
      - name: Fingerprint legacy CI at detection time
        working-directory: target
        env:
          PROFILE: ${{ steps.detect.outputs.profile_json }}
        run: |
          set -euo pipefail
          printf '%s' "$PROFILE" \
            | "$GITHUB_WORKSPACE/.catalog/scripts/legacy-ci-fingerprint.sh" . \
            > "$RUNNER_TEMP/legacy-before.tsv"
          echo "Legacy CI candidates at detection time:"
          cut -f2 "$RUNNER_TEMP/legacy-before.tsv" | sed 's/^/  /'

      - name: Install gomplate (needed by onboard-render)
        run: sudo ${{ github.workspace }}/.catalog/scripts/install-gomplate.sh

      - name: Snapshot previous defaults marker
        id: snap_defaults
        working-directory: target
        run: |
          set -euo pipefail
          if [[ -f .github/onboard.lock.json ]]; then
            prev=$(jq -r '.defaults_applied_at // ""' .github/onboard.lock.json)
          else
            prev=""
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Render templates into target
        uses: ./.catalog/actions/onboard-render
        with:
          catalog_path: .catalog
          target_path: target
          profile_json: ${{ steps.detect.outputs.profile_json }}
          pin_version: ${{ inputs.pin_version }}
          rendered_against: ${{ inputs.rendered_against }}
          use_go_cli: ${{ inputs.use_go_cli }}

      - name: Apply repo defaults
        uses: ./.catalog/actions/onboard-apply-defaults
        with:
          token: ${{ steps.target-token.outputs.token }}
          target_repo: ${{ matrix.target.target }}
          target_path: target
          prev_defaults_applied_at: ${{ steps.snap_defaults.outputs.prev }}
          dry_run: ${{ inputs.dry_run }}
          use_go_cli: ${{ inputs.use_go_cli }}

      - name: Stage rendered files and log diff
        working-directory: target
        env:
          PROFILE: ${{ steps.detect.outputs.profile_json }}
          # Via env: — the value comes from the caller's `target_repos` input.
          TARGET: ${{ matrix.target.target }}
        run: |
          set -euo pipefail
          git add -A
          echo "### Rendered diff for $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --cached --stat >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --cached --stat
          git --no-pager diff --cached

          # Append profile-driven components table for human sanity-check.
          {
            echo ""
            echo "### Detected components"
            echo "| Path | Role | Languages | Dockerfiles |"
            echo "| --- | --- | --- | --- |"
            echo "$PROFILE" | jq -r '.components[] |
              "| \(.path) | \(.role) | \(.languages|join(",")) | \(.dockerfiles|length) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Branch A — ensure add-workflows PR
        if: ${{ !inputs.dry_run }}
        id: pr_a
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          DEFAULT_BRANCH: ${{ steps.detect.outputs.default_branch }}
          ADD_BRANCH: ${{ inputs.add_branch_name }}
          TARGET_REPO: ${{ matrix.target.target }}
          PIN: ${{ inputs.pin_version }}
          PROFILE: ${{ steps.detect.outputs.profile_json }}
        run: |
          set -euo pipefail
          # Bot identity: id is public and stable; fetched inline so we never
          # commit a hardcoded numeric id that could drift.
          bot_id=$(gh api '/users/serverkraken-release-bot[bot]' -q '.id')
          git config user.name 'serverkraken-release-bot[bot]'
          git config user.email "${bot_id}+serverkraken-release-bot[bot]@users.noreply.github.com"

          # Target already has rendered files staged (from prior step's "git add -A").
          # Reset index, then re-add exactly the files onboard-render.sh wrote.
          # The lock file is the authoritative manifest: its `.files` keys are
          # every rendered path for THIS variant, so the set tracks the renderer
          # instead of a hardcoded array that silently drifts. A release profile
          # renders the full release-please set; a gitops profile renders ci.yml
          # only; the prerelease-on-push opt-in adds one more file — all three
          # are reflected in the lock without changes here.
          git reset

          LOCK=".github/onboard.lock.json"
          [[ -f "$LOCK" ]] || { echo "::error::lock file missing: $LOCK"; exit 1; }
          mapfile -t RENDERED < <(jq -r '.files | keys[]' "$LOCK")
          # The lock does not list itself; stage it alongside the rendered files.
          RENDERED+=("$LOCK")
          # Defensive guard: every path the lock claims must exist on disk.
          for f in "${RENDERED[@]}"; do
            [[ -f "$f" ]] || { echo "::error::expected rendered file missing: $f"; exit 1; }
          done

          # The static check in `parse` refuses main/master/develop/trunk, but
          # this repo's default branch may be none of those. Compare against
          # the ACTUAL one before force-pushing over it.
          if [[ "$ADD_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "::error::add_branch_name is '$ADD_BRANCH', which is ${TARGET_REPO}'s default branch — refusing to force-push over it"
            exit 1
          fi

          # Create / reset the bot branch from default HEAD; rendered files are working-tree
          # mods so they survive `checkout -B`.
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$ADD_BRANCH" "origin/$DEFAULT_BRANCH"

          git add "${RENDERED[@]}"

          existing_pr_num=$(gh pr list --repo "$TARGET_REPO" --head "$ADD_BRANCH" --state open --json number -q '.[0].number' || echo "")

          if git diff --cached --quiet; then
            echo "No diff for add branch."
            if [[ -n "$existing_pr_num" ]]; then
              gh pr close "$existing_pr_num" --repo "$TARGET_REPO" --comment "No changes needed; closing." || true
            fi
            echo "pr_a_url=" >> "$GITHUB_OUTPUT"
            echo "pr_a_status=no-changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: onboard serverkraken/reusable-workflows@${PIN}"
          # Kein blankes `push -f`: das warf einen Fixup, den ein Reviewer auf
          # den Bot-Branch gepusht hat, beim naechsten Lauf stillschweigend weg.
          # Das Skript bricht ab, wenn der Branch fremde Commits traegt, und
          # pusht sonst mit Lease.
          "$GITHUB_WORKSPACE/.catalog/scripts/push-bot-branch.sh" \
            "$ADD_BRANCH" "origin/$DEFAULT_BRANCH" 'serverkraken-release-bot[bot]'

          # Build profile-driven markdown blocks for the PR body so the reviewer
          # can sanity-check what detection saw before merging.
          components_md=$(echo "$PROFILE" | jq -r '
            .components[] |
            "- `\(.path)` — role=`\(.role)`, languages=\(.languages|join(",")), dockerfiles=\(.dockerfiles|length)"
          ')
          # gitops_consumers (from the adopter manifest's `.github/onboard.yml`,
          # NOT this catalog's `.github/workflows/onboard.yml`) lists downstream
          # repos that consume this target's manifests — surfaced so reviewers
          # know who's affected before merging.
          consumers_md="$(echo "$PROFILE" | jq -r '
            (.gitops_consumers // []) | map(
              "- `" + .repo + "`"
              + (if (.scope // []) | length > 0
                 then " (" + (.scope | map("`" + . + "`") | join(", ")) + ")"
                 else "" end)
              + " — " + .mode
            ) | join("\n")')"
          # Warnings are objects {code, path, message} from emit_*_warnings in
          # onboard-detect-lib.sh — extract human-readable fields for the PR body.
          warnings_md=$(echo "$PROFILE" | jq -r '.warnings // [] | map("- `\(.code)` at `\(.path)` — \(.message)") | join("\n")')
          # legacy_ci entries split into "PR-B will remove" (non-empty
          # replaced_by — confident replacement exists) vs "manual review"
          # (empty replaced_by — unrecognized; PR-B leaves them alone).
          # This mirrors PR-B's actual deletion logic so the body never
          # promises a removal that doesn't happen.
          to_remove_md=$(echo "$PROFILE" | jq -r '
            .legacy_ci // [] |
            map(select(.replaced_by | length > 0)) |
            map("- `\(.path)` — \(.summary)") |
            join("\n")
          ')
          manual_review_md=$(echo "$PROFILE" | jq -r '
            .legacy_ci // [] |
            map(select(.replaced_by | length == 0)) |
            map("- `\(.path)` — \(.summary)") |
            join("\n")
          ')
          # Post-merge guidance differs by variant. A gitops profile has no
          # release-please flow — ci.yml IS the whole pipeline — so promising a
          # release-please PR would be wrong. Branch on the profile's `gitops`
          # presence (same signal the renderer uses to emit ci.yml only).
          # shellcheck disable=SC2016  # backticks here are literal markdown code spans, not command substitution
          if [[ "$(echo "$PROFILE" | jq -r 'if (.gitops // null) != null then "y" else "n" end')" == "y" ]]; then
            next_steps_md='After merging, `ci.yml` validates Kubernetes manifests (kube-validate), '
            next_steps_md+='runs kube-linter (kube-lint), and scans for secrets (secret-scan) on every push and PR. '
            next_steps_md+='GitOps repos keep their existing release flow — no release-please PR is created.'
          else
            next_steps_md=$(printf 'After merging:\n1. Push a `feat:` / `fix:` commit to `%s` — `release.yml` should open a release-please PR.' "$DEFAULT_BRANCH")
            next_steps_md+=$'\n2. Merge that release-please PR. A release + image build + Trivy scan should run end-to-end.'
            next_steps_md+=$'\n3. Once one full release has run green, merge the companion cleanup PR (if open) to retire legacy workflow files.'
          fi

          body=$(cat <<EOF
          ## Onboard to serverkraken/reusable-workflows@${PIN}

          Renders the standard reusable-workflow consumer files plus a tracking
          \`.github/onboard.lock.json\` so future drift can be detected centrally.

          ### Detected shape
          ${components_md}

          ${consumers_md:+### Consumed by (from .github/onboard.yml)

          ${consumers_md}
          }
          ${warnings_md:+#### Warnings
          ${warnings_md}
          }
          ${to_remove_md:+#### Legacy CI removed by companion PR B
          ${to_remove_md}
          }
          ${manual_review_md:+#### Legacy CI needing manual review
          These workflows were detected but have no catalog replacement yet; PR B leaves them in place.
          ${manual_review_md}
          }
          ${next_steps_md}

          _Opened by the \`onboard.yml\` workflow in \`serverkraken/reusable-workflows\`._
          EOF
          )

          if [[ -n "$existing_pr_num" ]]; then
            gh pr edit "$existing_pr_num" --repo "$TARGET_REPO" \
              --title "chore: onboard serverkraken/reusable-workflows@${PIN}" \
              --body "$body"
            pr_url=$(gh pr view "$existing_pr_num" --repo "$TARGET_REPO" --json url -q .url)
          else
            gh pr create --repo "$TARGET_REPO" \
                         --base "$DEFAULT_BRANCH" --head "$ADD_BRANCH" \
                         --title "chore: onboard serverkraken/reusable-workflows@${PIN}" \
                         --body "$body" >/dev/null
            pr_url=$(gh pr view "$ADD_BRANCH" --repo "$TARGET_REPO" --json url -q .url)
          fi
          echo "pr_a_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_a_status=add-open" >> "$GITHUB_OUTPUT"

      - name: Branch B — ensure remove-legacy PR
        if: ${{ !inputs.dry_run }}
        id: pr_b
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          DEFAULT_BRANCH: ${{ steps.detect.outputs.default_branch }}
          CLEANUP_BRANCH: ${{ inputs.cleanup_branch_name }}
          TARGET_REPO: ${{ matrix.target.target }}
          PIN: ${{ inputs.pin_version }}
          PR_A_URL: ${{ steps.pr_a.outputs.pr_a_url }}
          PROFILE: ${{ steps.detect.outputs.profile_json }}
        run: |
          set -euo pipefail
          # Hard reset to default branch HEAD to discard rendered files from prior step;
          # cleanup PR works against the unmodified default branch.
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"
          git clean -fd

          # Source of truth for what to delete: profile.legacy_ci from
          # detect_legacy_ci (scripts/lib/onboard-detect-lib.sh). Only entries
          # with non-empty replaced_by are removed — those are workflows where
          # a confident catalog replacement exists. "Unrecognized" legacy
          # (empty replaced_by) is left in place; the user reviews manually.
          # Prior to v4.2.1 this step used a hardcoded 6-name whitelist that
          # missed test-coverage.yml, docker-manual.yml, test.yml, etc.
          mapfile -t matched < <(
            echo "$PROFILE" | jq -r '
              .legacy_ci // [] |
              map(select(.replaced_by | length > 0)) |
              .[].path
            '
          )
          # The tree was just reset to a freshly fetched default branch, so it
          # is NOT the tree the profile above was computed from. Re-fingerprint
          # and delete only what is byte-identical to what was classified.
          # Asking merely whether the path still exists confirmed the name and
          # never the thing: a workflow someone rewrote in between kept its
          # filename and got deleted anyway.
          printf '%s' "$PROFILE" \
            | "$GITHUB_WORKSPACE/.catalog/scripts/legacy-ci-fingerprint.sh" . \
            > "$RUNNER_TEMP/legacy-now.tsv"
          mapfile -t matched < <(
            comm -12 "$RUNNER_TEMP/legacy-before.tsv" "$RUNNER_TEMP/legacy-now.tsv" | cut -f2
          )
          mapfile -t drifted < <(
            comm -23 "$RUNNER_TEMP/legacy-before.tsv" "$RUNNER_TEMP/legacy-now.tsv" | cut -f2
          )
          if (( ${#drifted[@]} > 0 )); then
            printf '::warning::changed since detection, left in place: %s\n' "${drifted[*]}"
            {
              echo ""
              echo "**Legacy CI left in place** — changed on \`${DEFAULT_BRANCH}\` since this run detected it:"
              for f in "${drifted[@]}"; do echo "- \`${f}\`"; done
              echo ""
              echo "Re-run \`onboard.yml\` to re-classify these against their current contents."
            } >> "$GITHUB_STEP_SUMMARY" || true
          fi

          existing_pr_num=$(gh pr list --repo "$TARGET_REPO" --head "$CLEANUP_BRANCH" --state open --json number -q '.[0].number' || echo "")

          if (( ${#matched[@]} == 0 )); then
            echo "No legacy files in target."
            if [[ -n "$existing_pr_num" ]]; then
              gh pr close "$existing_pr_num" --repo "$TARGET_REPO" --comment "No legacy files to remove; closing." || true
            fi
            echo "pr_b_url=" >> "$GITHUB_OUTPUT"
            echo "pr_b_status=no-legacy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$CLEANUP_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "::error::cleanup_branch_name is '$CLEANUP_BRANCH', which is ${TARGET_REPO}'s default branch — refusing to force-push the legacy deletions over it"
            exit 1
          fi
          git checkout -B "$CLEANUP_BRANCH" "origin/$DEFAULT_BRANCH"
          git rm "${matched[@]}"
          git commit -m "chore: remove legacy workflows superseded by reusable-workflows@${PIN}"
          # Kein blankes `push -f`: das warf einen Fixup, den ein Reviewer auf
          # den Bot-Branch gepusht hat, beim naechsten Lauf stillschweigend weg.
          # Das Skript bricht ab, wenn der Branch fremde Commits traegt, und
          # pusht sonst mit Lease.
          "$GITHUB_WORKSPACE/.catalog/scripts/push-bot-branch.sh" \
            "$CLEANUP_BRANCH" "origin/$DEFAULT_BRANCH" 'serverkraken-release-bot[bot]'

          # Build a markdown bullet list of removed files for the PR body.
          removed_list=""
          for f in "${matched[@]}"; do
            removed_list+="- \`$f\`"$'\n'
          done

          pr_a_ref="(no companion PR opened)"
          if [[ -n "$PR_A_URL" ]]; then
            pr_a_ref="$PR_A_URL"
          fi

          body=$(cat <<EOF
          ## Retire legacy workflows

          Removes the following files, which are now covered by reusable workflows from \`serverkraken/reusable-workflows@${PIN}\`:

          ${removed_list}

          **Soft dependency:** companion PR ${pr_a_ref} ("onboard reusable-workflows") should be merged
          and have run at least one successful release before merging this PR.
          Otherwise this repo loses its release flow until the new one is exercised.

          _Opened by the \`onboard.yml\` workflow in \`serverkraken/reusable-workflows\`._
          EOF
          )

          if [[ -n "$existing_pr_num" ]]; then
            gh pr edit "$existing_pr_num" --repo "$TARGET_REPO" \
              --title "chore: remove legacy workflows superseded by reusable-workflows@${PIN}" \
              --body "$body"
            pr_url=$(gh pr view "$existing_pr_num" --repo "$TARGET_REPO" --json url -q .url)
          else
            gh pr create --repo "$TARGET_REPO" \
                         --base "$DEFAULT_BRANCH" --head "$CLEANUP_BRANCH" \
                         --title "chore: remove legacy workflows superseded by reusable-workflows@${PIN}" \
                         --body "$body" >/dev/null
            pr_url=$(gh pr view "$CLEANUP_BRANCH" --repo "$TARGET_REPO" --json url -q .url)
          fi
          echo "pr_b_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_b_status=cleanup-open" >> "$GITHUB_OUTPUT"

      - name: Emit per-target result artifact
        if: always()
        env:
          TARGET: ${{ matrix.target.target }}
          LANG: ${{ steps.detect.outputs.language || '' }}
          CUR_VER: ${{ steps.detect.outputs.current_version || '' }}
          PR_A_URL: ${{ steps.pr_a.outputs.pr_a_url || '' }}
          # Distinguish deliberate dry-run skip from real failure so the summary table
          # doesn't show "error / error" on a successful dry-run.
          PR_A_STATUS: ${{ steps.pr_a.outputs.pr_a_status || (inputs.dry_run && 'dry-run' || 'error') }}
          PR_B_URL: ${{ steps.pr_b.outputs.pr_b_url || '' }}
          PR_B_STATUS: ${{ steps.pr_b.outputs.pr_b_status || (inputs.dry_run && 'dry-run' || 'error') }}
          JOB_STATUS: ${{ job.status }}
          PROFILE: ${{ steps.detect.outputs.profile_json || '' }}
        run: |
          set -euo pipefail
          mkdir -p result
          # Sanitize target slash → dash for artifact name
          safe_name="${TARGET//\//-}"
          # Carry gitops_consumers through to the result JSON so the finalize
          # job's status-doc step can render a "Consumers" cell without
          # re-running detection. Fall back to [] if PROFILE is empty/invalid
          # (e.g. detect never ran on a failed job). jq exits 0 with EMPTY
          # stdout on empty/whitespace input (not a nonzero exit), so an
          # `|| gc_json='[]'` alone does not catch that case — check
          # for blank PROFILE explicitly first, then re-validate whatever
          # jq produced is actually a JSON array before it ever reaches
          # `--argjson` (a non-array value there would also abort the script).
          if [[ -z "${PROFILE//[[:space:]]/}" ]]; then
            gc_json='[]'
          else
            gc_json=$(jq -c '.gitops_consumers // []' <<<"$PROFILE" 2>/dev/null) || gc_json='[]'
          fi
          [[ -n "$gc_json" ]] || gc_json='[]'
          jq -e 'type=="array"' <<<"$gc_json" >/dev/null 2>&1 || gc_json='[]'
          jq -n \
            --arg target "$TARGET" \
            --arg language "$LANG" \
            --arg version "$CUR_VER" \
            --arg pr_a_url "$PR_A_URL" \
            --arg pr_a_status "$PR_A_STATUS" \
            --arg pr_b_url "$PR_B_URL" \
            --arg pr_b_status "$PR_B_STATUS" \
            --arg job_status "$JOB_STATUS" \
            --argjson gitops_consumers "$gc_json" \
            '{target: $target, language: $language, version: $version,
              pr_a_url: $pr_a_url, pr_a_status: $pr_a_status,
              pr_b_url: $pr_b_url, pr_b_status: $pr_b_status,
              job_status: $job_status, gitops_consumers: $gitops_consumers}' \
            > "result/$safe_name.json"
          echo "Artifact contents:"
          cat "result/$safe_name.json"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: onboard-result-${{ matrix.target.owner }}-${{ matrix.target.name }}
          path: result/
          retention-days: 7

  finalize:
    needs: [guard-caller, onboard]
    # always() alone would let finalize run even when the caller guard
    # rejected the run — and finalize is the job that writes to the catalog.
    if: always() && needs.guard-caller.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Mint App token for catalog repo
        id: catalog-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: serverkraken
          repositories: reusable-workflows

      - name: Checkout catalog on main
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: main
          token: ${{ steps.catalog-token.outputs.token }}
          fetch-depth: 0

      - name: Download all result artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: results
          pattern: onboard-result-*
          merge-multiple: true

      - name: Build step summary table
        id: summary
        run: |
          set -euo pipefail
          {
            echo "### Onboarding run summary"
            echo ""
            echo "| Repository | Language | Version | Add PR | Cleanup PR | Status | Consumers |"
            echo "|---|---|---|---|---|---|---|"
            for f in results/*.json; do
              [[ -f "$f" ]] || continue
              target=$(jq -r '.target' "$f")
              lang=$(jq -r '.language' "$f")
              ver=$(jq -r '.version' "$f")
              pa=$(jq -r '.pr_a_url' "$f")
              pas=$(jq -r '.pr_a_status' "$f")
              pb=$(jq -r '.pr_b_url' "$f")
              pbs=$(jq -r '.pr_b_status' "$f")
              js=$(jq -r '.job_status' "$f")

              if [[ "$pas" == "dry-run" && "$pbs" == "dry-run" ]]; then
                combined="dry-run (rendered diff in logs)"
              elif [[ "$pas" == "no-changes" && "$pbs" == "no-legacy" ]]; then
                combined="complete"
              elif [[ "$pas" == "no-changes" && "$pbs" == "cleanup-open" ]]; then
                combined="cleanup-open"
              elif [[ "$pas" == "add-open" && "$pbs" == "no-legacy" ]]; then
                combined="add-open, no-legacy"
              elif [[ "$pas" == "add-open" && "$pbs" == "cleanup-open" ]]; then
                combined="add-open, cleanup-open"
              else
                combined="$pas / $pbs"
              fi
              if [[ "$js" != "success" ]]; then
                combined="error ($combined)"
              fi

              pa_md="—"
              pb_md="—"
              [[ -n "$pa" ]] && pa_md="[link]($pa)"
              [[ -n "$pb" ]] && pb_md="[link]($pb)"

              # Same cell the status-doc step writes: the manifest's gitops[]
              # inventory, em dash when the target declares none.
              consumers_cell=$(jq -r '(.gitops_consumers // []) | map(.repo) | join(", ")' "$f")
              [[ -z "$consumers_cell" ]] && consumers_cell="—"

              echo "| $target | $lang | $ver | $pa_md | $pb_md | $combined | $consumers_cell |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # Also emit a machine-readable copy for the status-doc step.
          cp -r results results-for-status

      - name: Update docs/onboarding-status.md
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.catalog-token.outputs.token }}
          PIN_VERSION: ${{ inputs.pin_version }}
        run: |
          set -euo pipefail
          bot_id=$(gh api '/users/serverkraken-release-bot[bot]' -q '.id')
          git config user.name 'serverkraken-release-bot[bot]'
          git config user.email "${bot_id}+serverkraken-release-bot[bot]@users.noreply.github.com"

          DOC=docs/onboarding-status.md
          if [[ ! -f "$DOC" ]]; then
            echo "::warning::$DOC missing — initializing"
            cat > "$DOC" <<EOF
          # Onboarding Status

          _Last updated by the onboarding workflow: $(date -u +%Y-%m-%dT%H:%M:%SZ)_

          | Repository | Onboarded | Catalog Version | Add PR | Cleanup PR | Status | Consumers |
          |---|---|---|---|---|---|---|
          EOF
          fi

          # Re-derive "Last updated" line.
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sed -i "s|^_Last updated by the onboarding workflow:.*|_Last updated by the onboarding workflow: ${stamp}_|" "$DOC"

          # For each result, replace or append a row.
          for f in results-for-status/*.json; do
            [[ -f "$f" ]] || continue
            # A truncated/empty result file (e.g. the emit step aborted before
            # writing valid JSON) must never turn into a blank-target row in
            # the status doc — skip it loudly instead.
            if ! target=$(jq -e -r '.target' "$f" 2>/dev/null) || [[ -z "$target" ]]; then
              echo "::warning::skipping malformed or empty result file: $f"
              continue
            fi
            # Row construction lives in a script so its two rules can be
            # tested: a failed run must not restamp the "Onboarded" date, and
            # a result without a target must not become a blank row. As inline
            # bash here, neither had ever been exercised.
            # Kein .catalog-Praefix: dieser Job checkt den Katalog in den
            # Workspace-Root aus (ref: main), weil er in den Katalog selbst
            # zurueckschreibt.
            if ! scripts/onboarding-status-row.sh \
                   "$DOC" "$f" "${PIN_VERSION:-v4}"; then
              echo "::warning::could not build a status row from $f"
              continue
            fi
          done

          if git diff --quiet -- "$DOC"; then
            echo "No status doc changes."
            exit 0
          fi

          git add "$DOC"
          git commit -m "chore(onboard): update onboarding-status.md [skip ci]"
          git push origin main
