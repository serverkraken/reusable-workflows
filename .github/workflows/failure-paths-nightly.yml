# .github/workflows/failure-paths-nightly.yml
# Nightly cron exercising all designed-failure-path tests of the catalog
# against the broken fixtures. Runs at 04:00 UTC daily and on
# workflow_dispatch. Does NOT run on pull_request — that's the whole
# point: keeps the designed-red test-*-fail jobs out of the PR check
#
# Bewusst OHNE Anzahl (Audit K-24): die Kommentare nannten 14 bzw. 15,
# tatsaechlich sind es 18 — und der Fund selbst sprach von 17. Eine Zahl,
# die von Hand mitgezogen werden muss, driftet zuverlaessig. Wer sie
# braucht, zaehlt nach:
#
#   rg -c '^  test-[a-z0-9-]*-fail:$' .github/workflows/failure-paths-nightly.yml
#   rg -c '^  assert-[a-z0-9-]*:$'    .github/workflows/failure-paths-nightly.yml
# rollup so the PR top-level badge stays green.
#
# Each test-X-fail job calls the atom workflow with a fixture engineered
# to fail. Its assert-X-fail sibling uses `if: always()` + result-check
# to verify failure occurred. If any assert observes anything other than
# `failure`, the report-regressions job opens (or comments on) an issue
# with label `failure-path-regression`.
#
# Sibling workflows: self-ci.yml + integration.yml (PR-time happy-paths).
name: failure-paths-nightly

on:
  schedule:
    - cron: '0 4 * * *'   # Daily 04:00 UTC
  workflow_dispatch:

# Atoms inherit secrets and declare their own permission caps. This
# top-level block must mirror the union of nested atom permissions.
# The integration.yml block is the closest reference and is reproduced
# here. kube-lint.yml declares security-events: write at workflow level,
# so it must be granted here even though upload_sarif: false on all
# trivy-* callers (no SARIF uploads in nightly).
permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read
  security-events: write

concurrency:
  group: failure-paths-nightly
  cancel-in-progress: false   # never cancel a running nightly mid-flight

jobs:
  # ----- lint-go: fail-path -----
  test-lint-go-fail:
    uses: ./.github/workflows/lint-go.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/go-lint-fail

  assert-lint-go-fail:
    needs: test-lint-go-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-go-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-go-fail: correctly observed failure"

  # ----- lint-helm: fail-path -----
  test-lint-helm-fail:
    uses: ./.github/workflows/lint-helm.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test
      charts_dir: helm-lint-fail

  assert-lint-helm-fail:
    needs: test-lint-helm-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-helm-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-helm-fail: correctly observed failure"

  test-lint-helm-unittest-fail:
    uses: ./.github/workflows/lint-helm.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test
      charts_dir: helm-unittest-fail
      unittest: true

  # Audit G-4: unittest ist ein OPT-IN. Ein Chart OHNE Testdateien meldete
  # "Test Suites: 0 passed, 0 total" und beendete sich mit rc=0 — der Job war
  # gruen, geprueft wurde nichts. Nicht zu verwechseln mit
  # helm-unittest-fail: dort existieren Tests und schlagen fehl.
  test-lint-helm-unittest-empty:
    uses: ./.github/workflows/lint-helm.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test
      charts_dir: helm-unittest-empty
      unittest: true

  assert-lint-helm-unittest-empty:
    needs: test-lint-helm-unittest-empty
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-helm-unittest-empty.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail on a chart without test suites, got: $RESULT"
            exit 1
          fi
          echo "lint-helm-unittest-empty: correctly observed failure"

  assert-lint-helm-unittest-fail:
    needs: test-lint-helm-unittest-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-helm-unittest-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-helm-unittest-fail: correctly observed failure"

  # ----- lint-python: fail-path -----
  test-lint-python-fail:
    uses: ./.github/workflows/lint-python.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/python-lint-fail

  assert-lint-python-fail:
    needs: test-lint-python-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-python-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-python-fail: correctly observed failure"

  # ----- lint-rust: fail-path -----
  test-lint-rust-fail:
    uses: ./.github/workflows/lint-rust.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/rust-lint-fail

  assert-lint-rust-fail:
    needs: test-lint-rust-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-rust-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-rust-fail: correctly observed failure"

  # ----- test-go: cov-fail-path -----
  test-test-go-cov-fail:
    uses: ./.github/workflows/test-go.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/go-cov-fail
      coverage_threshold: 90

  assert-test-go-cov-fail:
    needs: test-test-go-cov-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert test job failed
        env:
          RESULT: ${{ needs.test-test-go-cov-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected test job to fail (coverage gate), got: $RESULT"
            exit 1
          fi
          echo "test-go-cov-fail: correctly observed failure"

  # ----- test-python: cov-fail-path -----
  test-test-python-cov-fail:
    uses: ./.github/workflows/test-python.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/python-cov-fail
      coverage_threshold: 90

  assert-test-python-cov-fail:
    needs: test-test-python-cov-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the COVERAGE gate failed, not something else
        env:
          RESULT: ${{ needs.test-test-python-cov-fail.result }}
          PCT: ${{ needs.test-test-python-cov-fail.outputs.coverage_pct }}
          THRESHOLD: '90'
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected test job to fail (coverage gate), got: $RESULT"
            exit 1
          fi
          # `result == failure` alone proves nothing about WHY. Until
          # 2026-08-25 this fixture carried no tests at all, so pytest exited 5
          # ("no tests collected") and this assertion went green while the
          # coverage gate itself was never exercised — which is exactly how the
          # bare `--cov` bug survived. Requiring a real, sub-threshold
          # percentage proves coverage ran and measured something.
          if [[ -z "$PCT" || "$PCT" == "N/A" ]]; then
            echo "::error::no coverage percentage reported — the job failed for some other reason, so the coverage gate is unverified"
            exit 1
          fi
          if ! awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN{exit !(p+0 < t+0)}'; then
            echo "::error::coverage was ${PCT}%, not below the ${THRESHOLD}% threshold — the fixture no longer exercises the gate"
            exit 1
          fi
          echo "test-python-cov-fail: coverage ${PCT}% < ${THRESHOLD}% — gate verified"

  # ----- test-rust: cov-fail-path -----
  test-test-rust-cov-fail:
    uses: ./.github/workflows/test-rust.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/rust-cov-fail
      coverage_threshold: 90

  assert-test-rust-cov-fail:
    needs: test-test-rust-cov-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert test job failed
        env:
          RESULT: ${{ needs.test-test-rust-cov-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected test job to fail (coverage gate), got: $RESULT"
            exit 1
          fi
          echo "test-rust-cov-fail: correctly observed failure"

  # ----- cleanup-images: fail-path -----
  # Empty runs_on array forces atom-level input-validation failure (matrix
  # evaluation requires non-empty input).
  test-cleanup-images-fail:
    uses: ./.github/workflows/cleanup-images.yml
    secrets: inherit
    with:
      runs_on: '[]'

  assert-cleanup-images-fail:
    needs: test-cleanup-images-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-cleanup-images-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected cleanup-images to fail for empty runs_on, got result=$RESULT"
            exit 1
          fi
          echo "cleanup-images correctly failed for empty runs_on"

  # ----- docker-build-multi: fail-path -----
  # Empty images array must fail at input validation before any runner
  # work begins. caller_id disambiguates concurrency from any happy-path
  # docker-build-multi caller running on the same ref (none today in
  # nightly, but defensive).
  test-docker-build-multi-fail:
    uses: ./.github/workflows/docker-build-multi.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/multi-image
      images: '[]'
      sign: false
      attest: false
      sbom: false
      caller_id: fail
      # Input-Validierung, kein echter Build — der billigste Runner reicht.
      runs_on_parse: '["ubuntu-latest"]'
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'

  assert-docker-build-multi-fail:
    needs: test-docker-build-multi-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-docker-build-multi-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected docker-build-multi to fail for empty images array, got result=$RESULT"
            exit 1
          fi
          echo "docker-build-multi correctly failed for empty images array"

  # ----- goreleaser: fail-path -----
  # Fixture has a deliberately broken .goreleaser.yaml (version: 99,
  # unknown top-level key, invalid build targets). Atom exits non-zero
  # at config validation.
  test-goreleaser-fail:
    uses: ./.github/workflows/goreleaser.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/cli-go-no-config
      snapshot: true

  assert-goreleaser-fail:
    needs: test-goreleaser-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-goreleaser-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected goreleaser to fail for broken .goreleaser.yaml, got result=$RESULT"
            exit 1
          fi
          echo "goreleaser correctly failed for broken .goreleaser.yaml"

  # ----- helm-publish: fail-path -----
  # Fixture has a broken Chart.yaml. Atom must fail at helm lint /
  # package step before any push attempt.
  test-helm-publish-fail:
    uses: ./.github/workflows/helm-publish.yml
    secrets: inherit
    with:
      chart_path: tests/fixtures/helm-broken
      oci_registry: ghcr.io/serverkraken/test
      dry_run: true

  assert-helm-publish-fail:
    needs: test-helm-publish-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-helm-publish-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected helm-publish to fail for broken Chart.yaml, got result=$RESULT"
            exit 1
          fi
          echo "helm-publish correctly failed for broken Chart.yaml"

  # ----- kube-validate: fail-path -----
  # Invalid manifest (additional property under a known schema) → kubeconform
  # -strict rejects → atom exits non-zero.
  test-kube-validate-fail:
    uses: ./.github/workflows/kube-validate.yml
    secrets: inherit
    with:
      manifests_paths: tests/fixtures/gitops-invalid-manifest/kubernetes/apps
      sops: false

  assert-kube-validate-fail:
    needs: test-kube-validate-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert validate job failed
        env:
          RESULT: ${{ needs.test-kube-validate-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected kube-validate to fail on invalid manifest, got: $RESULT"
            exit 1
          fi
          echo "kube-validate-fail: correctly observed failure"

  # ----- chart-image-bump: fail-path. Das Atom hatte bis zum K-2-Fix ueberhaupt
  #       keinen Self-CI-Aufrufer; die Repo-Konvention verlangt zu jedem Atom
  #       einen Happy- UND einen Fehlerpfad. Fehlt der erwartete Schluessel in
  #       der values.yaml, muss der Lauf rot werden — ein Chart, das still auf
  #       einem alten Tag stehenbliebe, ist das schlechtere Ergebnis. -----
  test-chart-image-bump-fail:
    uses: ./.github/workflows/chart-image-bump.yml
    secrets: inherit
    with:
      values_file: tests/fixtures/chart-image-bump/values-missing-key.yaml
      key_template: 'images.{name}.tag'
      releases: '{"images/api": {"version": "9.9.9"}}'
      images: '{"images/api": ["serverkraken/reusable-workflows/api"]}'
      commit: false
      runs_on: '["ubuntu-latest"]'

  assert-chart-image-bump-fail:
    needs: test-chart-image-bump-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the bump failed instead of silently doing nothing
        env:
          RESULT: ${{ needs.test-chart-image-bump-fail.result }}
          CHANGED: ${{ needs.test-chart-image-bump-fail.outputs.changed }}
        run: |
          set -euo pipefail
          fail=0
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::erwartet 'failure' bei fehlendem Schluessel, bekommen: $RESULT"
            fail=1
          fi
          # `result == failure` allein waere zu schwach — das ist K-4. Der Lauf
          # koennte auch am Token oder am Checkout gescheitert sein. `changed`
          # muss leer bleiben: haette das Atom etwas gebumpt und WAERE trotzdem
          # rot, waere die Ursache eine andere.
          if [[ -n "$CHANGED" && "$CHANGED" != "false" ]]; then
            echo "::error::changed='$CHANGED' — es wurde etwas gebumpt, der Fehlschlag hat also eine andere Ursache"
            fail=1
          fi
          # Der Grund selbst (die 'not found in'-Meldung) steht nur im Log des
          # anderen Jobs und ist von hier aus nicht lesbar. Anders als bei
          # test-python, wo das Atom `coverage_pct` herausgibt, existiert hier
          # kein Output, an dem sich der Grund festmachen liesse.
          exit "$fail"

  # ----- kube-lint: fail-path -----
  # Violation fixture (nginx:latest, no resource limits, no securityContext)
  # trips the baseline kube-linter default checks → findings_count > 0 →
  # with fail_on_findings (default true) the atom's gate step exits non-zero.
  # No config_path so the catalog baseline (default checks) is used.
  test-kube-lint-fail:
    uses: ./.github/workflows/kube-lint.yml
    secrets: inherit
    with:
      manifests_path: tests/fixtures/gitops-lint-violation/kubernetes/apps
      fail_on_findings: true   # default, but explicit
      upload_sarif: false

  assert-kube-lint-fail:
    needs: test-kube-lint-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-kube-lint-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected kube-lint to fail on violation fixture, got: $RESULT"
            exit 1
          fi
          echo "kube-lint-fail: correctly observed failure"

  # ----- secret-scan: fail-path -----
  # Planted-secret fixture (AWS access key in a tracked file) → gitleaks
  # detect finds it → findings_count > 0 → with fail_on_findings (default
  # true) the atom's gate step exits non-zero. no_git scans the directory
  # tree directly (no commit history needed in the fixture).
  test-secret-scan-fail:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
    with:
      no_git: true
      scan_path: tests/fixtures/gitops-planted-secret
      fail_on_findings: true
      upload_sarif: false

  assert-secret-scan-fail:
    needs: test-secret-scan-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert scan job failed
        env:
          RESULT: ${{ needs.test-secret-scan-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected secret-scan to fail on planted-secret fixture, got: $RESULT"
            exit 1
          fi
          echo "secret-scan-fail: correctly observed failure"

  # ----- build-flutter-android: fail-path -----
  # A --flavor that no Gradle flavor defines aborts the build (Gradle cannot
  # resolve the assemble task) — exercises failure propagation without a
  # dedicated broken fixture.
  test-build-flutter-android-fail:
    uses: ./.github/workflows/build-flutter-android.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/flutter-app
      use_build_runner: false
      flavor: nonexistent

  assert-build-flutter-android-fail:
    needs: test-build-flutter-android-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert build job failed
        env:
          RESULT: ${{ needs.test-build-flutter-android-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected build-flutter-android to fail on nonexistent flavor, got: $RESULT"
            exit 1
          fi
          echo "build-flutter-android-fail: correctly observed failure"

  # ----- e2e-kind: fail-path -----
  # Fixture creates a cluster then exits 1 without deleting it. Asserts:
  # (a) the atom job failed, (b) the diagnostics artifact was uploaded.
  # (c) no-leak is asserted INSIDE the atom's cleanup step itself — a
  # separate job cannot see the runner pod's dind.
  test-e2e-kind-fail:
    uses: ./.github/workflows/e2e-kind.yml
    secrets: inherit
    with:
      script: tests/fixtures/kind-smoke/e2e-fail.sh
      timeout_minutes: 15

  assert-e2e-kind-fail:
    needs: test-e2e-kind-fail
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the atom failed and produced diagnostics
        env:
          RESULT: ${{ needs.test-e2e-kind-fail.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected e2e-kind to fail on the fail fixture, got: $RESULT"
            exit 1
          fi
          names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                    --jq '.artifacts[].name')
          if ! grep -qx "e2e-kind-diagnostics" <<< "$names"; then
            echo "::error::diagnostics artifact 'e2e-kind-diagnostics' missing; artifacts were: ${names:-<none>}"
            exit 1
          fi
          echo "e2e-kind failed as designed and uploaded diagnostics"

  # ----- Regression Reporter -----
  # Runs after ALL assert-* jobs (siehe needs: unten). The job always runs
  # (if: always()),
  # but the bash step short-circuits when no asserts failed — gating in
  # bash rather than via the workflow-level `if:` expression. An earlier
  # smoke-test (issue #147) showed that `if: always() && contains(needs.*.result,
  # 'failure')` lets the job through even when all needs returned success,
  # which created a false-positive issue. Bash-level gate is robust against
  # any GHA expression-evaluation quirks.
  #
  # Opens a new issue with label `failure-path-regression` OR comments on
  # an existing open one — single-issue-pattern keeps the inbox clean.
  report-regressions:
    needs:
      - assert-lint-go-fail
      - assert-lint-helm-fail
      - assert-lint-helm-unittest-fail
      - assert-lint-helm-unittest-empty
      - assert-lint-python-fail
      - assert-lint-rust-fail
      - assert-test-go-cov-fail
      - assert-test-python-cov-fail
      - assert-test-rust-cov-fail
      - assert-cleanup-images-fail
      - assert-docker-build-multi-fail
      - assert-goreleaser-fail
      - assert-helm-publish-fail
      - assert-kube-validate-fail
      - assert-kube-lint-fail
      - assert-chart-image-bump-fail
      - assert-secret-scan-fail
      - assert-build-flutter-android-fail
      - assert-e2e-kind-fail
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJson(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | .[].key
          ' | paste -sd ',' -)

          if [[ -z "$failed" ]]; then
            echo "Alle assert-*-Jobs meldeten Erfolg."

            # Audit K-23: hier stand nur `exit 0`. Damit wurde eine einmal
            # geoeffnete Regression NIE wieder geschlossen — das Issue blieb
            # offen stehen und behauptete weiter einen Zustand, den es laengst
            # nicht mehr gab. Wer es spaeter las, konnte nicht unterscheiden,
            # ob die Regression noch besteht.
            #
            # Das ist die Umkehrung von K-20: dort lief der Meldeweg nicht,
            # wenn es etwas zu melden gab; hier laeuft er nicht, wenn es etwas
            # zu ENTWARNEN gibt. Beide Male bleibt der Leser im Unklaren.
            #
            # Kommentiert wird vor dem Schliessen, damit im Verlauf steht,
            # WANN und durch welchen Lauf die Entwarnung kam.
            open_issue=$(gh issue list \
              --label failure-path-regression \
              --state open --limit 1 --json number --jq '.[0].number // empty')
            if [[ -n "$open_issue" ]]; then
              gh issue comment "$open_issue" \
                --body "Nightly $(date -u +%Y-%m-%d) — alle failure-path-Asserts sind wieder gruen. Kein offener Regressionsbefund mehr. Run: $RUN_URL"
              gh issue close "$open_issue" \
                --reason completed \
                --comment "Automatisch geschlossen: der naechtliche Lauf hat die Regression nicht mehr beobachtet."
              echo "Regressions-Issue #$open_issue geschlossen — wieder gruen."
            else
              echo "Kein offenes Regressions-Issue — nichts zu entwarnen."
            fi
            exit 0
          fi

          today=$(date -u +%Y-%m-%d)

          existing=$(gh issue list \
            --label failure-path-regression \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "Nightly $today — failed asserts: \`$failed\`. Run: $RUN_URL"
            echo "Commented on existing regression issue #$existing"
          else
            gh issue create \
              --label failure-path-regression \
              --title "[failure-path-regression] nightly $today: $failed" \
              --body "Nightly \`failure-paths-nightly.yml\` ran on $today and one or more failure-path asserts did not observe the expected failure.

          **Failed asserts:** \`$failed\`
          **Run:** $RUN_URL

          **Likely causes:**
          - Atom logic was refactored and no longer fails on the broken fixture
          - Fixture is stale (action version updated, behavior changed)
          - Action version drift (e.g., goreleaser-action auto-generates default config)

          **Triage checklist:**
          - [ ] Identify which atom/fixture pair regressed (see failed-asserts list above)
          - [ ] Inspect recent commits to the named atom workflow
          - [ ] Verify the fixture still triggers the failure mode under the current atom logic
          - [ ] Repair atom OR fixture OR remove the failure-path test if obsolete
          - [ ] Close this issue with a link to the fixing PR"
            echo "Created new regression issue"
          fi
