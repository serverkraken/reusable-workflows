# .github/workflows/failure-paths-nightly.yml
# Nightly cron exercising all designed-failure-path tests of the catalog
# against the broken fixtures. Runs at 04:00 UTC daily and on
# workflow_dispatch. Does NOT run on pull_request — that's the whole
# point: keeps the designed-red test-*-fail jobs out of the PR check
#
# Bewusst OHNE Anzahl (Audit K-24): die Kommentare nannten 14 bzw. 15,
# tatsaechlich sind es 18 — und der Fund selbst sprach von 17. Eine Zahl,
# die von Hand mitgezogen werden muss, driftet zuverlaessig. Wer sie
# braucht, zaehlt nach:
#
#   rg -c '^  test-[a-z0-9-]*-fail:$' .github/workflows/failure-paths-nightly.yml
#   rg -c '^  assert-[a-z0-9-]*:$'    .github/workflows/failure-paths-nightly.yml
# rollup so the PR top-level badge stays green.
#
# Each test-X-fail job calls the atom workflow with a fixture engineered
# to fail. Its assert-X-fail sibling uses `if: always()` + result-check
# to verify failure occurred. If any assert observes anything other than
# `failure`, the report-regressions job opens (or comments on) an issue
# with label `failure-path-regression`.
#
# Sibling workflows: self-ci.yml + integration.yml (PR-time happy-paths).
name: failure-paths-nightly

on:
  schedule:
    - cron: '0 4 * * *'   # Daily 04:00 UTC
  workflow_dispatch:

# Atoms inherit secrets and declare their own permission caps. This
# top-level block must mirror the union of nested atom permissions.
# The integration.yml block is the closest reference and is reproduced
# here. kube-lint.yml declares security-events: write at workflow level,
# so it must be granted here even though upload_sarif: false on all
# trivy-* callers (no SARIF uploads in nightly).
permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read
  security-events: write

concurrency:
  group: failure-paths-nightly
  cancel-in-progress: false   # never cancel a running nightly mid-flight

jobs:
  # ----- lint-go: fail-path -----
  test-lint-go-fail:
    uses: ./.github/workflows/lint-go.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/go-lint-fail

  assert-lint-go-fail:
    needs: test-lint-go-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-go-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-go-fail: correctly observed failure"

  # ----- lint-helm: fail-path -----
  test-lint-helm-fail:
    uses: ./.github/workflows/lint-helm.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test
      charts_dir: helm-lint-fail

  assert-lint-helm-fail:
    needs: test-lint-helm-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-helm-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-helm-fail: correctly observed failure"

  test-lint-helm-unittest-fail:
    uses: ./.github/workflows/lint-helm.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test
      charts_dir: helm-unittest-fail
      unittest: true

  # Audit G-4: unittest ist ein OPT-IN. Ein Chart OHNE Testdateien meldete
  # "Test Suites: 0 passed, 0 total" und beendete sich mit rc=0 — der Job war
  # gruen, geprueft wurde nichts. Nicht zu verwechseln mit
  # helm-unittest-fail: dort existieren Tests und schlagen fehl.
  test-lint-helm-unittest-empty:
    uses: ./.github/workflows/lint-helm.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test
      charts_dir: helm-unittest-empty
      unittest: true

  assert-lint-helm-unittest-empty:
    needs: test-lint-helm-unittest-empty
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-helm-unittest-empty.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail on a chart without test suites, got: $RESULT"
            exit 1
          fi
          echo "lint-helm-unittest-empty: correctly observed failure"

  assert-lint-helm-unittest-fail:
    needs: test-lint-helm-unittest-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-helm-unittest-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-helm-unittest-fail: correctly observed failure"

  # ----- lint-python: fail-path -----
  test-lint-python-fail:
    uses: ./.github/workflows/lint-python.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/python-lint-fail

  assert-lint-python-fail:
    needs: test-lint-python-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-python-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-python-fail: correctly observed failure"

  # ----- lint-rust: fail-path -----
  test-lint-rust-fail:
    uses: ./.github/workflows/lint-rust.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/rust-lint-fail

  assert-lint-rust-fail:
    needs: test-lint-rust-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-lint-rust-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint job to fail, got: $RESULT"
            exit 1
          fi
          echo "lint-rust-fail: correctly observed failure"

  # ----- lint-shell: fail-path -----
  # lint-shell-findings in self-ci.yml runs with fail_on_findings: false and
  # only asserts the findings count — it never proves the gate itself fires.
  # This pair supplies the missing proof: same findings fixture, gate ON.
  test-lint-shell-fail:
    uses: ./.github/workflows/lint-shell.yml
    secrets: inherit
    with:
      paths: |-
        tests/fixtures/shell-findings/scripts/*.sh
      scan_shebangs: true
      sarif: false
      fail_on_findings: true   # default, but explicit

  assert-lint-shell-fail:
    needs: test-lint-shell-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the FINDINGS gate failed, not something else
        env:
          RESULT: ${{ needs.test-lint-shell-fail.result }}
          COUNT: ${{ needs.test-lint-shell-fail.outputs.findings_count }}
          FILES: ${{ needs.test-lint-shell-fail.outputs.file_count }}
        run: |
          set -euo pipefail
          fail=0
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint-shell to fail on findings fixture, got: $RESULT"
            fail=1
          fi
          # `result == failure` allein beweist nichts ueber das WARUM: ein
          # OOM-Kill, ein gescheiterter Tool-Download oder ein Syntaxfehler im
          # Atom faerben den Job genauso rot, und die Assertion meldete dann,
          # das Gate habe funktioniert. Beide Outputs werden VOR dem Gate
          # gesetzt; ein frueher abgestuerzter Job laesst sie leer.
          if [[ -z "$FILES" || "$FILES" == "0" ]]; then
            echo "::error::file_count='${FILES}' — der Collect-Schritt lief nicht oder fand nichts, das Findings-Gate ist damit unbewiesen"
            fail=1
          fi
          if [[ -z "$COUNT" ]]; then
            echo "::error::findings_count ist leer — shellcheck lief nicht durch, der Fehlschlag hat also eine andere Ursache als das Gate"
            fail=1
          elif [[ "$COUNT" == "0" ]]; then
            echo "::error::findings_count=0 — die Fixture traegt keine Funde mehr, das Gate wurde nie ausgeloest"
            fail=1
          fi
          [[ "$fail" == "0" ]] || exit 1
          echo "lint-shell-fail: Gate korrekt ausgeloest (${COUNT} Funde in ${FILES} Datei(en))"

  # ----- lint-shell: leerer Glob-Treffer -----
  # Der realistische Ausloeser ist Glob-Drift: ein Adopter benennt scripts/
  # um, sein gepinntes ci.yml sagt weiter `scripts/**/*.sh`. Frueher lieferte
  # das ein synthetisches {"comments":[]}, exit 0 und "✓ no findings" — das
  # Gate war fuer immer gruen, ohne je eine Zeile geprueft zu haben.
  # Der Pfad wird bewusst leer gelassen: `scan_shebangs` bleibt AN, damit
  # bewiesen ist, dass der Abbruch NACH beiden Durchgaengen greift und nicht
  # nur der Glob-Pass leer war.
  test-lint-shell-empty:
    uses: ./.github/workflows/lint-shell.yml
    secrets: inherit
    with:
      paths: |-
        tests/fixtures/gibt-es-nicht/**/*.sh
      scan_shebangs: true
      sarif: false

  assert-lint-shell-empty:
    needs: test-lint-shell-empty
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed on an empty match
        env:
          RESULT: ${{ needs.test-lint-shell-empty.result }}
          FILES: ${{ needs.test-lint-shell-empty.outputs.file_count }}
          COUNT: ${{ needs.test-lint-shell-empty.outputs.findings_count }}
        run: |
          set -euo pipefail
          fail=0
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint-shell to fail when its globs match nothing, got: $RESULT"
            fail=1
          fi
          # Fuer diesen Job war findings_count als Beweis untauglich: das Atom
          # bricht ab, BEVOR gezaehlt wird, der Wert bleibt also auch dann
          # leer, wenn der Job schon am Checkout gestorben waere. Der Collect-
          # Schritt schreibt sein `count` aber, bevor er bei null Treffern
          # abbricht — genau deshalb gibt das Atom es als `file_count` heraus.
          # '0' beweist: der Schritt lief, die Globs trafen nichts, und der
          # Abbruch kam aus der beabsichtigten Pruefung.
          if [[ "$FILES" != "0" ]]; then
            echo "::error::file_count='${FILES}' statt '0' — der Lauf ist vor dem Collect-Schritt gescheitert, der leere Glob ist damit unbewiesen"
            fail=1
          fi
          if [[ -n "$COUNT" ]]; then
            echo "::error::findings_count='${COUNT}' — es wurde doch gezaehlt, der Abbruch bei null Treffern griff also nicht"
            fail=1
          fi
          [[ "$fail" == "0" ]] || exit 1
          echo "lint-shell-empty: Abbruch bei null Treffern korrekt ausgeloest"

  # ----- lint-shell: shellcheck bricht fatal ab -----
  # shellcheck beendet mit rc=2, wenn es eine Datei nicht LESEN kann — und
  # legt dabei trotzdem einen gueltigen, leeren Bericht auf stdout:
  #
  #   $ shellcheck -f json1 -S style gibtsnicht.sh
  #   rc=2 · stdout {"comments":[]} · stderr "openBinaryFile: does not exist"
  #
  # Daran lief die alte Pruefung (`rc != 0 && ! -s shellcheck.json`) vorbei:
  # Bericht nicht leer → Bedingung greift nicht → gueltiges SARIF → Count 0 →
  # gruen, ohne eine Zeile geprueft zu haben. Die Fixture traegt einen
  # getrackten, KAPUTTEN Symlink mit .sh-Endung: `git ls-files` listet ihn,
  # shellcheck kann ihn nicht oeffnen.
  test-lint-shell-unreadable:
    uses: ./.github/workflows/lint-shell.yml
    secrets: inherit
    with:
      paths: |-
        tests/fixtures/shell-unreadable/scripts/*.sh
      # AUS: der Shebang-Pass wuerde den kaputten Link per `[[ -f ]]`
      # aussortieren. Geprueft werden soll der Glob-Pass, der ihn weitergibt.
      scan_shebangs: false
      sarif: false

  assert-lint-shell-unreadable:
    needs: test-lint-shell-unreadable
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ein fataler shellcheck-Lauf darf nicht als Nullbefund durchgehen
        env:
          RESULT: ${{ needs.test-lint-shell-unreadable.result }}
          FILES: ${{ needs.test-lint-shell-unreadable.outputs.file_count }}
          COUNT: ${{ needs.test-lint-shell-unreadable.outputs.findings_count }}
        run: |
          set -euo pipefail
          fail=0
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::erwartet 'failure' fuer eine unlesbare Datei, bekam '${RESULT}' — der fatale Lauf gilt wieder als Nullbefund" >&2
            fail=1
          fi
          # `result == failure` allein bewiese nur, dass IRGENDWAS rot war.
          # file_count == 1 zeigt, dass der Collect-Schritt lief und den Link
          # weitergab; der Fehlschlag kam also aus dem shellcheck-Schritt und
          # nicht aus Checkout, Token oder Toolchain.
          if [[ "$FILES" != "1" ]]; then
            echo "::error::file_count='${FILES}' statt '1' — der Lauf ist vor dem shellcheck-Schritt gescheitert, das Gate ist damit unbewiesen" >&2
            fail=1
          fi
          # findings_count MUSS leer sein: liefe der Count-Schritt, dann haette
          # der Lint-Schritt den fatalen rc durchgewinkt — genau der Fehler.
          if [[ -n "$COUNT" ]]; then
            echo "::error::findings_count='${COUNT}' — der Count-Schritt lief, der fatale rc wurde also akzeptiert" >&2
            fail=1
          fi
          [[ "$fail" == "0" ]] || exit 1
          echo "lint-shell-unreadable: fataler shellcheck-Lauf korrekt abgelehnt"

  # ----- test-go: cov-fail-path -----
  test-test-go-cov-fail:
    uses: ./.github/workflows/test-go.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/go-cov-fail
      coverage_threshold: 90

  assert-test-go-cov-fail:
    needs: test-test-go-cov-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert test job failed
        env:
          RESULT: ${{ needs.test-test-go-cov-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected test job to fail (coverage gate), got: $RESULT"
            exit 1
          fi
          echo "test-go-cov-fail: correctly observed failure"

  # ----- test-python: cov-fail-path -----
  test-test-python-cov-fail:
    uses: ./.github/workflows/test-python.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/python-cov-fail
      coverage_threshold: 90

  assert-test-python-cov-fail:
    needs: test-test-python-cov-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the COVERAGE gate failed, not something else
        env:
          RESULT: ${{ needs.test-test-python-cov-fail.result }}
          PCT: ${{ needs.test-test-python-cov-fail.outputs.coverage_pct }}
          THRESHOLD: '90'
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected test job to fail (coverage gate), got: $RESULT"
            exit 1
          fi
          # `result == failure` alone proves nothing about WHY. Until
          # 2026-08-25 this fixture carried no tests at all, so pytest exited 5
          # ("no tests collected") and this assertion went green while the
          # coverage gate itself was never exercised — which is exactly how the
          # bare `--cov` bug survived. Requiring a real, sub-threshold
          # percentage proves coverage ran and measured something.
          if [[ -z "$PCT" || "$PCT" == "N/A" ]]; then
            echo "::error::no coverage percentage reported — the job failed for some other reason, so the coverage gate is unverified"
            exit 1
          fi
          if ! awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN{exit !(p+0 < t+0)}'; then
            echo "::error::coverage was ${PCT}%, not below the ${THRESHOLD}% threshold — the fixture no longer exercises the gate"
            exit 1
          fi
          echo "test-python-cov-fail: coverage ${PCT}% < ${THRESHOLD}% — gate verified"

  # ----- test-rust: cov-fail-path -----
  test-test-rust-cov-fail:
    uses: ./.github/workflows/test-rust.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/lint-test/rust-cov-fail
      coverage_threshold: 90

  assert-test-rust-cov-fail:
    needs: test-test-rust-cov-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert test job failed
        env:
          RESULT: ${{ needs.test-test-rust-cov-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected test job to fail (coverage gate), got: $RESULT"
            exit 1
          fi
          echo "test-rust-cov-fail: correctly observed failure"

  # ----- cleanup-images: fail-path -----
  # Empty runs_on array forces atom-level input-validation failure (matrix
  # evaluation requires non-empty input).
  # Dieser Fehlerpfad war seit 2026-08-25 rot (Issue #246) und niemand wusste
  # warum. Gemessen am Lauf 33050121217: ein leeres Label-Array laesst den Job
  # NICHT mehr scheitern — er wurde auf einem echten self-hosted Runner
  # eingeplant (serverkraken-runner-arm64-...) und lief mit `packages: write`
  # durch.
  #
  # Der Test hat also nicht das Atom geprueft, sondern ein Verhalten von
  # GitHub, das sich geaendert hat. Das Atom weist ein leeres runs_on jetzt
  # ausdruecklich ab — der Fehlschlag hier ist damit wieder eine Zusicherung
  # des Katalogs statt eines Zufalls.
  test-cleanup-images-fail:
    uses: ./.github/workflows/cleanup-images.yml
    secrets: inherit
    with:
      runs_on: '[]'

  assert-cleanup-images-fail:
    needs: test-cleanup-images-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-cleanup-images-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected cleanup-images to fail for empty runs_on, got result=$RESULT"
            exit 1
          fi
          echo "cleanup-images correctly failed for empty runs_on"

  # ----- lint-flutter OHNE build_runner gegen eine Codegen-Fixture (K-10) -----
  #
  # Gegenprobe zu `lint-flutter-codegen` in self-ci.yml. Ohne diese hier koennte
  # der dortige Test leer bestehen: waere die erzeugte Datei doch im Repo (oder
  # der `part`-Verweis verschwunden), liefe analyze auch ohne Generator gruen,
  # und niemand saehe es.
  #
  # Hier MUSS es scheitern — die Teil-Datei fehlt und die beiden erzeugten
  # Funktionen existieren nicht.
  test-lint-flutter-no-codegen:
    uses: ./.github/workflows/lint-flutter.yml
    secrets: inherit
    with:
      runs_on: '["ubuntu-latest"]'
      working_directory: tests/fixtures/flutter-app-codegen
      use_build_runner: false

  assert-lint-flutter-no-codegen:
    needs: test-lint-flutter-no-codegen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the lint failed without code generation
        env:
          RESULT: ${{ needs.test-lint-flutter-no-codegen.result }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected lint-flutter to FAIL with use_build_runner:false on a codegen fixture, got result=${RESULT}"
            echo "::error::if this is green, the fixture no longer needs the generator — and the happy-path test in self-ci proves nothing"
            exit 1
          fi
          echo "lint-flutter failed without the generator, as it must — the codegen fixture is still load-bearing."

  # ----- goreleaser OHNE snapshot: der echte Publish-Pfad (Audit K-12) -----
  #
  # Jeder Aufruf uebergab `snapshot: true`. Gebaut wurde damit, veroeffentlicht
  # nie — bei einem Atom, dessen Zweck das Veroeffentlichen ist. Ungetestet
  # blieben das Token-Wiring, das Anlegen des Releases und der Upload.
  #
  # Warum in der NIGHTLY und nicht in der PR-CI: dieser Pfad legt einen echten
  # Tag im Katalog an, und zwar in demselben Namensraum, aus dem release-please
  # seine Version ableitet. In der PR-CI liefe das parallel zu Merges auf
  # `main`. Die Nightly laeuft zu fester Zeit; das Fenster ist praktisch zu.
  # (Dieselbe Ueberlegung wie beim destruktiven cleanup-Test unten.)
  #
  # Zwei Riegel gegen Kollateralschaden:
  #   * Der Tag ist eine SEMVER-PRERELEASE weit unterhalb der echten Reihe
  #     (`v0.0.0-selftest.<run_id>`) — er kann nie "latest" werden.
  #   * Die Fixture setzt `release.draft: true`. Ein Entwurf steht nicht in der
  #     Release-Liste und ist fuer release-please unsichtbar. Der Publish-Pfad
  #     laeuft trotzdem vollstaendig durch.
  # Beides wird danach geloescht, auch wenn der Test scheitert.
  prepare-goreleaser-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Create the throwaway tag
        env:
          TAG: v0.0.0-selftest.${{ github.run_id }}
        run: |
          set -euo pipefail
          # goreleaser braucht im Nicht-Snapshot-Modus einen Tag AM Commit und
          # verlangt Semver. Deshalb ein Prerelease-Tag statt eines freien
          # Namens.
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag angelegt: $TAG"

  test-goreleaser-publish:
    needs: prepare-goreleaser-publish
    uses: ./.github/workflows/goreleaser.yml
    secrets: inherit
    # BEIDE Rechte, weil goreleaser.yml beide deklariert. Gewaehrt ein
    # Aufrufer weniger, weist GitHub den GESAMTEN Lauf beim Start ab —
    # `startup_failure`, ohne Annotation, ohne Job, ohne Log. Gemessen an den
    # Laeufen 33074131069 und 33074876898; das Gate
    # tests/conventions/check-reusable-permissions.py haelt das jetzt fest.
    permissions:
      contents: write
      packages: write
    with:
      runs_on: '["ubuntu-latest"]'
      working_directory: tests/fixtures/cli-go-with-goreleaser
      ref: v0.0.0-selftest.${{ github.run_id }}
      # Der Punkt der Sache.
      snapshot: false

  assert-goreleaser-publish:
    needs: [prepare-goreleaser-publish, test-goreleaser-publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Assert the release was really created with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARE: ${{ needs.prepare-goreleaser-publish.result }}
          ATOM: ${{ needs.test-goreleaser-publish.result }}
          TAG: v0.0.0-selftest.${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$PREPARE" != "success" ]]; then
            echo "::error::the throwaway tag was never created (result=${PREPARE}) — the test proves nothing"
            exit 1
          fi
          if [[ "$ATOM" != "success" ]]; then
            echo "::error::goreleaser failed with snapshot:false (result=${ATOM})"
            exit 1
          fi

          # Der Entwurf traegt keinen Tag-Namen in der Release-Liste, deshalb
          # ueber die API und nicht ueber `gh release view`.
          rel=$(gh api "/repos/${GITHUB_REPOSITORY}/releases" \
                  --jq "[.[] | select(.tag_name == \"${TAG}\")] | first")
          if [[ -z "$rel" || "$rel" == "null" ]]; then
            echo "::error::no release for ${TAG} — goreleaser built but published nothing"
            exit 1
          fi

          draft=$(jq -r '.draft' <<<"$rel")
          assets=$(jq -r '.assets | length' <<<"$rel")
          echo "release: draft=${draft} assets=${assets}"

          # Draft pruefen, sonst haette die Fixture-Sicherung still versagt und
          # ein sichtbares Release im Katalog hinterlassen.
          if [[ "$draft" != "true" ]]; then
            echo "::error::the release is NOT a draft — release.draft in the fixture did not take effect"
            exit 1
          fi
          # Ein Release ohne Assets waere ein leerer Publish: angelegt, aber
          # nichts hochgeladen. Genau die Haelfte, die der Snapshot nie zeigt.
          if (( assets == 0 )); then
            echo "::error::the release carries no assets — nothing was uploaded"
            exit 1
          fi
          echo "goreleaser created the release and uploaded ${assets} asset(s)."

      - name: Remove the draft release and the tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.0.0-selftest.${{ github.run_id }}
        run: |
          # Aufraeumen auch bei Fehlschlag: sonst sammeln sich Entwuerfe und
          # Tags je fehlgeschlagenem Lauf im Katalog an.
          id=$(gh api "/repos/${GITHUB_REPOSITORY}/releases" \
                 --jq "[.[] | select(.tag_name == \"${TAG}\")] | first | .id // empty" 2>/dev/null || true)
          if [[ -n "$id" ]]; then
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/releases/${id}" >/dev/null 2>&1 \
              && echo "draft release removed" || echo "draft release could not be removed"
          else
            echo "no draft release to remove"
          fi
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 \
            && echo "tag removed" || echo "tag already gone"

  # ----- cleanup-images DESTRUKTIV (Audit K-8) -----
  #
  # Der einzige positive Cleanup-Test war nicht-destruktiv: er lief gegen ein
  # Paket, das es nicht gibt, und pruefte damit nur den 404-Zweig
  # ("nichts zu putzen", seit D-12 ein legitimer Erfolg). Der Zweig, der
  # tatsaechlich LOESCHT, lief nie — bei einem Atom, dessen einzige Aufgabe
  # das Loeschen ist.
  #
  # Der Lauf legt sich sein Opfer selbst an und raeumt es weg: eigenes
  # GHCR-Paket je run_id, danach ist es fort. Kein Sandbox-Repo noetig, keine
  # fremden Images in Gefahr.
  #
  # Ueber den STABLE-Prune und nicht ueber den Prerelease-Prune, weil der
  # deterministisch ist: `.[$keep:]` mit keep=0 trifft die gesamte Liste. Der
  # Prerelease-Zweig haengt dagegen an `updated_at < CUTOFF`, und ein gerade
  # gepushtes Image liegt genau auf der Grenze — ein Test, der von der
  # Sekunde abhaengt, waere schlimmer als keiner.
  #
  # Deshalb auch der Tag `v0.0.1` ohne Zusatz: der Stable-Prune erkennt nur
  # `^v[0-9]+\.[0-9]+\.[0-9]+$`. Die Eindeutigkeit je Lauf steckt im
  # PAKETNAMEN, nicht im Tag.
  # ZWEI Versionen, damit eine geloescht werden kann und eine bleibt.
  #
  # Der erste Anlauf pushte nur v0.0.1 und setzte keep_stable_versions:0.
  # Gemessen am Lauf 33056414560: GitHub weist das ab — "You cannot delete
  # the last tagged version of a package". Ein Test, der genau in diesen
  # Grenzfall laeuft, prueft nicht den Prune, sondern eine Fehlermeldung.
  #
  # Mit zwei Versionen und keep:1 ist der Fall der realistische: der Prune
  # soll die AELTERE treffen und die neuere stehenlassen. Damit belegt der
  # Test auch, dass er das RICHTIGE loescht, nicht bloss irgendetwas.
  test-docker-build-for-cleanup:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: v0.0.1
      prerelease: false
      context: tests/fixtures/minimal-go
      dockerfile: tests/fixtures/minimal-go/Dockerfile
      image_name: ${{ github.repository }}/nightly-cleanup-fixture-${{ github.run_id }}
      platforms: linux/amd64
      sign: false
      attest: false
      sbom: false
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'

  test-docker-build-for-cleanup-second:
    # needs, nicht parallel: die Reihenfolge von created_at entscheidet, welche
    # Version der Prune behaelt. Zwei gleichzeitige Builds waeren ein Rennen.
    needs: test-docker-build-for-cleanup
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: v0.0.2
      prerelease: false
      context: tests/fixtures/minimal-go
      dockerfile: tests/fixtures/minimal-go/Dockerfile
      image_name: ${{ github.repository }}/nightly-cleanup-fixture-${{ github.run_id }}
      platforms: linux/amd64
      sign: false
      attest: false
      sbom: false
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'

  test-cleanup-images-destructive:
    needs: test-docker-build-for-cleanup-second
    uses: ./.github/workflows/cleanup-images.yml
    secrets: inherit
    with:
      package_name: reusable-workflows/nightly-cleanup-fixture-${{ github.run_id }}
      # 1 = die neueste behalten, alles aeltere loeschen. Der Prune muss also
      # wirklich etwas anfassen — und zwar genau v0.0.1.
      keep_stable_versions: 1
      runs_on: '["ubuntu-latest"]'

  assert-cleanup-images-destructive:
    needs: [test-docker-build-for-cleanup, test-docker-build-for-cleanup-second, test-cleanup-images-destructive]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Assert the version is really gone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: reusable-workflows/nightly-cleanup-fixture-${{ github.run_id }}
          BUILD_RESULT: ${{ needs.test-docker-build-for-cleanup-second.result }}
          CLEANUP_RESULT: ${{ needs.test-cleanup-images-destructive.result }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::the fixture image was never built (result=${BUILD_RESULT}) — nothing to clean, the test proves nothing"
            exit 1
          fi
          if [[ "$CLEANUP_RESULT" != "success" ]]; then
            echo "::error::cleanup-images failed (result=${CLEANUP_RESULT})"
            exit 1
          fi

          enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PKG")

          # Zwei gueltige Endzustaende: das Paket ist ganz weg (GitHub raeumt
          # ein Paket ohne Versionen ab) ODER es existiert noch, traegt aber
          # kein v0.0.1 mehr. Beides heisst: geloescht wurde wirklich.
          err=$(mktemp)
          if ! body=$(gh api "/orgs/serverkraken/packages/container/${enc}/versions" 2>"$err"); then
            if grep -q '(HTTP 404)' "$err"; then
              echo "package is gone entirely — deletion happened."
              exit 0
            fi
            echo "::error::could not list versions: $(tr -d '\n' < "$err")"
            exit 1
          fi

          remaining=$(jq -r '[.[] | .metadata.container.tags // [] | .[]] | join(",")' <<<"$body")
          echo "remaining tags: [${remaining}]"

          # Beide Richtungen pruefen. Nur "v0.0.1 ist weg" waere auch dann
          # erfuellt, wenn der Prune ALLES geloescht haette — und das waere ein
          # anderer, schlimmerer Fehler.
          if [[ "$remaining" == *"v0.0.1"* ]]; then
            echo "::error::v0.0.1 still present after cleanup with keep_stable_versions:1 — the prune deleted nothing"
            exit 1
          fi
          if [[ "$remaining" != *"v0.0.2"* ]]; then
            echo "::error::v0.0.2 is gone — the prune deleted the version it was supposed to KEEP"
            exit 1
          fi
          echo "v0.0.1 deleted, v0.0.2 kept — the prune touched exactly the right version."

      - name: Remove the fixture package if anything survived
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: reusable-workflows/nightly-cleanup-fixture-${{ github.run_id }}
        run: |
          # Aufraeumen auch dann, wenn oben etwas schiefging: sonst sammeln
          # sich Fixture-Pakete je fehlgeschlagenem Lauf an.
          enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PKG")
          gh api -X DELETE "/orgs/serverkraken/packages/container/${enc}" >/dev/null 2>&1 \
            && echo "fixture package removed" \
            || echo "fixture package already gone"

  # ----- trivy: das GATE, nicht die Erkennung (Audit K-5) -----
  #
  # integration.yml prueft laengst, dass trivy FINDET: test-trivy-fs-failure
  # und test-trivy-image-cve zaehlen beide `findings_count > 0`. Beide setzen
  # dabei aber `fail_on_findings: false` — ausdruecklich, damit der Job gruen
  # bleibt und die Assertion die Zahl lesen kann.
  #
  # Damit war der GATE-Zweig
  #
  #     if: inputs.fail_on_findings && findings_count != '0'
  #
  # in KEINEM Aufruf je aktiv. Gemessen: jeder einzelne trivy-Aufruf im
  # gesamten Katalog uebergibt `fail_on_findings: false` — acht Stellen in
  # integration.yml, keine im Nightly. Ein Adopter, der sich auf das Gate
  # verlaesst, verliess sich auf ungepruefte Zeilen.
  #
  # BEIDE Atome, obwohl die Zeile identisch aussieht: bei F-8 trugen drei
  # Schwesteratome die richtige Form und das vierte nicht. "Ist eine Kopie"
  # war schon einmal die Annahme, die danebenging.
  #
  # Hier im Nightly und nicht in integration.yml: ein absichtlich roter Job
  # gehoert nicht in den PR-Pfad, wo er neben echten Fehlschlaegen steht.
  test-trivy-fs-gate-fail:
    uses: ./.github/workflows/trivy-fs.yml
    secrets: inherit
    with:
      report_slug: gate
      # Die Secret-Fixture, die test-trivy-fs-failure schon als "findet etwas"
      # belegt — hier mit scharfem Gate.
      paths_ignore: |
        tests/fixtures/lint-test/helm-lint-fail
        tests/fixtures/gitops-planted-secret
      fail_on_findings: true
      upload_sarif: false

  assert-trivy-fs-gate-fail:
    needs: test-trivy-fs-gate-fail
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the gate failed the job
        env:
          RESULT: ${{ needs.test-trivy-fs-gate-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected trivy-fs to FAIL with fail_on_findings:true on a fixture that has findings, got: $RESULT"
            exit 1
          fi
          echo "trivy-fs gate: correctly observed failure"

  test-docker-build-for-trivy-gate:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/with-cve
      dockerfile: tests/fixtures/with-cve/Dockerfile
      image_name: ${{ github.repository }}/nightly-trivy-gate
      sign: false
      attest: false
      sbom: false
      platforms: linux/amd64
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'

  test-trivy-image-gate-fail:
    needs: test-docker-build-for-trivy-gate
    uses: ./.github/workflows/trivy-image.yml
    secrets: inherit
    with:
      image_ref: ${{ needs.test-docker-build-for-trivy-gate.outputs.image_ref }}
      # Wie in integration.yml: ohne das findet trivy auf alpine:3.15 nichts,
      # weil alle HIGH/CRITICAL dort einen Upstream-Fix haben.
      ignore_unfixed: false
      platforms: linux/amd64
      fail_on_findings: true
      upload_sarif: false

  assert-trivy-image-gate-fail:
    needs: test-trivy-image-gate-fail
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the gate failed the job
        env:
          RESULT: ${{ needs.test-trivy-image-gate-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected trivy-image to FAIL with fail_on_findings:true on an image with known CVEs, got: $RESULT"
            exit 1
          fi
          echo "trivy-image gate: correctly observed failure"

  # ----- docker-build-multi: fail-path -----
  # Empty images array must fail at input validation before any runner
  # work begins. caller_id disambiguates concurrency from any happy-path
  # docker-build-multi caller running on the same ref (none today in
  # nightly, but defensive).
  test-docker-build-multi-fail:
    uses: ./.github/workflows/docker-build-multi.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/multi-image
      images: '[]'
      sign: false
      attest: false
      sbom: false
      caller_id: fail
      # Input-Validierung, kein echter Build — der billigste Runner reicht.
      runs_on_parse: '["ubuntu-latest"]'
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'

  assert-docker-build-multi-fail:
    needs: test-docker-build-multi-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-docker-build-multi-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected docker-build-multi to fail for empty images array, got result=$RESULT"
            exit 1
          fi
          echo "docker-build-multi correctly failed for empty images array"

  # ----- goreleaser: fail-path -----
  # Fixture has a deliberately broken .goreleaser.yaml (version: 99,
  # unknown top-level key, invalid build targets). Atom exits non-zero
  # at config validation.
  test-goreleaser-fail:
    uses: ./.github/workflows/goreleaser.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/cli-go-no-config
      snapshot: true

  assert-goreleaser-fail:
    needs: test-goreleaser-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-goreleaser-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected goreleaser to fail for broken .goreleaser.yaml, got result=$RESULT"
            exit 1
          fi
          echo "goreleaser correctly failed for broken .goreleaser.yaml"

  # ----- helm-publish: fail-path -----
  # Fixture has a broken Chart.yaml. Atom must fail at helm lint /
  # package step before any push attempt.
  test-helm-publish-fail:
    uses: ./.github/workflows/helm-publish.yml
    secrets: inherit
    with:
      chart_path: tests/fixtures/helm-broken
      oci_registry: ghcr.io/serverkraken/test
      dry_run: true

  assert-helm-publish-fail:
    needs: test-helm-publish-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify atom failed as expected
        env:
          RESULT: ${{ needs.test-helm-publish-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected helm-publish to fail for broken Chart.yaml, got result=$RESULT"
            exit 1
          fi
          echo "helm-publish correctly failed for broken Chart.yaml"

  # ----- kube-validate: fail-path -----
  # Invalid manifest (additional property under a known schema) → kubeconform
  # -strict rejects → atom exits non-zero.
  test-kube-validate-fail:
    uses: ./.github/workflows/kube-validate.yml
    secrets: inherit
    with:
      manifests_paths: tests/fixtures/gitops-invalid-manifest/kubernetes/apps
      sops: false

  assert-kube-validate-fail:
    needs: test-kube-validate-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert validate job failed
        env:
          RESULT: ${{ needs.test-kube-validate-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected kube-validate to fail on invalid manifest, got: $RESULT"
            exit 1
          fi
          echo "kube-validate-fail: correctly observed failure"

  # ----- chart-image-bump: fail-path. Das Atom hatte bis zum K-2-Fix ueberhaupt
  #       keinen Self-CI-Aufrufer; die Repo-Konvention verlangt zu jedem Atom
  #       einen Happy- UND einen Fehlerpfad. Fehlt der erwartete Schluessel in
  #       der values.yaml, muss der Lauf rot werden — ein Chart, das still auf
  #       einem alten Tag stehenbliebe, ist das schlechtere Ergebnis. -----
  test-chart-image-bump-fail:
    uses: ./.github/workflows/chart-image-bump.yml
    secrets: inherit
    with:
      values_file: tests/fixtures/chart-image-bump/values-missing-key.yaml
      key_template: 'images.{name}.tag'
      releases: '{"images/api": {"version": "9.9.9"}}'
      images: '{"images/api": ["serverkraken/reusable-workflows/api"]}'
      commit: false
      runs_on: '["ubuntu-latest"]'

  assert-chart-image-bump-fail:
    needs: test-chart-image-bump-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the bump failed instead of silently doing nothing
        env:
          RESULT: ${{ needs.test-chart-image-bump-fail.result }}
          CHANGED: ${{ needs.test-chart-image-bump-fail.outputs.changed }}
        run: |
          set -euo pipefail
          fail=0
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::erwartet 'failure' bei fehlendem Schluessel, bekommen: $RESULT"
            fail=1
          fi
          # `result == failure` allein waere zu schwach — das ist K-4. Der Lauf
          # koennte auch am Token oder am Checkout gescheitert sein. `changed`
          # muss leer bleiben: haette das Atom etwas gebumpt und WAERE trotzdem
          # rot, waere die Ursache eine andere.
          if [[ -n "$CHANGED" && "$CHANGED" != "false" ]]; then
            echo "::error::changed='$CHANGED' — es wurde etwas gebumpt, der Fehlschlag hat also eine andere Ursache"
            fail=1
          fi
          # Der Grund selbst (die 'not found in'-Meldung) steht nur im Log des
          # anderen Jobs und ist von hier aus nicht lesbar. Anders als bei
          # test-python, wo das Atom `coverage_pct` herausgibt, existiert hier
          # kein Output, an dem sich der Grund festmachen liesse.
          exit "$fail"

  # ----- kube-lint: fail-path -----
  # Violation fixture (nginx:latest, no resource limits, no securityContext)
  # trips the baseline kube-linter default checks → findings_count > 0 →
  # with fail_on_findings (default true) the atom's gate step exits non-zero.
  # No config_path so the catalog baseline (default checks) is used.
  test-kube-lint-fail:
    uses: ./.github/workflows/kube-lint.yml
    secrets: inherit
    with:
      manifests_path: tests/fixtures/gitops-lint-violation/kubernetes/apps
      fail_on_findings: true   # default, but explicit
      upload_sarif: false

  assert-kube-lint-fail:
    needs: test-kube-lint-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert lint job failed
        env:
          RESULT: ${{ needs.test-kube-lint-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected kube-lint to fail on violation fixture, got: $RESULT"
            exit 1
          fi
          echo "kube-lint-fail: correctly observed failure"

  # ----- tofu-validate: fail-path -----
  # Invalid fixture (mis-indented HCL + reference to an undeclared variable)
  # breaks both fmt AND validate. tofu-validate has no fail_on_findings
  # escape hatch — a broken stack MUST turn the job red.
  test-tofu-validate-fail:
    uses: ./.github/workflows/tofu-validate.yml
    secrets: inherit
    with:
      working_directories: |-
        tests/fixtures/tofu-invalid
      tflint: false
      runs_on: '["ubuntu-latest"]'

  assert-tofu-validate-fail:
    needs: test-tofu-validate-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Das Atom muss den kaputten Stack ablehnen
        env:
          RESULT: ${{ needs.test-tofu-validate-fail.result }}
          CHECKED: ${{ needs.test-tofu-validate-fail.outputs.checked_directories }}
        run: |
          set -euo pipefail
          fail=0
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::erwartet 'failure' fuer den ungueltigen Stack, bekam '${RESULT}'" >&2
            fail=1
          fi
          # `result == failure` allein wuerde auch einen OOM-Kill, einen
          # gescheiterten Toolchain-Download oder einen Syntaxfehler im Atom
          # als "das Gate greift" melden. checked_directories wird gesetzt,
          # NACHDEM die Schleife den Stack tatsaechlich durchlaufen hat, und
          # bevor der Fail-Schritt zuschlaegt: '1' beweist, dass fmt/init/
          # validate an der Fixture gelaufen sind.
          if [[ "$CHECKED" != "1" ]]; then
            echo "::error::checked_directories='${CHECKED}' statt '1' — der Lauf ist vor der Validierung gescheitert, die Ablehnung ist damit unbewiesen" >&2
            fail=1
          fi
          [[ "$fail" == "0" ]] || exit 1
          echo "tofu-validate hat den kaputten Stack korrekt abgelehnt (1 Stack geprueft)"

  # ----- secret-scan: fail-path -----
  # Planted-secret fixture (AWS access key in a tracked file) → gitleaks
  # detect finds it → findings_count > 0 → with fail_on_findings (default
  # true) the atom's gate step exits non-zero. no_git scans the directory
  # tree directly (no commit history needed in the fixture).
  test-secret-scan-fail:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
    with:
      no_git: true
      scan_path: tests/fixtures/gitops-planted-secret
      fail_on_findings: true
      upload_sarif: false

  assert-secret-scan-fail:
    needs: test-secret-scan-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert scan job failed
        env:
          RESULT: ${{ needs.test-secret-scan-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected secret-scan to fail on planted-secret fixture, got: $RESULT"
            exit 1
          fi
          echo "secret-scan-fail: correctly observed failure"

  # ----- build-flutter-android: fail-path -----
  # A --flavor that no Gradle flavor defines aborts the build (Gradle cannot
  # resolve the assemble task) — exercises failure propagation without a
  # dedicated broken fixture.
  test-build-flutter-android-fail:
    uses: ./.github/workflows/build-flutter-android.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/flutter-app
      use_build_runner: false
      flavor: nonexistent

  assert-build-flutter-android-fail:
    needs: test-build-flutter-android-fail
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert build job failed
        env:
          RESULT: ${{ needs.test-build-flutter-android-fail.result }}
        run: |
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected build-flutter-android to fail on nonexistent flavor, got: $RESULT"
            exit 1
          fi
          echo "build-flutter-android-fail: correctly observed failure"

  # ----- e2e-kind: fail-path -----
  # Fixture creates a cluster then exits 1 without deleting it. Asserts:
  # (a) the atom job failed, (b) the diagnostics artifact was uploaded.
  # (c) no-leak is asserted INSIDE the atom's cleanup step itself — a
  # separate job cannot see the runner pod's dind.
  test-e2e-kind-fail:
    uses: ./.github/workflows/e2e-kind.yml
    secrets: inherit
    with:
      script: tests/fixtures/kind-smoke/e2e-fail.sh
      timeout_minutes: 15

  assert-e2e-kind-fail:
    needs: test-e2e-kind-fail
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the atom failed and produced diagnostics
        env:
          RESULT: ${{ needs.test-e2e-kind-fail.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "failure" ]]; then
            echo "::error::expected e2e-kind to fail on the fail fixture, got: $RESULT"
            exit 1
          fi
          names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                    --jq '.artifacts[].name')
          if ! grep -qx "e2e-kind-diagnostics" <<< "$names"; then
            echo "::error::diagnostics artifact 'e2e-kind-diagnostics' missing; artifacts were: ${names:-<none>}"
            exit 1
          fi
          echo "e2e-kind failed as designed and uploaded diagnostics"

  # ----- Regression Reporter -----
  # Runs after ALL assert-* jobs (siehe needs: unten). The job always runs
  # (if: always()),
  # but the bash step short-circuits when no asserts failed — gating in
  # bash rather than via the workflow-level `if:` expression. An earlier
  # smoke-test (issue #147) showed that `if: always() && contains(needs.*.result,
  # 'failure')` lets the job through even when all needs returned success,
  # which created a false-positive issue. Bash-level gate is robust against
  # any GHA expression-evaluation quirks.
  #
  # Opens a new issue with label `failure-path-regression` OR comments on
  # an existing open one — single-issue-pattern keeps the inbox clean.
  report-regressions:
    needs:
      - assert-lint-go-fail
      - assert-lint-helm-fail
      - assert-lint-helm-unittest-fail
      - assert-lint-helm-unittest-empty
      - assert-trivy-fs-gate-fail
      - assert-trivy-image-gate-fail
      - assert-cleanup-images-destructive
      - assert-goreleaser-publish
      - assert-lint-flutter-no-codegen
      - assert-lint-python-fail
      - assert-lint-rust-fail
      - assert-lint-shell-fail
      - assert-lint-shell-empty
      - assert-lint-shell-unreadable
      - assert-test-go-cov-fail
      - assert-test-python-cov-fail
      - assert-test-rust-cov-fail
      - assert-cleanup-images-fail
      - assert-docker-build-multi-fail
      - assert-goreleaser-fail
      - assert-helm-publish-fail
      - assert-kube-validate-fail
      - assert-kube-lint-fail
      - assert-tofu-validate-fail
      - assert-chart-image-bump-fail
      - assert-secret-scan-fail
      - assert-build-flutter-android-fail
      - assert-e2e-kind-fail
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJson(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | .[].key
          ' | paste -sd ',' -)

          if [[ -z "$failed" ]]; then
            echo "Alle assert-*-Jobs meldeten Erfolg."

            # Audit K-23: hier stand nur `exit 0`. Damit wurde eine einmal
            # geoeffnete Regression NIE wieder geschlossen — das Issue blieb
            # offen stehen und behauptete weiter einen Zustand, den es laengst
            # nicht mehr gab. Wer es spaeter las, konnte nicht unterscheiden,
            # ob die Regression noch besteht.
            #
            # Das ist die Umkehrung von K-20: dort lief der Meldeweg nicht,
            # wenn es etwas zu melden gab; hier laeuft er nicht, wenn es etwas
            # zu ENTWARNEN gibt. Beide Male bleibt der Leser im Unklaren.
            #
            # Kommentiert wird vor dem Schliessen, damit im Verlauf steht,
            # WANN und durch welchen Lauf die Entwarnung kam.
            open_issue=$(gh issue list \
              --label failure-path-regression \
              --state open --limit 1 --json number --jq '.[0].number // empty')
            if [[ -n "$open_issue" ]]; then
              gh issue comment "$open_issue" \
                --body "Nightly $(date -u +%Y-%m-%d) — alle failure-path-Asserts sind wieder gruen. Kein offener Regressionsbefund mehr. Run: $RUN_URL"
              gh issue close "$open_issue" \
                --reason completed \
                --comment "Automatisch geschlossen: der naechtliche Lauf hat die Regression nicht mehr beobachtet."
              echo "Regressions-Issue #$open_issue geschlossen — wieder gruen."
            else
              echo "Kein offenes Regressions-Issue — nichts zu entwarnen."
            fi
            exit 0
          fi

          today=$(date -u +%Y-%m-%d)

          existing=$(gh issue list \
            --label failure-path-regression \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "Nightly $today — failed asserts: \`$failed\`. Run: $RUN_URL"
            echo "Commented on existing regression issue #$existing"
          else
            gh issue create \
              --label failure-path-regression \
              --title "[failure-path-regression] nightly $today: $failed" \
              --body "Nightly \`failure-paths-nightly.yml\` ran on $today and one or more failure-path asserts did not observe the expected failure.

          **Failed asserts:** \`$failed\`
          **Run:** $RUN_URL

          **Likely causes:**
          - Atom logic was refactored and no longer fails on the broken fixture
          - Fixture is stale (action version updated, behavior changed)
          - Action version drift (e.g., goreleaser-action auto-generates default config)

          **Triage checklist:**
          - [ ] Identify which atom/fixture pair regressed (see failed-asserts list above)
          - [ ] Inspect recent commits to the named atom workflow
          - [ ] Verify the fixture still triggers the failure mode under the current atom logic
          - [ ] Repair atom OR fixture OR remove the failure-path test if obsolete
          - [ ] Close this issue with a link to the fixing PR"
            echo "Created new regression issue"
          fi
