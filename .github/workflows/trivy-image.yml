# .github/workflows/trivy-image.yml
# Summary convention: docs/conventions/step-summary.md
name: trivy-image
on:
  workflow_call:
    inputs:
      image_ref:
        description: 'Full image reference, e.g. ghcr.io/serverkraken/foo:v1.2.3'
        required: true
        type: string
      scanners:
        required: false
        type: string
        default: 'vuln,secret,misconfig'
      severity:
        required: false
        type: string
        default: 'HIGH,CRITICAL'
      ignore_unfixed:
        required: false
        type: boolean
        default: true
      fail_on_findings:
        required: false
        type: boolean
        default: true
      paths_ignore:
        required: false
        type: string
        default: ''
      upload_sarif:
        required: false
        type: boolean
        default: true
      platforms:
        description: >-
          Comma-separated platforms to scan (e.g. linux/amd64,linux/arm64).
          Empty scans whichever single platform Trivy picks for a multi-arch
          tag — its default is linux/amd64, which leaves every other published
          architecture unchecked.
        required: false
        type: string
        default: ''
      trivy_version:
        required: false
        type: string
        default: ''
      runs_on:
        required: false
        type: string
        default: '["self-hosted","Linux"]'
    outputs:
      findings_count:
        value: ${{ jobs.scan.outputs.findings_count }}
    secrets:
      release_please_app_client_id:
        required: true
        description: 'GitHub App Client ID with contents:read on the catalog repo.'
      release_please_app_private_key:
        required: true
        description: 'PEM private key for the GitHub App.'

permissions:
  contents: read
  security-events: write
  packages: read    # to pull the image from GHCR
  actions: read     # codeql-action telemetry calls /repos/.../actions/runs

concurrency:
  group: trivy-image-${{ inputs.image_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 20
    outputs:
      findings_count: ${{ steps.count.outputs.findings_count }}
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      # Every artifact name and SARIF category below has to be unique per
      # image: a release run scans one image per component, and with a fixed
      # name they all land as indistinguishable siblings. Live evidence
      # (mailstack release 32675842176): four artifacts called
      # `trivy-image-sarif` and four called `sbom-spdx` in one run — an SBOM
      # nobody can attribute to an image is worthless. Worse for SARIF: one
      # shared `category` makes each upload REPLACE the previous image's
      # findings in code scanning, so image A's findings show as fixed the
      # moment image B uploads.
      - name: Derive per-image report slug
        id: slug
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          # ghcr.io/serverkraken/mailstack/postfix:v1.6.7 -> mailstack-postfix
          name="${IMAGE_REF%%@*}"   # drop a digest, if any
          name="${name%:*}"         # drop the tag
          name="${name#*/}"         # drop the registry host
          slug="$(printf '%s' "$name" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          [ -n "$slug" ] || slug="image"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Report slug: $slug"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        # See trivy-fs.yml for rationale. Self-CI: caller's SHA. Cross-repo: floating v4.
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
            echo "Self-CI: catalog ref = $SELF_SHA"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
            echo "Cross-repo: catalog ref = v4 (floating)"
          fi
      - name: Checkout catalog for composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog
      - name: Install Trivy
        uses: ./.catalog/actions/install-trivy
        with:
          version: ${{ inputs.trivy_version }}
      - name: Log in to GHCR
        uses: ./.catalog/actions/ghcr-login

      - name: Run Trivy image scan
        env:
          IMAGE: ${{ inputs.image_ref }}
          SCANNERS: ${{ inputs.scanners }}
          SEVERITY: ${{ inputs.severity }}
          IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          UNFIXED_FLAG=""
          [[ "$IGNORE_UNFIXED" == "true" ]] && UNFIXED_FLAG="--ignore-unfixed"
          mkdir -p trivy-sarif
          # For a multi-arch tag Trivy picks ONE platform — its default is
          # linux/amd64. Scanning only that leaves every other published
          # architecture unchecked, and for an arm64 cluster that is precisely
          # the image that ships (verified: a scan of mailstack's postfix tag
          # without --platform reports architecture amd64, while the cluster
          # runs arm64). Callers that publish multi-arch pass the same list
          # they built.
          scan_one() {
            local plat="$1" slug="$2" flag=()
            [[ -n "$plat" ]] && flag=(--platform "$plat")
            trivy image --scanners "$SCANNERS" --severity "$SEVERITY" --exit-code 0 \
              $UNFIXED_FLAG "${flag[@]}" --format sarif \
              --output "trivy-sarif/trivy-image-${slug}.sarif" "$IMAGE"
            trivy image --scanners "$SCANNERS" --severity "$SEVERITY" --exit-code 0 \
              $UNFIXED_FLAG "${flag[@]}" --format json \
              --output "trivy-image-${slug}.json" "$IMAGE"
          }
          if [[ -z "${PLATFORMS:-}" ]]; then
            scan_one "" "default"
          else
            IFS=',' read -ra PLATS <<< "$PLATFORMS"
            for p in "${PLATS[@]}"; do
              p="$(echo "$p" | tr -d ' ')"
              [[ -n "$p" ]] || continue
              echo "Scanning $IMAGE for $p"
              scan_one "$p" "$(echo "$p" | tr '/' '-')"
            done
          fi
          # One SARIF per platform cannot go to code-scanning as-is: the CodeQL
          # action refuses several runs under one category, and a category per
          # platform would split one image's alert list in two. Merge them into
          # a single run instead — the platforms describe the same image.
          # Re-indexing `ruleIndex` is the load-bearing part; the script does it.
          python3 .catalog/scripts/merge-sarif-runs.py \
            trivy-image.sarif trivy-sarif/*.sarif
          # Same story for the JSON report the summary, the findings table and
          # the annotations read: they expect ONE file at the historical name.
          # Merging also stops a CVE present on both architectures from being
          # counted twice (verified on a real image: naive summing reported 4
          # findings where there were 2).
          python3 .catalog/scripts/merge-trivy-json.py \
            trivy-image.json trivy-image-*.json

      - name: Count findings
        id: count
        run: |
          set -euo pipefail
          # Count the MERGED report, not the per-platform files. It still covers
          # every architecture — a finding present only on arm64 fails the gate —
          # but a finding present on both is one finding, not two.
          COUNT=$(jq '[.Results[]? | (.Vulnerabilities // []) + (.Secrets // []) + (.Misconfigurations // []) | length] | add // 0' trivy-image.json)
          echo "findings_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code-scanning
        id: sarif
        # Fork-PR guard only: on push/schedule/dispatch there is no
        # pull_request context, which used to skip the upload entirely.
        if: inputs.upload_sarif && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          # A single merged run. Uploading the directory instead made the
          # CodeQL action reject the whole scan once a caller passed two
          # platforms ("does not support uploading multiple SARIF runs with
          # the same category"). The per-platform files still ship as the
          # artifact below.
          sarif_file: trivy-image.sarif
          # Per image, so parallel scans in one run do not overwrite each
          # other's code-scanning results.
          category: trivy-image:${{ steps.slug.outputs.slug }}

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-image-sarif-${{ steps.slug.outputs.slug }}
          # The per-platform files keep the detail; the merged pair is what
          # code-scanning and the summary actually consume, and what the
          # integration assertion inspects.
          path: |
            trivy-sarif
            trivy-image.sarif
            trivy-image.json
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ inputs.image_ref }}
          SEVERITY: ${{ inputs.severity }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          COUNT: ${{ steps.count.outputs.findings_count }}
          REPORT: trivy-image.json
          SLUG: ${{ steps.slug.outputs.slug }}
          SARIF_UPLOADED: ${{ steps.sarif.outcome == 'success' }}
          ALERTS_BASE: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FINDINGS_REPORT: ${{ github.workspace }}/.catalog/scripts/trivy-findings-report.sh
        run: |
          ALERTS_URL="${ALERTS_BASE}?query=is%3Aopen+tool%3ATrivy"
          [[ -n "$PR_NUMBER" ]] && ALERTS_URL="${ALERTS_URL}+pr%3A${PR_NUMBER}"
          trivy_version=$(trivy --version 2>/dev/null | awk '/^Version:/ {print $2}' || echo unknown)
          if [[ -f "$REPORT" ]]; then
            crit=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="CRITICAL")] | length' "$REPORT")
            high=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="HIGH")] | length' "$REPORT")
            med=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="MEDIUM")] | length' "$REPORT")
            low=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="LOW")] | length' "$REPORT")
          else
            crit=0; high=0; med=0; low=0
          fi
          if [[ "$COUNT" == "0" ]]; then
            result="✓ no findings"
          elif [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
            result="✗ ${COUNT} findings"
          else
            result="▲ ${COUNT} findings (gate disabled)"
          fi
          {
            echo "## trivy-image"
            echo ""
            echo "**Tool:** Trivy ${trivy_version}"
            echo "**Image:** \`${IMAGE}\`"
            echo "**Severities:** \`${SEVERITY}\`"
            echo "**Result:** ${result}"
            echo ""
            echo "| Severity | Count |"
            echo "|---|---|"
            echo "| CRITICAL | ${crit} |"
            echo "| HIGH | ${high} |"
            echo "| MEDIUM | ${med} |"
            echo "| LOW | ${low} |"
            if [[ "$COUNT" != "0" && -f "$REPORT" && -x "$FINDINGS_REPORT" ]]; then
              echo ""
              echo "### Findings"
              echo ""
              MAX_ROWS=50 "$FINDINGS_REPORT" table "$REPORT"
              echo ""
              if [[ "$SARIF_UPLOADED" == "true" ]]; then
                echo "**Code scanning:** [open Trivy alerts](${ALERTS_URL})"
              fi
              # Name the artifact that actually exists: it carries the image
              # slug so parallel scans in one run stay apart.
              echo "**Full report:** SARIF artifact \`trivy-image-sarif-${SLUG}\` on the [run page](${RUN_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Fail on findings
        if: inputs.fail_on_findings && steps.count.outputs.findings_count != '0'
        env:
          COUNT: ${{ steps.count.outputs.findings_count }}
          IMAGE: ${{ inputs.image_ref }}
          REPORT: trivy-image.json
          SARIF_UPLOADED: ${{ steps.sarif.outcome == 'success' }}
          ALERTS_BASE: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINDINGS_REPORT: ${{ github.workspace }}/.catalog/scripts/trivy-findings-report.sh
        run: |
          ALERTS_URL="${ALERTS_BASE}?query=is%3Aopen+tool%3ATrivy"
          [[ -n "$PR_NUMBER" ]] && ALERTS_URL="${ALERTS_URL}+pr%3A${PR_NUMBER}"
          # One annotation per finding (capped at GitHub's 10-per-step limit) so
          # the failing check shows WHAT was found; the full table is in the
          # step summary, the full list in the SARIF artifact / code-scanning.
          if [[ -x "$FINDINGS_REPORT" ]]; then
            MAX_ANNOTATIONS=10 "$FINDINGS_REPORT" annotations "$REPORT" || true
          fi
          where=""
          if [[ "$SARIF_UPLOADED" == "true" ]]; then
            where=" — see $ALERTS_URL"
          fi
          echo "::error::Trivy found $COUNT severity-matching findings in $IMAGE (details in step summary)$where"
          exit 1
