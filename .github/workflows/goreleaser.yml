# .github/workflows/goreleaser.yml
# Reusable workflow that runs goreleaser to publish CLI binary releases
# (archives, checksums, optionally homebrew/scoop/etc.) for Go projects.
# Stability surface: the shape of `inputs` and `permissions` below is the
# contract — changes are SemVer-significant.
#
# Consumer responsibility:
#   - Provide a `.goreleaser.yaml` at `working_directory`.
#   - Trigger this workflow on tag push (`on: push: tags: ['v*']`) for real
#     releases. For PR smoke tests, set `snapshot: true` so goreleaser does
#     not attempt to create a GitHub release.
#
# Auth: `secrets: inherit` is REQUIRED on callers. The atom uses the
# automatic `GITHUB_TOKEN`; no explicit `secrets:` block is declared.
# Summary convention: docs/conventions/step-summary.md
name: goreleaser
on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory containing go.mod and .goreleaser.yaml.'
        required: false
        type: string
        default: '.'
      goreleaser_version:
        description: 'goreleaser version constraint (e.g. "~> v2", "v2.5.0", "latest").'
        required: false
        type: string
        default: '~> v2'
      snapshot:
        description: 'Run in --snapshot mode (no publish). Useful for PR smoke tests.'
        required: false
        type: boolean
        default: false
      ref:
        description: >-
          Git ref (meist der frisch erzeugte Tag) zum Auschecken. Leer = der
          Ref des Aufrufers. goreleaser braucht im Nicht-Snapshot-Modus einen
          Tag AM ausgecheckten Commit; wer den Tag im selben Lauf erzeugt, muss
          ihn hier uebergeben. Macht zugleich den Publish-Pfad testbar
          (Audit K-12).
        required: false
        type: string
        default: ''
      runs_on:
        required: false
        type: string
        default: '["self-hosted","Linux"]'

permissions:
  contents: write
  # packages: write — required when .goreleaser.yaml has a dockers: block
  packages: write

concurrency:
  # `github.workflow` qualifier prevents happy/fail caller workflows that hit
  # this atom on the same PR from cancelling each other. `working_directory`
  # is included so happy + fail callers SHARING the same github.workflow
  # (aggregate self-CI wrappers) but pointing at different fixtures don't
  # collide either.
  group: goreleaser-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: ${{ inputs.snapshot }}

jobs:
  release:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        # Fest auf den Workspace: der Waechter laeuft VOR dem Checkout, und ein
        # Job-Ebene `defaults.run.working-directory` (goreleaser.yml) zeigt auf
        # ein Verzeichnis, das es dann noch nicht gibt. Ohne diese Zeile
        # scheitert der Schritt mit "No such file or directory", statt den Wert
        # zu pruefen — gemessen an Lauf 33062297620.
        working-directory: ${{ github.workspace }}
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      # Der Ref kommt vom Aufrufer und landet in `actions/checkout`. Auf
      # `pull_request_target` haette der Job die Repo-Secrets, waehrend der Ref
      # auf einen Fork zeigen kann — und dieser Job VEROEFFENTLICHT.
      - name: Refuse a caller-supplied ref on pull_request_target
        if: github.event_name == 'pull_request_target' && inputs.ref != ''
        working-directory: ${{ github.workspace }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "::error::refusing to check out '$REF' on pull_request_target."
            echo "On this event the workflow holds repository secrets while the"
            echo "ref may point at a fork. This job publishes a release — that"
            echo "is not something you can take back."
            echo "Use pull_request (no secrets) for untrusted contributions."
          } >&2
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ${{ inputs.working_directory }}/go.mod
          # No explicit cache-dependency-path: setup-go derives it from
          # go-version-file. Some CLI fixtures/repos have no go.sum; the
          # action tolerates the missing file with a warning rather than a
          # hard failure, which is the behaviour we want here.
          cache: true

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser_version }}
          args: release --clean ${{ inputs.snapshot && '--snapshot' || '' }}
          workdir: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          MODE: ${{ inputs.snapshot && 'snapshot' || 'release' }}
          WORKDIR: ${{ inputs.working_directory }}
          GR_VERSION: ${{ inputs.goreleaser_version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$MODE" == "snapshot" ]]; then
            result="✓ snapshot built (no publish)"
            url_cell="—"
          else
            result="✓ released"
            url_cell="https://github.com/${REPO}/releases/tag/${TAG}"
          fi
          {
            echo "## goreleaser"
            echo ""
            echo "**Tool:** goreleaser ${GR_VERSION}"
            echo "**Working dir:** \`${WORKDIR}\`"
            echo "**Result:** ${result}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Mode | \`${MODE}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Release URL | ${url_cell} |"
          } >> "$GITHUB_STEP_SUMMARY" || true
