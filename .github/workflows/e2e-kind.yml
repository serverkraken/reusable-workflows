# .github/workflows/e2e-kind.yml
# Reusable workflow: run a consumer-owned Kubernetes e2e script against a
# kind cluster inside the runner pod's dind sidecar.
#
# Stability surface: the shape of `inputs` and `secrets` below is the
# contract. The kind-cluster lifecycle belongs to the consumer script;
# this atom provisions the toolchain (kind/kubectl/cilium-cli via the
# catalog's setup-kind-toolchain action, helm via azure/setup-helm), runs
# the script, collects diagnostics on failure, and guarantees that no
# kind cluster survives the job on the long-lived self-hosted runner pods.
#
# Operational notes for consumer scripts (2026-08-20 spike, see
# docs/superpowers/specs/2026-08-20-e2e-kind-design.md):
#   * Talos hosts drop CAP_SYS_MODULE from the kernel bounding set; a
#     nested container (runner pod -> dind -> kind node -> CNI pod) can
#     never regain it. Cilium installs MUST remove SYS_MODULE from BOTH
#     capability lists (mirrors homelab-study kube-system/cilium):
#       --set securityContext.capabilities.ciliumAgent='{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}'
#       --set securityContext.capabilities.cleanCiliumState='{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}'
#   * `cilium install --wait` returns without waiting (cilium-cli
#     v0.18.7); budget waits into `cilium status --wait` instead.
#   * Skip `kind create --wait` when disableDefaultCNI is set — the node
#     cannot become Ready before a CNI is installed.
#   * The runner disk is shared with the dind image store; under
#     concurrent CI IO, etcd fsyncs can stall ("etcdserver: request timed
#     out"). Run etcd with `unsafe-no-fsync: "true"` (kubeadmConfigPatches
#     -> ClusterConfiguration) — the cluster is throwaway, so durability
#     is free to give up (see tests/fixtures/kind-smoke/kind-config.yaml).
#
# Summary convention: docs/conventions/step-summary.md
name: e2e-kind
on:
  workflow_call:
    inputs:
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux","X64","performance"]'
      script:
        description: 'Consumer e2e script path (relative to working_directory), e.g. test/e2e/run.sh. Owns the kind-cluster lifecycle.'
        required: true
        type: string
      working_directory:
        description: 'Component sub-path.'
        required: false
        type: string
        default: '.'
      timeout_minutes:
        description: 'Job timeout in minutes.'
        required: false
        type: number
        default: 45
      kind_version:
        description: 'kind version (leading v). Empty → setup-kind-toolchain pinned default.'
        required: false
        type: string
        default: ''
      kubectl_version:
        description: 'kubectl version (leading v). Empty → setup-kind-toolchain pinned default.'
        required: false
        type: string
        default: ''
      cilium_cli_version:
        description: 'cilium-cli version (leading v). Empty → setup-kind-toolchain pinned default.'
        required: false
        type: string
        default: ''
      # renovate: datasource=github-releases depName=helm/helm
      helm_version:
        description: 'Helm CLI version.'
        required: false
        type: string
        default: 'v3.16.3'
    secrets:
      release_please_app_client_id:
        required: true
        description: 'GitHub App Client ID with contents:read on the catalog repo.'
      release_please_app_private_key:
        required: true
        description: 'PEM private key for the GitHub App.'

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-kind-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ inputs.script }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        # Fest auf den Workspace: der Waechter laeuft VOR dem Checkout, und ein
        # Job-Ebene `defaults.run.working-directory` (goreleaser.yml) zeigt auf
        # ein Verzeichnis, das es dann noch nicht gibt. Ohne diese Zeile
        # scheitert der Schritt mit "No such file or directory", statt den Wert
        # zu pruefen — gemessen an Lauf 33062297620.
        working-directory: ${{ github.workspace }}
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows

      - name: Resolve catalog ref
        # GitHub Actions does NOT expose the @version the caller pinned in
        # `uses:` inside a reusable workflow. Self-CI (caller == catalog):
        # use the caller's SHA — it IS a catalog commit and exercises
        # feature-branch composite-action changes. Cross-repo (adopters):
        # pin to the floating major tag `v4`. Bump the hardcoded major in
        # this block when a new major releases.
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
            echo "Self-CI: catalog ref = $SELF_SHA"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
            echo "Cross-repo: catalog ref = v4 (floating)"
          fi

      - name: Checkout catalog for composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog

      - name: Install kind toolchain
        uses: ./.catalog/actions/setup-kind-toolchain
        with:
          kind_version: ${{ inputs.kind_version }}
          kubectl_version: ${{ inputs.kubectl_version }}
          cilium_cli_version: ${{ inputs.cilium_cli_version }}

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: ${{ inputs.helm_version }}

      - name: Run e2e script
        id: run_script
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          # Commands containing a slash bypass PATH lookup; force one for
          # bare filenames so "run.sh" resolves relative to the cwd.
          [[ "$E2E_SCRIPT" == */* ]] || E2E_SCRIPT="./$E2E_SCRIPT"
          if [[ ! -x "$E2E_SCRIPT" ]]; then
            echo "::error::script '$E2E_SCRIPT' not found or not executable (path is relative to working_directory)"
            exit 1
          fi
          "$E2E_SCRIPT"

      - name: Write step summary
        if: always()
        env:
          SCRIPT: ${{ inputs.script }}
          OUTCOME: ${{ steps.run_script.outcome }}
        run: |
          {
            KIND_VER=$(kind version 2>/dev/null | cut -d' ' -f1-2 || echo 'kind ?')
            KUBECTL_VER=$(kubectl version --client 2>/dev/null | sed -n 's/^Client Version: //p' || echo '?')
            CILIUM_VER=$(cilium version --client 2>/dev/null | sed -n 's/^cilium-cli: \([^ ]*\).*/cilium-cli \1/p' || echo 'cilium-cli ?')
            HELM_VER=$(helm version --template '{{.Version}}' 2>/dev/null || echo '?')
            echo "## e2e-kind"
            echo ""
            echo "**Tools:** $KIND_VER, kubectl $KUBECTL_VER, $CILIUM_VER, helm $HELM_VER"
            echo "**Script:** \`$SCRIPT\`"
            if [[ "$OUTCOME" == "success" ]]; then
              echo "**Result:** ✓ e2e script passed"
            elif [[ "$OUTCOME" == "failure" ]]; then
              echo "**Result:** ✗ e2e script failed — diagnostics artifact \`e2e-kind-diagnostics\`"
            else
              echo "**Result:** ✗ e2e script did not run (outcome: ${OUTCOME:-skipped}) — earlier step failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          OUT=/tmp/e2e-kind-diagnostics
          # Stale diagnostics from a cancelled prior job on this long-lived
          # pod must not leak into this job's artifact.
          rm -rf "$OUT"
          mkdir -p "$OUT"
          for c in $(kind get clusters 2>/dev/null); do
            ctx="kind-$c"
            {
              echo "==== cluster $c: nodes ===="
              kubectl --context "$ctx" get nodes -o wide
              echo "==== cluster $c: all pods ===="
              kubectl --context "$ctx" get pods -A -o wide
              echo "==== cluster $c: recent events ===="
              kubectl --context "$ctx" get events -A --sort-by=.lastTimestamp | tail -100
            } > "$OUT/$c-overview.txt" 2>&1 || true
            while read -r ns pod; do
              kubectl --context "$ctx" -n "$ns" describe pod "$pod" \
                > "$OUT/$c-describe-$ns-$pod.txt" 2>&1 || true
            done < <(kubectl --context "$ctx" get pods -A \
                       --field-selector=status.phase!=Running \
                       --no-headers 2>/dev/null | awk '{print $1" "$2}')
            kind export logs "$OUT/$c-kind-logs" --name "$c" || true
          done
          docker system df > "$OUT/dind-disk.txt" 2>&1 || true

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-kind-diagnostics
          path: /tmp/e2e-kind-diagnostics
          retention-days: 5
          if-no-files-found: ignore

      - name: Cleanup kind clusters
        # Deletes EVERY cluster, not a known name: a leaked cluster from an
        # aborted run must not poison the next job on this long-lived pod.
        # The kindest/node image stays in the dind cache deliberately
        # (~50s saved per subsequent run). Self-asserting: leftovers fail
        # the job even on otherwise-green runs.
        # Handles dind race ("docker rm -f" loses shim exit event): retry
        # kind delete, then remove node containers directly as fallback.
        if: always()
        run: |
          set -euo pipefail
          delete_cluster() {
            local c="$1"
            for attempt in 1 2 3; do
              if kind delete cluster --name "$c"; then
                return 0
              fi
              echo "kind delete cluster $c failed (attempt $attempt/3) — retrying in 5s"
              sleep 5
            done
            # Fallback for the dind race ("did not receive an exit event"): remove
            # the node containers directly, then let kind clean up its bookkeeping.
            echo "falling back to docker rm -f for cluster $c node containers"
            docker ps -a --filter "label=io.x-k8s.kind.cluster=$c" -q | xargs -r docker rm -f || true
            sleep 2
            kind delete cluster --name "$c" || true
          }
          for c in $(kind get clusters 2>/dev/null); do
            delete_cluster "$c"
          done
          # Beide Abfragen verschluckten Fehler UND Exit-Code: `2>/dev/null || true`
          # macht aus einem unerreichbaren Docker-Daemon eine LEERE Liste, und
          # die Pruefung darunter las das als "nichts uebrig geblieben"
          # (Audit F-7). Ein Ausfall sah damit aus wie ein sauberer Cleanup —
          # dieselbe Klasse wie D-12 und K-3: ein Fehlschlag wird zum leeren
          # Ergebnis, und das zaehlt als Erfolg.
          #
          # stdout und stderr werden getrennt gehalten, NICHT per 2>&1
          # zusammengelegt: auf stdout stehen die Daten (Clusternamen,
          # Container-IDs), auf stderr die Diagnose — `kind get clusters`
          # meldet "No kind clusters found." genau dort. Zusammengelegt wuerde
          # jede Diagnosezeile zu einem vermeintlich uebrig gebliebenen
          # Cluster, und aus dem Fund entstuende ein Fehlalarm.
          #
          # Ueber Erreichbarkeit entscheidet damit allein der EXIT-CODE, ueber
          # "uebrig geblieben" allein stdout.
          cleanup_err=$(mktemp)
          if ! leftover=$(kind get clusters 2>"$cleanup_err"); then
            echo "::error::could not list kind clusters — cleanup state is UNKNOWN, not clean: $(tr -d '\n' < "$cleanup_err")"
            rm -f "$cleanup_err"
            exit 1
          fi
          if ! containers=$(docker ps -a --filter "label=io.x-k8s.kind.cluster" -q 2>"$cleanup_err"); then
            echo "::error::could not query docker for leftover kind containers — cleanup state is UNKNOWN, not clean: $(tr -d '\n' < "$cleanup_err")"
            rm -f "$cleanup_err"
            exit 1
          fi
          rm -f "$cleanup_err"
          if [[ -n "${leftover//[[:space:]]/}" || -n "${containers//[[:space:]]/}" ]]; then
            echo "::error::kind state leaked past cleanup: clusters=[${leftover:-}] containers=[${containers:-}]"
            exit 1
          fi
          rm -rf /tmp/e2e-kind-diagnostics
