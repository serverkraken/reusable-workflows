# .github/workflows/docker-build.yml
#
# Reusable workflow: build a multi-arch image distributed across native
# amd64/arm64 self-hosted runners, push by digest, stitch a manifest list,
# optionally cosign-sign, optionally attest build provenance as a
# cosign-attached SLSA v0.2 in-toto predicate (free-tier-compatible:
# stored as OCI sidecar at <image>@<digest>, verified with
# `cosign verify-attestation --type slsaprovenance`),
# optionally generate an SBOM artifact.
# Summary convention: docs/conventions/step-summary.md
name: docker-build
on:
  workflow_call:
    inputs:
      tag:
        description: 'Image tag. Empty → auto-compute (prerelease only).'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Prerelease build (no :latest, auto-compute tag if empty).'
        required: false
        type: boolean
        default: false
      image_name:
        description: 'Image name. Default: caller repo (owner/repo).'
        required: false
        type: string
        default: ''
      dockerfile:
        required: false
        type: string
        default: './Dockerfile'
      context:
        required: false
        type: string
        default: '.'
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      build_args:
        required: false
        type: string
        default: ''
      sign:
        required: false
        type: boolean
        default: true
      attest:
        description: 'Generate SLSA v0.2 build provenance attestation for the image. Uses cosign keyless signing (free-tier compatible). Verify with `cosign verify-attestation --type slsaprovenance`.'
        required: false
        type: boolean
        default: true
      sbom:
        required: false
        type: boolean
        default: true
      runs_on_amd64:
        required: false
        type: string
        default: '["self-hosted","Linux","X64","performance"]'
      runs_on_arm64:
        required: false
        type: string
        default: '["self-hosted","Linux","ARM64"]'
      runs_on_merge:
        required: false
        type: string
        default: '["self-hosted","Linux","low-performance"]'
      ref:
        description: >-
          Git ref (tag/branch/SHA) to check out before building. Callers
          whose release job creates the version-bump commit and tag in the
          SAME run (release-please) should pass the released tag here: the
          default checkout resolves the triggering event's SHA, which
          predates the bump commit when merges land back-to-back — the image
          (and its provenance attestation) is then built from the pre-bump
          tree. Empty = default checkout.
        required: false
        type: string
        default: ''
    outputs:
      image_ref:
        description: 'Pushed image reference with tag.'
        value: ${{ jobs.merge.outputs.image_ref }}
      digest:
        description: 'Manifest list digest (sha256:...).'
        value: ${{ jobs.merge.outputs.digest }}
      moving_ref:
        description: >-
          Fully qualified reference of the moving tag this run published
          (e.g. ghcr.io/owner/app:my-branch), or empty when the run published
          no moving tag. It is pushed only after signing, so it always
          resolves to the same digest as image_ref.
        value: ${{ jobs.merge.outputs.moving_ref }}
      tag:
        description: 'Final tag (auto-computed if input was empty).'
        value: ${{ jobs.version.outputs.tag }}
    secrets:
      release_please_app_client_id:
        required: true
        description: 'GitHub App Client ID with contents:read on the catalog repo.'
      release_please_app_private_key:
        required: true
        description: 'PEM private key for the GitHub App.'
      dockerhub_username:
        required: false
        description: >-
          Docker Hub username. Optional — empty skips the login, and base-image
          pulls fall back to anonymous (rate-limited per egress IP).
      dockerhub_token:
        required: false
        description: >-
          Docker Hub PAT. Optional — see dockerhub_username.

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

concurrency:
  # Include image_name so multiple callers building DIFFERENT images from the
  # same ref (e.g. integration tests building both minimal-go and with-cve
  # fixtures in parallel) don't cancel each other.
  group: docker-build-${{ inputs.image_name || github.repository }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ inputs.prerelease }}

jobs:
  version:
    runs-on: ${{ fromJSON(inputs.runs_on_merge) }}
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      moving_tag: ${{ steps.resolve.outputs.moving_tag }}
      image_name: ${{ steps.resolve.outputs.image_name }}
    steps:
      # Fork-Guard (Audit D-9). `pull_request_target` ist das EINZIGE Ereignis,
      # bei dem Secrets bereitstehen UND der Aufrufer eine fremde Revision
      # auschecken kann. Genau diese Kombination — bekannt als "pwn request" —
      # baut Code aus einem Fork mit den Registry-Zugangsdaten des Adopters,
      # signiert ihn mit dessen cosign-Identitaet und attestiert ihn. Ein
      # veroeffentlichtes, signiertes Schadimage laesst sich nicht
      # zurueckholen.
      #
      # Abgewiesen statt gewarnt: bei allen anderen Befunden dieses Audits war
      # Sichtbarkeit die richtige Antwort, hier nicht — die Warnung erschiene
      # erst, wenn das Image bereits gebaut, gepusht und signiert ist.
      #
      # Nicht erreichbar ueber die gerenderten Workflows dieses Katalogs: die
      # Templates uebergeben `ref` nur in release.yml (den Tag von
      # release-please), und `pull_request_target` kommt in keinem davon vor.
      # Der Riegel gilt Konsumenten, die ihren eigenen Aufrufer schreiben.
      - name: Refuse a caller-supplied ref on pull_request_target
        if: github.event_name == 'pull_request_target' && inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "::error::refusing to check out '$REF' on pull_request_target."
            echo "On this event the workflow has access to repository secrets while"
            echo "the ref may point at a fork. Building, pushing and SIGNING that"
            echo "code would publish an artefact you cannot take back."
            echo "Use pull_request (no secrets) for untrusted contributions, or"
            echo "call this atom from an event whose ref you control."
          } >&2
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        # Self-CI: caller's SHA. Cross-repo: floating v4. See trivy-fs.yml for rationale.
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout catalog for composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog

      - name: Resolve short SHA
        id: shortsha
        env:
          FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "short=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Compute prerelease tag (if needed)
        id: prerelease_tag
        if: inputs.prerelease && inputs.tag == ''
        uses: ./.catalog/actions/compute-prerelease-tag
        with:
          branch: ${{ github.head_ref || github.ref_name }}
          short_sha: ${{ steps.shortsha.outputs.short }}

      - name: Resolve effective tag and image name
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_IMAGE: ${{ inputs.image_name }}
          DEFAULT_IMAGE: ${{ github.repository }}
          PRE_TAG: ${{ steps.prerelease_tag.outputs.tag_with_sha }}
          PRE_MOVING: ${{ steps.prerelease_tag.outputs.moving_tag }}
          IS_PRE: ${{ inputs.prerelease }}
        run: |
          TAG="${INPUT_TAG:-}"
          if [[ -z "$TAG" ]] && [[ "$IS_PRE" == "true" ]]; then
            TAG="$PRE_TAG"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::tag input is empty and prerelease=false; cannot resolve tag"
            exit 1
          fi
          IMG="${INPUT_IMAGE:-$DEFAULT_IMAGE}"
          {
            echo "tag=$TAG"
            echo "moving_tag=$PRE_MOVING"
            echo "image_name=$IMG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runs_on_input: runs_on_amd64
          - platform: linux/arm64
            arch: arm64
            runs_on_input: runs_on_arm64
    runs-on: ${{ fromJSON(matrix.runs_on_input == 'runs_on_amd64' && inputs.runs_on_amd64 || inputs.runs_on_arm64) }}
    timeout-minutes: 60
    steps:
      - name: Check platform selected
        id: check
        # Via env:, never `${{ }}` in the run body. Interpolated directly, a
        # caller-supplied `platforms` is pasted into the shell SOURCE before
        # bash parses it, so a crafted value can close the `[[ ]]` and append
        # its own commands — executed on a long-lived self-hosted runner, in a
        # job holding `packages: write` and `id-token: write`.
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORMS" == *"$PLATFORM"* ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping $PLATFORM — not in inputs.platforms"
          fi

      # Fork-Guard wie in den anderen Jobs (Audit D-9). Dieser Checkout haengt
      # zusaetzlich an der Plattform-Auswahl, deshalb steht der Riegel als
      # eigener Schritt davor und nicht in derselben `if`-Bedingung — er soll
      # auch dann greifen, wenn diese Plattform gar nicht gebaut wird.
      - name: Refuse a caller-supplied ref on pull_request_target
        if: github.event_name == 'pull_request_target' && inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "::error::refusing to check out '$REF' on pull_request_target."
            echo "On this event the workflow has access to repository secrets while"
            echo "the ref may point at a fork. Building, pushing and SIGNING that"
            echo "code would publish an artefact you cannot take back."
            echo "Use pull_request (no secrets) for untrusted contributions, or"
            echo "call this atom from an event whose ref you control."
          } >&2
          exit 1
      - if: steps.check.outputs.selected == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Mint catalog-scoped App token
        if: steps.check.outputs.selected == 'true'
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        # Self-CI: caller's SHA. Cross-repo: floating v4.
        if: steps.check.outputs.selected == 'true'
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout catalog for composite actions
        if: steps.check.outputs.selected == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog
      - name: Log in to GHCR
        if: steps.check.outputs.selected == 'true'
        uses: ./.catalog/actions/ghcr-login

      # Basis-Images von Docker Hub werden sonst ANONYM gezogen, und das
      # Kontingent zaehlt pro Egress-IP — die sich der ganze Cluster teilt.
      # Am 2026-08-26 im mailstack-Release belegt:
      #
      #   429 Too Many Requests / 401 Unauthorized
      #   HEAD https://registry-1.docker.io/v2/library/debian/manifests/trixie-...
      #
      # Die Folgekette ist teuer: der Build scheitert, damit werden merge, scan
      # UND chart-image-pins uebersprungen — der git-Tag existiert dann, das
      # Image dazu nie. Angemeldet zaehlt das Kontingent pro KONTO.
      #
      # `secrets:` bleibt undeklariert: `secrets: inherit` der Aufrufer reicht
      # die Werte durch, ohne die Signatur des workflow_call zu aendern. Repos
      # ohne die Secrets uebergeben leere Zeichenketten, und die Action
      # ueberspringt den Login still.
      - name: Log in to Docker Hub
        if: steps.check.outputs.selected == 'true'
        uses: ./.catalog/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.check.outputs.selected == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Compute artifact + cache suffix from image_name
        id: suffix
        if: steps.check.outputs.selected == 'true'
        env:
          IMG_NAME: ${{ needs.version.outputs.image_name }}
        run: |
          # Slashes are invalid in artifact names and inconvenient in cache
          # scopes — sanitize to dashes. Including image_name prevents collisions
          # when multiple docker-build callers run in parallel from the same
          # workflow (e.g. integration tests building distinct fixtures).
          echo "value=$(echo "$IMG_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        if: steps.check.outputs.selected == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build_args }}
          outputs: type=image,name=ghcr.io/${{ needs.version.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ steps.suffix.outputs.value }}-${{ matrix.arch }}
          # ignore-error: a cache-backend outage must never fail a release
          # build. Learned from actions-runner-image v1.5.1: the cluster-local
          # cache server 500'd on FinalizeCacheEntryUpload (falcondev#239,
          # >1000 multipart parts) and buildx treated the cache export as
          # fatal — image push and all build steps had already succeeded.
          cache-to: type=gha,mode=max,ignore-error=true,scope=build-${{ steps.suffix.outputs.value }}-${{ matrix.arch }}

      - name: Export digest
        if: steps.check.outputs.selected == 'true'
        run: |
          # Clear first, don't just mkdir -p. Self-hosted runners keep /tmp
          # across jobs, so a digest left behind by an earlier build on this
          # same runner would be picked up by the `path: /tmp/digests/*` upload
          # below and land in the merge job's manifest list — either failing
          # `imagetools create` with `manifest unknown` (foreign image) or,
          # worse, silently pointing one architecture of the new tag at an
          # older release. The merge job already does exactly this; the build
          # jobs were missing it.
          rm -rf /tmp/digests && mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - if: steps.check.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Arch FIRST, then image-suffix — keeps the merge job's download
          # pattern unambiguous. Putting suffix first allowed "test-fixture-*"
          # to also match "test-fixture-cve-amd64" (because `cve-amd64` is a
          # valid wildcard match for `*`), which mixed digests from unrelated
          # builds in the merge job.
          name: digests-${{ matrix.arch }}-${{ steps.suffix.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ${{ fromJSON(inputs.runs_on_merge) }}
    timeout-minutes: 60
    outputs:
      image_ref: ${{ steps.compose.outputs.image_ref }}
      moving_ref: ${{ steps.compose.outputs.moving_ref }}
      digest: ${{ steps.merge_step.outputs.digest }}
    steps:
      # Fork-Guard (Audit D-9). `pull_request_target` ist das EINZIGE Ereignis,
      # bei dem Secrets bereitstehen UND der Aufrufer eine fremde Revision
      # auschecken kann. Genau diese Kombination — bekannt als "pwn request" —
      # baut Code aus einem Fork mit den Registry-Zugangsdaten des Adopters,
      # signiert ihn mit dessen cosign-Identitaet und attestiert ihn. Ein
      # veroeffentlichtes, signiertes Schadimage laesst sich nicht
      # zurueckholen.
      #
      # Abgewiesen statt gewarnt: bei allen anderen Befunden dieses Audits war
      # Sichtbarkeit die richtige Antwort, hier nicht — die Warnung erschiene
      # erst, wenn das Image bereits gebaut, gepusht und signiert ist.
      #
      # Nicht erreichbar ueber die gerenderten Workflows dieses Katalogs: die
      # Templates uebergeben `ref` nur in release.yml (den Tag von
      # release-please), und `pull_request_target` kommt in keinem davon vor.
      # Der Riegel gilt Konsumenten, die ihren eigenen Aufrufer schreiben.
      - name: Refuse a caller-supplied ref on pull_request_target
        if: github.event_name == 'pull_request_target' && inputs.ref != ''
        env:
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "::error::refusing to check out '$REF' on pull_request_target."
            echo "On this event the workflow has access to repository secrets while"
            echo "the ref may point at a fork. Building, pushing and SIGNING that"
            echo "code would publish an artefact you cannot take back."
            echo "Use pull_request (no secrets) for untrusted contributions, or"
            echo "call this atom from an event whose ref you control."
          } >&2
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        # Self-CI: caller's SHA. Cross-repo: floating v4. See trivy-fs.yml for rationale.
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout catalog for composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog
      - name: Log in to GHCR
        uses: ./.catalog/actions/ghcr-login

      # Auch hier, obwohl dieser Job nur `imagetools` gegen GHCR faehrt:
      # `docker/setup-buildx-action` legt weiter unten einen Builder mit dem
      # Standardtreiber `docker-container` an und zieht dafuer
      # `moby/buildkit:buildx-stable-1` — von Docker Hub. Im Log eines echten
      # Laufs nachgesehen, nicht angenommen.
      - name: Log in to Docker Hub
        uses: ./.catalog/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute artifact suffix from image_name
        id: suffix
        env:
          IMG_NAME: ${{ needs.version.outputs.image_name }}
        run: |
          echo "value=$(echo "$IMG_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Clean digest dir (self-hosted runners persist /tmp between jobs)
        run: rm -rf /tmp/digests && mkdir -p /tmp/digests

      # Guards mirror the build matrix's platform skip: an unselected
      # platform never uploads its digest artifact, so an unconditional
      # download would fail every single-platform build in the merge job.
      - name: Download amd64 digest
        if: contains(inputs.platforms, 'linux/amd64')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          name: digests-amd64-${{ steps.suffix.outputs.value }}

      - name: Download arm64 digest
        if: contains(inputs.platforms, 'linux/arm64')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          name: digests-arm64-${{ steps.suffix.outputs.value }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # Die beweglichen Tags werden hier NICHT mitgepusht. Sie kommen erst,
      # nachdem Signatur und Attestation stehen — siehe den Zwei-Phasen-Block
      # weiter unten.
      - name: Compose deferred tag list
        id: tags
        env:
          IMG: ghcr.io/${{ needs.version.outputs.image_name }}
          MOVING: ${{ needs.version.outputs.moving_tag }}
          IS_PRE: ${{ inputs.prerelease }}
        run: |
          ARGS=""
          if [[ "$IS_PRE" != "true" ]]; then
            ARGS="$ARGS -t $IMG:latest"
          fi
          if [[ -n "$MOVING" ]]; then
            ARGS="$ARGS -t $IMG:$MOVING"
          fi
          echo "deferred_tag_args=${ARGS# }" >> "$GITHUB_OUTPUT"

      # ----- Zwei-Phasen-Veroeffentlichung (Phase 1 von 2) ------------------
      # Nur der unveraenderliche Versions-Tag entsteht hier. `latest` und der
      # bewegliche Major-Tag folgen erst nach cosign — sie sind das, was
      # automatische Puller dauernd abholen, und die duerfen nie fuer ein paar
      # Sekunden auf ein unsigniertes Image zeigen.
      #
      # Warum kein wegwerfbarer Staging-Tag: GHCR kennt kein Loeschen eines
      # einzelnen Tags — nur der Version als Ganzes, und die traegt danach die
      # echten Tags. Ein Staging-Tag bliebe also fuer immer an jedem Release
      # kleben. Der Rest-Spalt ist damit der Versions-Tag waehrend der
      # Signaturphase; wer verifiziert, bekommt dort ein sauberes Nein, und
      # schlaegt cosign fehl, ist der Job rot.
      - name: Create manifest list under the version tag and capture digest
        id: merge_step
        working-directory: /tmp/digests
        env:
          IMG: ghcr.io/${{ needs.version.outputs.image_name }}
          # TAG via env: it derives from the caller's `tag` input, and a value
          # like `v1$(command)` interpolated into the run body would be
          # substituted before bash parses the line, executing on the runner.
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$IMG:$TAG" \
            $(printf "$IMG@sha256:%s " *)

          # `create` pusht die Manifest-Liste, `inspect` liest denselben Tag
          # unmittelbar danach wieder. Am 2026-08-26 ist genau hier ein Lauf
          # abgebrochen:
          #
          #   ERROR: ghcr.io/serverkraken/reusable-workflows/test-multi-worker:...: not found
          #
          # `create` war dabei erfolgreich — der Schritt laeuft unter `bash -e`,
          # ein Fehlschlag davor haette vorher abgebrochen. Derselbe Commit lief
          # beim Neustart unveraendert durch. Der Tag war also erzeugt, nur noch
          # nicht lesbar.
          #
          # Die Stelle ist die denkbar schlechteste: die Arch-Images sind zu dem
          # Zeitpunkt bereits gepusht. Der Release bricht ab und hinterlaesst
          # einen halben Zustand.
          #
          # Bewusst BEGRENZT: vier Wiederholungen mit wachsender Pause, zusammen
          # 20 Sekunden. Bleibt es dabei, ist es kein Ausbreitungsproblem — dann
          # soll der echte Fehler durchschlagen, statt wegretried zu werden.
          # Genau daran ist in dieser Sitzung schon einmal ein 403 voreilig
          # "transient" genannt worden.
          DIGEST=""
          for attempt in 1 2 3 4 5; do
            if DIGEST=$(docker buildx imagetools inspect "$IMG:$TAG" \
                          --format '{{.Manifest.Digest}}' 2>/dev/null); then
              break
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "::error::manifest list $IMG:$TAG was created but is still not readable after 5 attempts" >&2
              # Ohne Unterdrueckung laufen lassen, damit die echte Meldung im Log steht.
              docker buildx imagetools inspect "$IMG:$TAG" --format '{{.Manifest.Digest}}'
              exit 1
            fi
            echo "::notice::$IMG:$TAG not readable yet (attempt $attempt) — retrying"
            sleep $(( attempt * 2 ))
          done
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve the commit that was actually built
        id: source
        # github.sha is the commit that TRIGGERED the run. The build checked out
        # inputs.ref, which is a different commit whenever a release job builds
        # a freshly tagged tree. Attesting the trigger commit sends any
        # source-to-image policy looking at code that was never built.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compose image_ref output
        id: compose
        env:
          IMG: ghcr.io/${{ needs.version.outputs.image_name }}
          TAG: ${{ needs.version.outputs.tag }}
          MOVING: ${{ needs.version.outputs.moving_tag }}
        run: |
          echo "image_ref=$IMG:$TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$MOVING" ]]; then
            echo "moving_ref=$IMG:$MOVING" >> "$GITHUB_OUTPUT"
          else
            echo "moving_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Cosign
        if: inputs.sign || inputs.attest
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: inputs.sign
        env:
          IMG: ghcr.io/${{ needs.version.outputs.image_name }}
          DIGEST: ${{ steps.merge_step.outputs.digest }}
        run: cosign sign --yes "$IMG@$DIGEST"

      - name: Attest build provenance (cosign SLSA v0.2)
        if: inputs.attest
        env:
          IMG: ghcr.io/${{ needs.version.outputs.image_name }}
          DIGEST: ${{ steps.merge_step.outputs.digest }}
          REPO: ${{ github.repository }}
          # Der gebaute Ref/Commit, nicht der ausloesende — siehe den Schritt
          # "Resolve the commit that was actually built".
          REF: ${{ inputs.ref || github.ref }}
          SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BUILD_STARTED="$(date -u -Iseconds)"
          cat > predicate.json <<EOF
          {
            "buildType": "https://github.com/actions/runner/buildTypes/workflow/v1",
            "builder": {
              "id": "https://github.com/serverkraken/reusable-workflows/.github/workflows/docker-build.yml"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${REPO}@${REF}",
                "digest": {"sha1": "${SHA}"},
                "entryPoint": ".github/workflows/docker-build.yml"
              },
              "parameters": {},
              "environment": {}
            },
            "metadata": {
              "buildInvocationId": "${REPO}/actions/runs/${RUN_ID}",
              "buildStartedOn": "${BUILD_STARTED}",
              "completeness": {"parameters": true, "environment": false, "materials": false},
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${REPO}@${REF}",
                "digest": {"sha1": "${SHA}"}
              }
            ]
          }
          EOF
          # Defensive: ensure variable expansion produced well-formed JSON.
          jq empty predicate.json
          cosign attest --yes --type slsaprovenance \
            --predicate predicate.json "${IMG}@${DIGEST}"

      # ----- Zwei-Phasen-Veroeffentlichung (Phase 2 von 2) ------------------
      # Erst jetzt bekommen `latest` und der bewegliche Major-Tag ihren Zeiger.
      # Der Digest ist derselbe wie in Phase 1 — ein Tag ist nur ein Verweis,
      # also gilt die eben erzeugte Signatur unveraendert weiter.
      - name: Publish moving tags onto the signed digest
        if: steps.tags.outputs.deferred_tag_args != ''
        env:
          IMG: ghcr.io/${{ needs.version.outputs.image_name }}
          TAG_ARGS: ${{ steps.tags.outputs.deferred_tag_args }}
          DIGEST: ${{ steps.merge_step.outputs.digest }}
        run: |
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAG_ARGS "$IMG@$DIGEST"

      - name: Generate SBOM
        if: inputs.sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        if: inputs.sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Per image — the digest artifacts above already do this. Without
          # the suffix a release run that builds several images leaves that
          # many artifacts all called `sbom-spdx` (live: mailstack run
          # 32675842176 had four), and an SBOM nobody can attribute to an
          # image cannot answer the one question an SBOM exists for.
          name: sbom-spdx-${{ steps.suffix.outputs.value }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        env:
          IMAGE_NAME: ${{ needs.version.outputs.image_name }}
          TAG: ${{ needs.version.outputs.tag }}
          DIGEST: ${{ steps.merge_step.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
          SIGN: ${{ inputs.sign }}
          ATTEST: ${{ inputs.attest }}
          SBOM: ${{ inputs.sbom }}
        run: |
          glyph_bool() { [[ "$1" == "true" ]] && echo "✓" || echo "−"; }
          {
            echo "## docker-build"
            echo ""
            echo "**Tool:** Buildx (distributed multi-arch)"
            echo "**Result:** ✓ pushed"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`ghcr.io/${IMAGE_NAME}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Platforms | \`${PLATFORMS}\` |"
            echo "| Sign | $(glyph_bool "$SIGN") cosign keyless |"
            echo "| Attest | $(glyph_bool "$ATTEST") SLSA provenance |"
            echo "| SBOM | $(glyph_bool "$SBOM") SPDX-JSON |"
          } >> "$GITHUB_STEP_SUMMARY" || true

  post-comment:
    if: inputs.prerelease && github.event_name == 'pull_request'
    needs: [version, merge]
    runs-on: ${{ fromJSON(inputs.runs_on_merge) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        # Self-CI: caller's SHA. Cross-repo: floating v4.
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog
      - name: Post PR comment
        uses: ./.catalog/actions/post-prerelease-comment
        with:
          image_ref: ghcr.io/${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.tag }}
          pr_number: ${{ github.event.pull_request.number }}
