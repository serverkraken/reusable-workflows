# .github/workflows/secret-scan.yml
# Summary convention: docs/conventions/step-summary.md
#
# General-purpose gitleaks secret scanner. Git-history-aware by default
# (PR-diff / push / full by event); set no_git: true to scan a directory's
# files without git history (used for fixture tests and ad-hoc scans).
#
# Stability surface (workflow_call contract — breaking changes = major bump):
#   inputs:  config_path, gitleaks_version, fail_on_findings, upload_sarif,
#            fetch_depth, no_git, scan_path, runs_on
#   secrets: release_please_app_client_id, release_please_app_private_key
#   outputs: findings_count
name: secret-scan
on:
  workflow_call:
    inputs:
      config_path:
        description: 'Path to a .gitleaks.toml. Empty → gitleaks built-in ruleset.'
        required: false
        type: string
        default: ''
      gitleaks_version:
        description: 'Override gitleaks version (empty → composite default).'
        required: false
        type: string
        default: ''
      fail_on_findings:
        description: 'Exit non-zero when gitleaks reports findings.'
        required: false
        type: boolean
        default: true
      upload_sarif:
        description: 'Upload SARIF to GitHub code-scanning. Auto-skipped on forks.'
        required: false
        type: boolean
        default: true
      report_slug:
        description: >-
          Suffix that makes this call's SARIF category and artifact name
          unique. Required when a repo calls this atom more than once in the
          same workflow: GitHub keeps one analysis per category, so a shared
          category makes the second upload REPLACE the first, and the shared
          artifact name fails the run outright. Empty (the default) keeps the
          historical names, so single-call adopters are unaffected.
        required: false
        type: string
        default: ''
      fetch_depth:
        description: 'Checkout fetch-depth (0 = full history; needed for PR-diff/full scans).'
        required: false
        type: number
        default: 0
      no_git:
        description: 'Scan files under scan_path without git history (gitleaks --no-git).'
        required: false
        type: boolean
        default: false
      scan_path:
        description: 'Directory to scan when no_git: true.'
        required: false
        type: string
        default: '.'
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux"]'
    outputs:
      findings_count:
        description: 'Number of gitleaks findings.'
        value: ${{ jobs.scan.outputs.findings_count }}
    secrets:
      release_please_app_client_id:
        required: true
        description: 'GitHub App Client ID with contents:read on the catalog repo.'
      release_please_app_private_key:
        required: true
        description: 'PEM private key for the GitHub App.'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scan_path }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    outputs:
      findings_count: ${{ steps.count.outputs.findings_count }}
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        # Fest auf den Workspace: der Waechter laeuft VOR dem Checkout, und ein
        # Job-Ebene `defaults.run.working-directory` (goreleaser.yml) zeigt auf
        # ein Verzeichnis, das es dann noch nicht gibt. Ohne diese Zeile
        # scheitert der Schritt mit "No such file or directory", statt den Wert
        # zu pruefen — gemessen an Lauf 33062297620.
        working-directory: ${{ github.workspace }}
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout catalog for composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog
      - name: Install gitleaks
        uses: ./.catalog/actions/install-gitleaks
        with:
          version: ${{ inputs.gitleaks_version }}
      - name: Run gitleaks
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          NO_GIT: ${{ inputs.no_git }}
          SCAN_PATH: ${{ inputs.scan_path }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --exit-code 0 keeps the job alive so SARIF uploads and the count/gate
        # steps run deterministically; the gate is enforced by "Fail on findings".
        run: |
          set -euo pipefail
          args=(detect --redact --verbose --no-banner --report-format sarif --report-path gitleaks.sarif --exit-code 0)
          if [[ -n "$CONFIG_PATH" ]]; then
            args+=(--config "$CONFIG_PATH")
          fi
          if [[ "$NO_GIT" == "true" ]]; then
            args+=(--no-git --source "$SCAN_PATH")
          elif [[ "$EVENT" == "pull_request" ]]; then
            args+=(--log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}")
          elif [[ "$EVENT" == "push" ]]; then
            args+=(--log-opts="--no-merges -1 HEAD")
          fi
          # else (workflow_dispatch / schedule): full-history scan, no log-opts.
          gitleaks "${args[@]}"
      - name: Count findings
        id: count
        # Guard on a non-empty SARIF and coerce a blank result to 0: jq on an
        # empty/missing file yields no output (exit 0), which would leave
        # findings_count as "" instead of "0".
        run: |
          COUNT=0
          if [[ -s gitleaks.sarif ]]; then
            COUNT=$(jq '[.runs[].results[]] | length' gitleaks.sarif 2>/dev/null || echo 0)
          fi
          COUNT=${COUNT:-0}
          echo "findings_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "gitleaks findings: $COUNT"
      - name: Derive report slug
        id: slug
        env:
          RAW: ${{ inputs.report_slug }}
        run: |
          set -euo pipefail
          # Empty stays empty: that renders the historical category/artifact
          # names, so nothing drifts for adopters calling this atom once.
          slug="$(printf '%s' "${RAW:-}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          if [ -n "$slug" ]; then
            echo "category=:$slug" >> "$GITHUB_OUTPUT"
            echo "artifact=-$slug" >> "$GITHUB_OUTPUT"
          else
            echo "category=" >> "$GITHUB_OUTPUT"
            echo "artifact=" >> "$GITHUB_OUTPUT"
          fi
          echo "Report slug: ${slug:-<none>}"

      - name: Upload SARIF to code-scanning
        # Fork-PR guard only: on push/schedule/dispatch there is no
        # pull_request context, which used to skip the upload entirely.
        if: inputs.upload_sarif && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: gitleaks.sarif
          category: secret-scan${{ steps.slug.outputs.category }}
      - name: Summary
        if: always()
        env:
          COUNT: ${{ steps.count.outputs.findings_count }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            result="✓ no secrets"
          elif [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
            result="✗ ${COUNT} secret(s)"
          else
            result="▲ ${COUNT} secret(s) (gate disabled)"
          fi
          {
            echo "## secret-scan"
            echo ""
            echo "**Result:** ${result}"
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Fail on findings
        if: inputs.fail_on_findings && steps.count.outputs.findings_count != '0'
        env:
          COUNT: ${{ steps.count.outputs.findings_count }}
        run: |
          echo "::error::gitleaks found $COUNT secret(s)"
          exit 1
