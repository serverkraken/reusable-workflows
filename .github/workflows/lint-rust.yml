# .github/workflows/lint-rust.yml
# Reusable workflow: lint Rust with cargo fmt --check + cargo clippy -D warnings.
# Summary convention: docs/conventions/step-summary.md
name: lint-rust
on:
  workflow_call:
    inputs:
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux","X64"]'
      working_directory:
        description: 'Crate root directory.'
        required: false
        type: string
        default: '.'
      rust_toolchain:
        description: 'rustup toolchain. Empty → rustup reads rust-toolchain.toml if present, else stable.'
        required: false
        type: string
        default: ''
      clippy_args:
        description: 'Extra arguments to clippy after `--`.'
        required: false
        type: string
        default: '-D warnings'

permissions:
  contents: read

concurrency:
  group: lint-rust-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        # Fest auf den Workspace: der Waechter laeuft VOR dem Checkout, und ein
        # Job-Ebene `defaults.run.working-directory` (goreleaser.yml) zeigt auf
        # ein Verzeichnis, das es dann noch nicht gibt. Ohne diese Zeile
        # scheitert der Schritt mit "No such file or directory", statt den Wert
        # zu pruefen — gemessen an Lauf 33062297620.
        working-directory: ${{ github.workspace }}
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain (explicit)
        if: inputs.rust_toolchain != ''
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: rustfmt, clippy

      - name: Install Rust toolchain (from rust-toolchain.toml or stable)
        if: inputs.rust_toolchain == ''
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ inputs.working_directory }}

      - name: cargo fmt --check
        id: fmt
        working-directory: ${{ inputs.working_directory }}
        run: cargo fmt --check

      - name: cargo clippy
        id: clippy
        working-directory: ${{ inputs.working_directory }}
        # Via env:, never `${{ }}` in the run body. Interpolated directly, the
        # value is pasted into the shell SOURCE before bash parses it, so
        # `clippy_args: '-D warnings || true #'` turned a real clippy failure
        # into a green lint job — a caller could silently disable this gate.
        # `$CLIPPY_ARGS` expands after parsing: it still word-splits into a
        # flag list (that is the point), but `||`, `#` and friends arrive at
        # clippy as literal arguments and are rejected loudly.
        env:
          CLIPPY_ARGS: ${{ inputs.clippy_args }}
        run: |
          # shellcheck disable=SC2086
          cargo clippy --no-deps -- $CLIPPY_ARGS

      - name: Summary
        if: always()
        env:
          WD: ${{ inputs.working_directory }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          glyph() {
            case "$1" in
              success) echo "✓" ;;
              failure) echo "✗" ;;
              skipped) echo "−" ;;
              *)       echo "?" ;;
            esac
          }
          if [[ "$FMT_OUTCOME" == "success" && "$CLIPPY_OUTCOME" == "success" ]]; then
            result="✓ passed"
          else
            result="✗ failed"
          fi
          {
            echo "## lint-rust"
            echo ""
            echo "**Tools:** cargo fmt, cargo clippy"
            echo "**Working dir:** \`${WD}\`"
            echo "**Result:** ${result}"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| cargo fmt --check | $(glyph "$FMT_OUTCOME") |"
            echo "| cargo clippy | $(glyph "$CLIPPY_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY" || true
