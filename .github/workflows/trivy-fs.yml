# .github/workflows/trivy-fs.yml
# Summary convention: docs/conventions/step-summary.md
name: trivy-fs
on:
  workflow_call:
    inputs:
      scanners:
        description: 'Trivy scanners (vuln,secret,misconfig).'
        required: false
        type: string
        default: 'vuln,secret,misconfig'
      severity:
        description: 'Severity levels to fail on.'
        required: false
        type: string
        default: 'HIGH,CRITICAL'
      paths_ignore:
        description: 'Newline-separated paths to skip.'
        required: false
        type: string
        default: ''
      files_ignore:
        description: 'Newline-separated files to skip (--skip-files).'
        required: false
        type: string
        default: ''
      upload_sarif:
        description: 'Upload SARIF to GitHub code-scanning. Auto-skipped on forks.'
        required: false
        type: boolean
        default: true
      report_slug:
        description: >-
          Suffix that makes this call's SARIF category and artifact name
          unique. Required when a repo calls this atom more than once in the
          same workflow: GitHub keeps one analysis per category, so a shared
          category makes the second upload REPLACE the first, and the shared
          artifact name fails the run outright. Empty (the default) keeps the
          historical names, so single-call adopters are unaffected.
        required: false
        type: string
        default: ''
      trivy_version:
        description: 'Override Trivy version (defaults to install-trivy default).'
        required: false
        type: string
        default: ''
      ignore_unfixed:
        description: 'Pass --ignore-unfixed to Trivy (suppress findings without a fix available).'
        required: false
        type: boolean
        default: true
      fail_on_findings:
        description: 'Exit non-zero when severity-matching findings exist.'
        required: false
        type: boolean
        default: true
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux"]'
    outputs:
      findings_count:
        description: 'Number of findings at requested severity.'
        value: ${{ jobs.scan.outputs.findings_count }}
    secrets:
      release_please_app_client_id:
        required: true
        description: 'GitHub App Client ID with contents:read on the catalog repo.'
      release_please_app_private_key:
        required: true
        description: 'PEM private key for the GitHub App.'

permissions:
  contents: read
  security-events: write
  actions: read           # codeql-action telemetry calls /repos/.../actions/runs

concurrency:
  group: trivy-fs-${{ github.workflow }}-${{ github.ref }}-${{ inputs.fail_on_findings }}-${{ inputs.paths_ignore }}-${{ inputs.files_ignore }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 20
    outputs:
      findings_count: ${{ steps.count.outputs.findings_count }}
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Mint catalog-scoped App token
        id: catalog-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.release_please_app_client_id }}
          private-key: ${{ secrets.release_please_app_private_key }}
          owner: serverkraken
          repositories: reusable-workflows
      - name: Resolve catalog ref
        # GitHub Actions does NOT expose the @version the caller pinned in
        # `uses:` inside a reusable workflow. github.workflow_sha returns the
        # caller's commit SHA; github.workflow_ref returns the caller's
        # workflow address. Both are wrong for cross-repo catalog checkout.
        #
        # Self-CI (caller == catalog): use the caller's SHA — it IS a catalog
        # commit and exercises any feature-branch composite-action changes.
        # Cross-repo (adopters): pin to the floating major tag `v4` so
        # adopters at @v4.x.y always get coherent v4 composite actions.
        # Bump the hardcoded major in this block when a new major releases.
        id: catalog-ref
        env:
          IS_SELF_CI: ${{ github.repository == 'serverkraken/reusable-workflows' }}
          SELF_SHA: ${{ github.sha }}
        run: |
          if [[ "$IS_SELF_CI" == "true" ]]; then
            echo "ref=$SELF_SHA" >> "$GITHUB_OUTPUT"
            echo "Self-CI: catalog ref = $SELF_SHA"
          else
            # renovate-marker: catalog-major-ref
            echo "ref=v4" >> "$GITHUB_OUTPUT"
            echo "Cross-repo: catalog ref = v4 (floating)"
          fi
      - name: Checkout catalog for composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: serverkraken/reusable-workflows
          ref: ${{ steps.catalog-ref.outputs.ref }}
          token: ${{ steps.catalog-token.outputs.token }}
          path: .catalog

      - name: Install Trivy
        uses: ./.catalog/actions/install-trivy
        with:
          version: ${{ inputs.trivy_version }}

      - name: Build ignore args
        id: ignore
        env:
          PATHS: ${{ inputs.paths_ignore }}
          FILES: ${{ inputs.files_ignore }}
        run: |
          ARGS=""
          if [[ -n "$PATHS" ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              ARGS="$ARGS --skip-dirs $line"
            done <<< "$PATHS"
          fi
          if [[ -n "$FILES" ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              ARGS="$ARGS --skip-files $line"
            done <<< "$FILES"
          fi
          # Trivy auto-discovers only the plain .trivyignore, NOT the YAML
          # variant with path scoping and statements. Adopters that ship a
          # .trivyignore.yaml expect it to be honored — pass it explicitly
          # (observed 2026-07-28: homelab-mail-nue's file was silently unused).
          if [[ -f .trivyignore.yaml ]]; then
            ARGS="$ARGS --ignorefile .trivyignore.yaml"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run Trivy filesystem scan
        env:
          SCANNERS: ${{ inputs.scanners }}
          SEVERITY: ${{ inputs.severity }}
          IGNORE_ARGS: ${{ steps.ignore.outputs.args }}
          IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
        # `--skip-dirs .catalog` excludes the catalog-checkout clone (this
        # workflow's own implementation detail) from the adopter's scan,
        # otherwise findings in our test fixtures bleed into adopter reports.
        run: |
          set -e
          UNFIXED_FLAG=""
          [[ "$IGNORE_UNFIXED" == "true" ]] && UNFIXED_FLAG="--ignore-unfixed"
          # shellcheck disable=SC2086
          trivy fs \
            --scanners "$SCANNERS" \
            --severity "$SEVERITY" \
            --exit-code 0 \
            $UNFIXED_FLAG \
            --skip-dirs .catalog \
            --format sarif \
            --output trivy-fs.sarif \
            $IGNORE_ARGS .
          # shellcheck disable=SC2086
          trivy fs \
            --scanners "$SCANNERS" \
            --severity "$SEVERITY" \
            --exit-code 0 \
            $UNFIXED_FLAG \
            --skip-dirs .catalog \
            --format json \
            --output trivy-fs.json \
            $IGNORE_ARGS .

      - name: Count findings
        id: count
        run: |
          COUNT=$(jq '[.Results[]? | (.Vulnerabilities // []) + (.Secrets // []) + (.Misconfigurations // []) | length] | add // 0' trivy-fs.json)
          echo "findings_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT severity-matching findings"

      - name: Derive report slug
        id: slug
        env:
          RAW: ${{ inputs.report_slug }}
        run: |
          set -euo pipefail
          # Empty stays empty: that renders the historical category/artifact
          # names, so nothing drifts for adopters calling this atom once.
          slug="$(printf '%s' "${RAW:-}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
          if [ -n "$slug" ]; then
            echo "category=:$slug" >> "$GITHUB_OUTPUT"
            echo "artifact=-$slug" >> "$GITHUB_OUTPUT"
          else
            echo "category=" >> "$GITHUB_OUTPUT"
            echo "artifact=" >> "$GITHUB_OUTPUT"
          fi
          echo "Report slug: ${slug:-<none>}"

      - name: Upload SARIF to code-scanning
        id: sarif
        # Fork-PR guard only: on push/schedule/dispatch there is no
        # pull_request context, which used to skip the upload entirely.
        if: inputs.upload_sarif && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs${{ steps.slug.outputs.category }}

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-fs-sarif${{ steps.slug.outputs.artifact }}
          path: trivy-fs.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        env:
          SEVERITY: ${{ inputs.severity }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          COUNT: ${{ steps.count.outputs.findings_count }}
          REPORT: trivy-fs.json
          SARIF_UPLOADED: ${{ steps.sarif.outcome == 'success' }}
          ALERTS_BASE: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FINDINGS_REPORT: ${{ github.workspace }}/.catalog/scripts/trivy-findings-report.sh
        run: |
          ALERTS_URL="${ALERTS_BASE}?query=is%3Aopen+tool%3ATrivy"
          [[ -n "$PR_NUMBER" ]] && ALERTS_URL="${ALERTS_URL}+pr%3A${PR_NUMBER}"
          trivy_version=$(trivy --version 2>/dev/null | awk '/^Version:/ {print $2}' || echo unknown)
          if [[ -f "$REPORT" ]]; then
            crit=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="CRITICAL")] | length' "$REPORT")
            high=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="HIGH")] | length' "$REPORT")
            med=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="MEDIUM")] | length' "$REPORT")
            low=$(jq '[.Results[]? | (.Vulnerabilities // [], .Secrets // [], .Misconfigurations // [])[] | select(.Severity=="LOW")] | length' "$REPORT")
          else
            crit=0; high=0; med=0; low=0
          fi
          if [[ "$COUNT" == "0" ]]; then
            result="✓ no findings"
          elif [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
            result="✗ ${COUNT} findings"
          else
            result="▲ ${COUNT} findings (gate disabled)"
          fi
          {
            echo "## trivy-fs"
            echo ""
            echo "**Tool:** Trivy ${trivy_version}"
            echo "**Path:** \`.\`"
            echo "**Severities:** \`${SEVERITY}\`"
            echo "**Result:** ${result}"
            echo ""
            echo "| Severity | Count |"
            echo "|---|---|"
            echo "| CRITICAL | ${crit} |"
            echo "| HIGH | ${high} |"
            echo "| MEDIUM | ${med} |"
            echo "| LOW | ${low} |"
            if [[ "$COUNT" != "0" && -f "$REPORT" && -x "$FINDINGS_REPORT" ]]; then
              echo ""
              echo "### Findings"
              echo ""
              MAX_ROWS=50 "$FINDINGS_REPORT" table "$REPORT"
              echo ""
              if [[ "$SARIF_UPLOADED" == "true" ]]; then
                echo "**Code scanning:** [open Trivy alerts](${ALERTS_URL})"
              fi
              echo "**Full report:** SARIF artifact \`trivy-fs-sarif\` on the [run page](${RUN_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Fail on findings
        if: inputs.fail_on_findings && steps.count.outputs.findings_count != '0'
        env:
          COUNT: ${{ steps.count.outputs.findings_count }}
          REPORT: trivy-fs.json
          SARIF_UPLOADED: ${{ steps.sarif.outcome == 'success' }}
          ALERTS_BASE: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINDINGS_REPORT: ${{ github.workspace }}/.catalog/scripts/trivy-findings-report.sh
        run: |
          ALERTS_URL="${ALERTS_BASE}?query=is%3Aopen+tool%3ATrivy"
          [[ -n "$PR_NUMBER" ]] && ALERTS_URL="${ALERTS_URL}+pr%3A${PR_NUMBER}"
          # One annotation per finding (capped at GitHub's 10-per-step limit) so
          # the failing check shows WHAT was found; the full table is in the
          # step summary, the full list in the SARIF artifact / code-scanning.
          if [[ -x "$FINDINGS_REPORT" ]]; then
            MAX_ANNOTATIONS=10 "$FINDINGS_REPORT" annotations "$REPORT" || true
          fi
          where=""
          if [[ "$SARIF_UPLOADED" == "true" ]]; then
            where=" — see $ALERTS_URL"
          fi
          echo "::error::Trivy found $COUNT severity-matching findings (details in step summary)$where"
          exit 1
