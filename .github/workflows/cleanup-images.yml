# .github/workflows/cleanup-images.yml
# Summary convention: docs/conventions/step-summary.md
name: cleanup-images
on:
  workflow_call:
    inputs:
      package_name:
        description: 'GHCR package name. Defaults to the calling repo name.'
        required: false
        type: string
        default: ''
      keep_stable_versions:
        description: 'Min count of v* (semver) versions to keep.'
        required: false
        type: number
        default: 10
      prerelease_age_days:
        description: 'Delete non-semver tags older than N days.'
        required: false
        type: number
        default: 14
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux"]'

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    steps:
      # Leeres runs_on faellt NICHT mehr von selbst auf.
      #
      # Der Fehlerpfad-Test im Nightly (`runs_on: '[]'`) erwartete, dass ein
      # leeres Label-Array den Job scheitern laesst. Das tut es nicht mehr:
      # gemessen am Lauf 33050121217 wurde der Job auf
      # `serverkraken-runner-arm64-5qq4z-l8h98` eingeplant — einem echten
      # self-hosted Runner — mit LEERER Label-Liste, und lief durch.
      #
      # Ein leeres Array heisst also "irgendein Runner der Default-Gruppe".
      # Fuer einen Adopter mit vertipptem oder leerem `runs_on` bedeutet das:
      # kein Fehler, sondern ein Job mit `packages: write`, der Images
      # loescht, auf einer beliebigen Maschine seines Pools.
      #
      # Der Job ist an dieser Stelle bereits eingeplant — das laesst sich in
      # einem workflow_call nicht mehr verhindern, ohne allen Adoptern einen
      # zusaetzlichen Job aufzudraengen. Was sich verhindern laesst, ist dass
      # er ARBEITET: laut scheitern statt still loeschen.
      #
      # Deshalb der ERSTE Schritt: davor passiert nichts Wirksames.
      - name: Reject an empty runs_on
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "array" and length > 0' >/dev/null 2>&1 <<<"$RUNS_ON"; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group, and this job holds packages: write" >&2
            exit 1
          fi

      - name: Resolve package name
        id: pkg
        env:
          INPUT_NAME: ${{ inputs.package_name }}
          DEFAULT_NAME: ${{ github.event.repository.name }}
        run: |
          NAME="${INPUT_NAME:-$DEFAULT_NAME}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Identify prerelease versions older than N days
        id: stale
        env:
          PKG: ${{ steps.pkg.outputs.name }}
          DAYS: ${{ inputs.prerelease_age_days }}
          KEEP: ${{ inputs.keep_stable_versions }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Date math: works on Linux (date -d) and macOS (date -v).
          CUTOFF=$(date -u -d "$DAYS days ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                   || date -u -v-"${DAYS}"d '+%Y-%m-%dT%H:%M:%SZ')
          echo "Cutoff date: $CUTOFF"

          # Both probes below must tell "the API answered: no" apart from "the
          # API did not answer". `2>&1` cannot: it discards the reason, and
          # every failure then reads as "nothing to clean" (audit D-12).
          # Measured against the live API, both give rc=1:
          #
          #   absent package   gh: Package not found. (HTTP 404)
          #   expired token    gh: Bad credentials   (HTTP 401)
          #
          # A weekly cron whose token lapsed therefore reported success while
          # retaining nothing, indefinitely and in green — the one failure mode
          # a retention job must not have. gh writes the JSON body to stdout and
          # a line like `gh: Not Found (HTTP 404)` to stderr, so the status is
          # only reachable as text.
          PROBE_ERR=$(mktemp)
          trap 'rm -f "$PROBE_ERR"' EXIT

          probe_is_404() { [[ "$(<"$PROBE_ERR")" == *"(HTTP 404)"* ]]; }
          probe_died() {
            echo "::error::$1 failed: $(tr -d '\n' < "$PROBE_ERR")" >&2
            echo "::error::an unanswered API call is not 'nothing to clean' — refusing to report success" >&2
            exit 1
          }

          # Owner type (org vs user). A transient failure here used to
          # reclassify an org as a user; the package lookup then 404'd and
          # landed back in "not published".
          if gh api "/orgs/${OWNER}" >/dev/null 2>"$PROBE_ERR"; then
            OWNER_PATH="orgs/${OWNER}"
          elif probe_is_404; then
            OWNER_PATH="users/${OWNER}"
          else
            probe_died "owner lookup for ${OWNER}"
          fi

          # URL-encode the package name (may contain slashes for path-style names).
          PKG_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PKG")

          # A package that was never published is not an error for a retention
          # job — there is simply nothing to retain. Without this probe the
          # listing below returns "Package not found. (HTTP 404)", jq chokes on
          # the error body and set -euo pipefail turns the weekly cron red
          # forever (live: krakenchores, every Sunday since 2026-08-09 — the
          # repo has never cut a release, so neither container package exists).
          # Only 404 means that. Anything else stops the job.
          if gh api "/${OWNER_PATH}/packages/container/${PKG_ENC}" >/dev/null 2>"$PROBE_ERR"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif probe_is_404; then
            echo "Package ${PKG} not published (yet) — nothing to clean."
            {
              echo "exists=false"
              echo "ids="
            } >> "$GITHUB_OUTPUT"
            exit 0
          else
            probe_died "package probe for ${PKG}"
          fi

          # Fetch once, evaluate twice (prereleases below, stable prune after).
          gh api --paginate "/${OWNER_PATH}/packages/container/${PKG_ENC}/versions" \
            | jq -s 'add' > /tmp/pkg-versions.json

          # List all versions, filter non-semver tags older than cutoff, extract IDs.
          IDS=$(jq -r --arg cutoff "$CUTOFF" '
                .[] |
                select(.metadata.container.tags // [] | length > 0) |
                select(
                  (.metadata.container.tags | map(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | any) | not
                ) |
                select(.updated_at < $cutoff) |
                .id
              ' /tmp/pkg-versions.json \
            | paste -sd, -)
          echo "Matching version IDs: ${IDS:-<none>}"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

          # Stable prune, by explicit ID rather than the action's own counting.
          # `min-versions-to-keep` counts VERSION OBJECTS, not releases: one
          # signed, attested, multi-arch release produces roughly five of them
          # (the index, one manifest per architecture, the cosign signature and
          # the attestation). "keep 10" therefore retained about two releases.
          # Worse, with delete-only-untagged-versions:false it could delete an
          # untagged architecture manifest that a still-tagged index points at,
          # leaving a tag that is visible in GHCR but fails to pull
          # (actions/delete-package-versions#162).
          #
          # So: rank only the SEMVER-TAGGED versions, keep the newest $KEEP of
          # them, and delete the rest by id. Untagged objects are never touched
          # here — an orphaned layer costs storage, an unpullable release tag
          # costs an outage.
          STABLE_IDS=$(jq -r --argjson keep "$KEEP" '
                [ .[]
                  | select(.metadata.container.tags // [] | length > 0)
                  | select(.metadata.container.tags | map(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | any)
                ]
                | sort_by(.created_at) | reverse
                | .[$keep:]
                | .[].id
              ' /tmp/pkg-versions.json \
            | paste -sd, -)
          echo "Stable versions over the keep threshold: ${STABLE_IDS:-<none>}"

          # GitHub laesst die LETZTE getaggte Version eines Pakets nicht
          # loeschen — dafuer muss das Paket selbst weg. Gemessen am Lauf
          # 33056414560, als der destruktive Pfad zum ersten Mal ueberhaupt
          # lief (Audit K-8):
          #
          #   Stable versions over the keep threshold: 1177517171
          #   delete version API failed. You cannot delete the last tagged
          #   version of a package. You must delete the package instead.
          #
          # Das trifft genau dann zu, wenn der Prune ALLE getaggten Versionen
          # umfasst — praktisch also nur bei `keep_stable_versions: 0`. Bis
          # hierher war das unbekannt, weil dieser Zweig nie ausgefuehrt wurde.
          #
          # Gemeldet und NICHT selbst behoben: das Paket zu loeschen ist eine
          # deutlich groessere Handlung als Versionen zu pruneen, und ein
          # Aufbewahrungs-Job soll sie nicht im Vorbeigehen treffen. Die
          # Meldung nennt stattdessen beide Auswege.
          if [[ -n "$STABLE_IDS" ]]; then
            tagged_total=$(jq '[ .[]
                  | select(.metadata.container.tags // [] | length > 0)
                  | select(.metadata.container.tags | map(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | any)
                ] | length' /tmp/pkg-versions.json)
            prune_total=$(tr ',' '\n' <<<"$STABLE_IDS" | sed '/^$/d' | wc -l | tr -d ' ')
            if (( prune_total >= tagged_total )); then
              echo "::error::pruning would remove ALL ${tagged_total} tagged version(s) of ${PKG}, and GitHub refuses to delete a package's last tagged version" >&2
              echo "::error::raise keep_stable_versions above 0, or delete the package deliberately via the GHCR UI/API" >&2
              exit 1
            fi
          fi

          echo "stable_ids=$STABLE_IDS" >> "$GITHUB_OUTPUT"

      - name: Delete stale prerelease versions
        if: steps.stale.outputs.ids != ''
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          # package-name + package-type are required by the action.yml schema
          # (actionlint enforces this) even when using package-version-ids,
          # which takes precedence at runtime. Provide them as a no-op default.
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: container
          package-version-ids: ${{ steps.stale.outputs.ids }}

      - name: Prune oldest stable versions over keep threshold
        # Deletes explicit ids computed above. Skips when nothing qualifies —
        # which also covers the unpublished-package case, since the probe then
        # emits an empty list.
        if: steps.stale.outputs.stable_ids != ''
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: container
          package-version-ids: ${{ steps.stale.outputs.stable_ids }}

      - name: Summary
        env:
          PACKAGE: ${{ steps.pkg.outputs.name }}
          KEEP_STABLE: ${{ inputs.keep_stable_versions }}
          PRE_AGE: ${{ inputs.prerelease_age_days }}
          STALE_IDS: ${{ steps.stale.outputs.ids }}
          PKG_EXISTS: ${{ steps.stale.outputs.exists }}
        run: |
          if [[ "${PKG_EXISTS:-}" != "true" ]]; then
            {
              echo "## cleanup-images"
              echo ""
              echo "**Tool:** GitHub Packages API"
              echo "**Result:** ✓ nothing to clean"
              echo ""
              echo "**Package:** \`${PACKAGE}\` — not published (yet)."
            } >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi
          # Derive prerelease-deleted count from the comma-joined ids list.
          # The 'stable' step uses delete-package-versions@v5 directly with no
          # separate outputs — accurate kept/deleted counts for stable versions
          # would require another API call; report '?' to stay truthful.
          if [[ -z "${STALE_IDS:-}" ]]; then
            pre_deleted=0
          else
            pre_deleted=$(echo "$STALE_IDS" | awk -F',' '{print NF}')
          fi
          {
            echo "## cleanup-images"
            echo ""
            echo "**Tool:** GitHub Packages API"
            echo "**Result:** ✓ cleaned"
            echo ""
            echo "**Package:** \`${PACKAGE}\`"
            echo ""
            echo "| Rule | Kept | Deleted |"
            echo "|---|---|---|"
            echo "| Stable (keep last ${KEEP_STABLE}) | ${KEEP_STABLE} (min) | ? |"
            echo "| Prerelease (older than ${PRE_AGE} days) | ? | ${pre_deleted} |"
          } >> "$GITHUB_STEP_SUMMARY" || true
