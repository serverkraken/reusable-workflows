# .github/workflows/integration.yml
# Self-CI: exercises every atom against fixtures. Each atom gets at least
# one happy-path caller and (where applicable) one failure-path caller
# with a downstream assertion job that verifies failure occurred.
name: integration
on:
  pull_request:

# Workflow_call permission cap: the called atoms (docker-build,
# docker-build-multi, trivy-*, semantic-release) declare what they need.
# This block has to at minimum mirror the union, otherwise nested
# permissions are capped down. contents:write + issues:write are needed
# by semantic-release (added 2026-05-22 with the test-semantic-release-dry-run
# integration job). attestations / artifact-metadata permissions removed in
# v4 — cosign-based attest uses packages:write (sidecar push) + id-token:write
# (OIDC), both already covered.
permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- docker-build happy path -----
  # Happy path exercises sign + attest + sbom end-to-end so the catalog
  # itself verifies cosign works on the runner pool. Until 2026-05-20 the
  # ARC runner image lacked gettext-base/envsubst (cosign-installer prereq)
  # and these were forced false. The custom actions-runner-image cutover
  # bakes gettext-base, so flipping these true also serves as the proof
  # that downstream repos (actions-runner-image, etc.) can run sign:true.
  test-docker-build:
    # ANKER: dieser eine Aufruf bleibt bewusst auf den self-hosted Runnern.
    # Die Atome laufen bei den Adoptern dort, und ein Teil ihrer Fehlerklassen
    # existiert NUR auf persistenten Runnern — der /tmp/digests-Fund vom
    # 2026-08-25 etwa waere auf GitHub-Runnern unsichtbar geblieben, weil deren
    # /tmp je Job frisch ist. Eine CI, die ausschliesslich gehostet testet,
    # prueft etwas anderes als das, was ausgeliefert wird.
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/minimal-go
      dockerfile: tests/fixtures/minimal-go/Dockerfile
      image_name: ${{ github.repository }}/test-fixture
      # Exercises the optional ref input end-to-end (same SHA the default
      # checkout would resolve, so the build itself stays unchanged).
      ref: ${{ github.sha }}
      sign: true
      attest: true
      sbom: true

  # ----- attestation verification (proves the cosign attest step produced
  # a sigstore-bundled SLSA predicate at the OCI sidecar location) -----
  assert-attestation-verifies:
    needs: test-docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: GHCR login (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
      - name: Verify cosign SLSA attestation
        env:
          IMG_REF: ${{ needs.test-docker-build.outputs.image_ref }}
        run: |
          set -euo pipefail
          # OIDC identity: cosign attest was invoked from docker-build.yml on this
          # branch, so the cert SAN contains the docker-build.yml workflow path
          # (NOT integration.yml). The regexp matches any ref-suffix.
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/serverkraken/reusable-workflows/\.github/workflows/docker-build\.yml@' \
            "$IMG_REF" > /tmp/att.json
          # Defensive: validate the output is well-formed JSON.
          # cosign's exit code is the actual verification signal.
          jq empty /tmp/att.json
          echo "Cosign SLSA attestation verifies for $IMG_REF"

  # ----- trivy-image happy path (no findings against clean fixture) -----
  test-trivy-image-happy:
    needs: test-docker-build
    uses: ./.github/workflows/trivy-image.yml
    secrets: inherit
    with:
      image_ref: ${{ needs.test-docker-build.outputs.image_ref }}
      fail_on_findings: false
      upload_sarif: false

  assert-trivy-image-clean:
    needs: test-trivy-image-happy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify findings_count == 0
        env:
          COUNT: ${{ needs.test-trivy-image-happy.outputs.findings_count }}
        run: |
          if [[ "$COUNT" != "0" ]]; then
            echo "::error::Expected 0 findings on clean fixture, got $COUNT"
            exit 1
          fi

  # ----- trivy-fs happy path -----
  test-trivy-fs-happy:
    uses: ./.github/workflows/trivy-fs.yml
    secrets: inherit
    with:
      paths_ignore: |
        tests/fixtures/with-secret
        tests/fixtures/lint-test/helm-lint-fail
        tests/fixtures/gitops-planted-secret
      fail_on_findings: false
      upload_sarif: false

  # ----- trivy-fs failure path: must detect secrets on the secret fixture -----
  test-trivy-fs-failure:
    uses: ./.github/workflows/trivy-fs.yml
    secrets: inherit
    with:
      paths_ignore: |
        tests/fixtures/lint-test/helm-lint-fail
        tests/fixtures/gitops-planted-secret
      upload_sarif: false
      fail_on_findings: false   # don't fail the job; we assert on findings_count below

  assert-trivy-fs-finds-secrets:
    needs: test-trivy-fs-failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify findings_count > 0
        env:
          COUNT: ${{ needs.test-trivy-fs-failure.outputs.findings_count }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            echo "::error::Expected secret findings on with-secret fixture, got 0"
            exit 1
          fi
          echo "trivy-fs correctly detected $COUNT findings"

  # ----- trivy-image failure path: CVE fixture must have findings -----
  test-docker-build-cve:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/with-cve
      dockerfile: tests/fixtures/with-cve/Dockerfile
      image_name: ${{ github.repository }}/test-fixture-cve
      sign: false
      attest: false
      sbom: false
      # GitHub-hosted: dieses Repo ist oeffentlich, also sind sie kostenlos und
      # sofort verfuegbar, waehrend der self-hosted amd64-Pool der Engpass ist
      # (zeitweise 2 von 8 online). arm64 via ubuntu-24.04-arm, seit 2025 fuer
      # oeffentliche Repos ebenfalls kostenlos.
      # Bewusst NICHT alle Aufrufe: test-docker-build bleibt self-hosted, siehe
      # den Kommentar dort.
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'


  test-trivy-image-cve:
    needs: test-docker-build-cve
    uses: ./.github/workflows/trivy-image.yml
    secrets: inherit
    with:
      image_ref: ${{ needs.test-docker-build-cve.outputs.image_ref }}
      ignore_unfixed: false   # alpine:3.15 HIGH/CRITICAL CVEs all have upstream fixes; without this the test detects 0
      fail_on_findings: false   # don't fail the job; we assert on findings_count below
      upload_sarif: false
      # Two platforms on purpose. Every caller here used to scan a single one,
      # so the multi-platform wiring had no coverage at all and three bugs in it
      # reached an adopter's release instead: the SARIF upload rejected for
      # carrying several runs under one category, trivy-image.json no longer
      # written (summary silently showed 0/0/0/0), and one CVE on both arches
      # counted twice. assert-trivy-image-cve-merges-platforms guards the shape.
      platforms: linux/amd64,linux/arm64

  assert-trivy-image-cve-finds-vulns:
    needs: test-trivy-image-cve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify findings_count > 0
        env:
          COUNT: ${{ needs.test-trivy-image-cve.outputs.findings_count }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            echo "::error::Expected CVEs on alpine:3.15 fixture, got 0"
            exit 1
          fi
          echo "trivy-image correctly detected $COUNT vulns"

  # ----- multi-platform merge: the shape code-scanning and the summary need.
  #       A directory of per-platform SARIFs is rejected by the CodeQL action
  #       ("multiple SARIF runs with the same category"), and the summary reads
  #       trivy-image.json by that exact name. Both are asserted here because
  #       upload_sarif is off in CI, so the upload itself cannot be exercised.
  assert-trivy-image-cve-merges-platforms:
    needs: test-trivy-image-cve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Matched by pattern rather than the exact slug: the scan derives the
          # artifact name from image_ref, so spelling it out here would break
          # on a repo rename.
          pattern: trivy-image-sarif-*test-fixture-cve
          merge-multiple: true
          path: report
      - name: Assert one SARIF run and a merged JSON report
        run: |
          set -euo pipefail
          runs=$(jq '.runs | length' report/trivy-image.sarif)
          if [[ "$runs" != "1" ]]; then
            echo "::error::merged SARIF carries $runs runs; code-scanning rejects more than one per category"
            exit 1
          fi
          # Every result must point at its own rule: ruleIndex is a position in
          # tool.driver.rules, so a copied index mislabels the alert.
          bad=$(jq -r '.runs[0] as $r | [$r.results[]? | select($r.tool.driver.rules[.ruleIndex].id != .ruleId) | .ruleId] | length' report/trivy-image.sarif)
          if [[ "$bad" != "0" ]]; then
            echo "::error::$bad SARIF result(s) point at the wrong rule after merging"
            exit 1
          fi
          # The name the summary and the annotations read.
          jq -e '.Results' report/trivy-image.json > /dev/null
          # Both platforms were scanned and kept as detail.
          shopt -s nullglob
          per_platform=(report/trivy-sarif/*.sarif)
          if [[ "${#per_platform[@]}" != "2" ]]; then
            echo "::error::expected 2 per-platform SARIFs, found ${#per_platform[@]}"
            exit 1
          fi
          echo "merged SARIF: 1 run, rule indices consistent, JSON report present, 2 platforms scanned"

  # ----- cleanup-images smoke: verify the workflow accepts inputs -----
  # Runs after all image scans complete so prerelease tags aren't deleted
  # before scanning finishes.
  test-cleanup-images:
    needs:
      - test-trivy-image-happy
      - assert-trivy-image-cve-finds-vulns
      - assert-trivy-image-cve-merges-platforms
    uses: ./.github/workflows/cleanup-images.yml
    with:
      package_name: ${{ github.event.repository.name }}/test-fixture
      keep_stable_versions: 1000
      prerelease_age_days: 365
      runs_on: '["ubuntu-latest"]'

  # ----- cleanup-images edge case: a package that was never published is a
  #       no-op, not a failure. Before the existence probe this exact call
  #       ended in "Package not found. (HTTP 404)" -> jq error -> exit 5,
  #       which is what turned krakenchores' weekly cron red from its
  #       onboarding until its first release. The job passing IS the
  #       assertion; the name is deliberately one that can never exist. -----
  test-cleanup-images-missing-package:
    uses: ./.github/workflows/cleanup-images.yml
    with:
      package_name: ${{ github.event.repository.name }}/never-published-fixture
      runs_on: '["ubuntu-latest"]'

  # ----- docker-build-multi happy path: matrix build of 2 images from
  #       the multi-image fixture, manifest stitched, push by digest. -----
  test-docker-build-multi:
    uses: ./.github/workflows/docker-build-multi.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/multi-image
      images: >-
        [
          {"dockerfile": "tests/fixtures/multi-image/Dockerfile",
           "image_name": "serverkraken/reusable-workflows/test-multi-api"},
          {"dockerfile": "tests/fixtures/multi-image/Dockerfile.worker",
           "image_name": "serverkraken/reusable-workflows/test-multi-worker"}
        ]
      sign: true
      attest: true
      sbom: true
      caller_id: happy
      # GitHub-hosted, siehe Begruendung bei test-docker-build-cve.
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'
      runs_on_parse: '["ubuntu-latest"]'


  # ----- goreleaser happy path: snapshot build against the cli-go fixture
  #       with a valid .goreleaser.yaml. No artifacts published. -----
  test-goreleaser:
    uses: ./.github/workflows/goreleaser.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/cli-go-with-goreleaser
      snapshot: true

  # ----- helm-publish happy path: dry-run publish of the helm-only fixture
  #       to a test OCI registry path. No actual push (dry_run: true). -----
  test-helm-publish:
    uses: ./.github/workflows/helm-publish.yml
    secrets: inherit
    with:
      chart_path: tests/fixtures/helm-only
      oci_registry: ghcr.io/serverkraken/test
      dry_run: true

  # ----- kube-validate happy path: valid fixture tree must succeed -----
  test-kube-validate-happy:
    uses: ./.github/workflows/kube-validate.yml
    secrets: inherit
    with:
      manifests_paths: |-
        tests/fixtures/gitops-cluster/kubernetes/apps
        tests/fixtures/gitops-cluster/kubernetes/argo
      sops: false

  # ----- kube-lint happy path: clean fixture + permissive config → 0 -----
  test-kube-lint-happy:
    uses: ./.github/workflows/kube-lint.yml
    secrets: inherit
    with:
      manifests_path: tests/fixtures/gitops-cluster/kubernetes/apps
      config_path: tests/fixtures/gitops-cluster/.kube-linter.yaml
      fail_on_findings: false
      upload_sarif: false

  assert-kube-lint-clean:
    needs: test-kube-lint-happy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count == 0
        env:
          COUNT: ${{ needs.test-kube-lint-happy.outputs.findings_count }}
        run: |
          if [[ "$COUNT" != "0" ]]; then
            echo "::error::Expected 0 kube-linter findings on clean fixture, got $COUNT"
            exit 1
          fi

  # ----- kube-lint find-something: violation fixture + baseline config → >0 -----
  test-kube-lint-findings:
    uses: ./.github/workflows/kube-lint.yml
    secrets: inherit
    with:
      manifests_path: tests/fixtures/gitops-lint-violation/kubernetes/apps
      fail_on_findings: false
      upload_sarif: false

  assert-kube-lint-finds:
    needs: test-kube-lint-findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count > 0
        env:
          COUNT: ${{ needs.test-kube-lint-findings.outputs.findings_count }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            echo "::error::Expected kube-linter findings on violation fixture, got 0"
            exit 1
          fi
          echo "kube-lint correctly detected $COUNT finding(s)"

  # ----- secret-scan happy path: clean fixture, no-git mode → 0 -----
  test-secret-scan-happy:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
    with:
      no_git: true
      scan_path: tests/fixtures/gitops-cluster
      fail_on_findings: false
      upload_sarif: false

  assert-secret-scan-clean:
    needs: test-secret-scan-happy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count == 0
        env:
          COUNT: ${{ needs.test-secret-scan-happy.outputs.findings_count }}
        run: |
          if [[ "$COUNT" != "0" ]]; then
            echo "::error::Expected 0 secrets on clean fixture, got $COUNT"
            exit 1
          fi

  # ----- secret-scan find-something: planted secret, no-git mode → >0 -----
  test-secret-scan-findings:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
    with:
      no_git: true
      scan_path: tests/fixtures/gitops-planted-secret
      fail_on_findings: false
      upload_sarif: false

  assert-secret-scan-finds:
    needs: test-secret-scan-findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count > 0
        env:
          COUNT: ${{ needs.test-secret-scan-findings.outputs.findings_count }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            echo "::error::Expected secret findings on planted-secret fixture, got 0"
            exit 1
          fi
          echo "secret-scan correctly detected $COUNT secret(s)"

  # ----- semantic-release dry-run: exercise the atom against the catalog's
  #       own release-please configs WITHOUT mutating remote state.
  #       skip-github-release + skip-github-pull-request flags on the
  #       release-please-action prevent PR/release/tag mutations. The
  #       atom-level !dry_run guard on the "Move floating major/minor tags"
  #       step prevents the git push --force --tags. So this job exercises
  #       app-token mint, checkout, release-please logic, and output wiring
  #       without any production side-effects.
  test-semantic-release-dry-run:
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit
    with:
      dry_run: true

  assert-semantic-release-outputs:
    needs: test-semantic-release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: paths_released / releases are well-formed JSON and agree
        env:
          PATHS: ${{ needs.test-semantic-release-dry-run.outputs.paths_released }}
          RELEASES: ${{ needs.test-semantic-release-dry-run.outputs.releases }}
        run: |
          set -euo pipefail
          jq -e 'type == "array"' <<< "$PATHS" > /dev/null
          jq -e 'type == "object"' <<< "$RELEASES" > /dev/null
          # every released path has a map entry and vice versa
          diff <(jq -r '.[]' <<< "$PATHS" | sort) <(jq -r 'keys[]' <<< "$RELEASES" | sort)

  # ----- onboard dry-run: exercise detect + render against the catalog itself -----
  test-onboard-dry-run:
    uses: ./.github/workflows/onboard.yml
    with:
      target_repos: serverkraken/reusable-workflows
      language: auto
      dry_run: true
      pin_version: v1
      use_go_cli: false
    secrets: inherit

  # ----- onboard dry-run (Go path): same as above, but forces the onboard
  #       actions through sk-workflows. -----
  test-onboard-dry-run-go:
    uses: ./.github/workflows/onboard.yml
    with:
      target_repos: serverkraken/reusable-workflows
      language: auto
      dry_run: true
      pin_version: v1
      use_go_cli: true
    secrets: inherit

  # ----- release-flutter-android: happy. Exercises the create_release=true
  #       (manual/ad-hoc) path: the atom itself creates the throwaway prerelease
  #       at the fixture tag, builds+signs the fixture APK, attaches it, then
  #       cleanup deletes the release+tag. An explicit fixture version is passed
  #       (not auto-derive) so CI never touches the catalog's real vX tag
  #       namespace — the auto-derive path is exercised by real adopters. -----
  test-release-flutter-android:
    uses: ./.github/workflows/release-flutter-android.yml
    secrets: inherit
    with:
      working_directory: tests/fixtures/flutter-app
      version: v0.0.1-fixture-${{ github.run_id }}
      create_release: true
      use_build_runner: false
      build_apk: true
      build_aab: false
      prerelease: true
      dart_define_secret_names: "GREETING"
      artefact_name_prefix: catalog-test-flutter-app

  cleanup-flutter-release:
    needs: [test-release-flutter-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete fixture release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.1-fixture-${{ github.run_id }}
        run: gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true

  # ----- e2e-kind happy path: fixture creates a 1-node kind cluster in
  # the runner pod's dind sidecar, asserts Ready, deletes it. Runs on the
  # performance pool (atom default) — this is the PR-time proof that kind
  # works inside the ARC topology. -----
  test-e2e-kind:
    uses: ./.github/workflows/e2e-kind.yml
    secrets: inherit
    with:
      script: tests/fixtures/kind-smoke/e2e.sh
      timeout_minutes: 15

  # ----- Summary: aggregates ALL happy-path children into a single status.
  #       Branch-protection will require ONLY this check. Atom-failure-path
  #       tests (cleanup-images-fail, docker-build-multi-fail, goreleaser-fail,
  #       helm-publish-fail) moved to failure-paths-nightly.yml (Phase 9.5).
  #
  #       The find-something tests (test-trivy-fs-failure, test-docker-build-cve,
  #       test-trivy-image-cve) stay here — they exit 0 with fail_on_findings:false
  #       and the assert-* siblings check the count, not the job result. -----
  summary:
    name: "integration / summary"
    needs:
      - test-docker-build
      - assert-attestation-verifies
      - test-trivy-image-happy
      - assert-trivy-image-clean
      - test-trivy-fs-happy
      - test-trivy-fs-failure
      - assert-trivy-fs-finds-secrets
      - test-docker-build-cve
      - test-trivy-image-cve
      - assert-trivy-image-cve-finds-vulns
      - test-cleanup-images
      - test-semantic-release-dry-run
      - assert-semantic-release-outputs
      - test-onboard-dry-run
      - test-onboard-dry-run-go
      - test-docker-build-multi
      - test-goreleaser
      - test-helm-publish
      - test-release-flutter-android
      - test-e2e-kind
      - test-kube-validate-happy
      - test-kube-lint-happy
      - assert-kube-lint-clean
      - test-kube-lint-findings
      - assert-kube-lint-finds
      - test-secret-scan-happy
      - assert-secret-scan-clean
      - test-secret-scan-findings
      - assert-secret-scan-finds
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate child statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | .[].key
          ')
          if [[ -n "$failed" ]]; then
            echo "::error::Failing summary children:"
            while IFS= read -r line; do
              echo "  - $line"
            done <<< "$failed"
            exit 1
          fi
          echo "All required children passed (count=$(echo "$NEEDS_JSON" | jq 'keys | length'))."
