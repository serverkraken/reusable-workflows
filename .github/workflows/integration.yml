# .github/workflows/integration.yml
# Self-CI: exercises every atom against fixtures. Each atom gets at least
# one happy-path caller and (where applicable) one failure-path caller
# with a downstream assertion job that verifies failure occurred.
name: integration
on:
  pull_request:

# Workflow_call permission cap: the called atoms (docker-build,
# docker-build-multi, trivy-*, semantic-release) declare what they need.
# This block has to at minimum mirror the union, otherwise nested
# permissions are capped down. contents:write + issues:write are needed
# by semantic-release (added 2026-05-22 with the test-semantic-release-dry-run
# integration job). attestations / artifact-metadata permissions removed in
# v4 — cosign-based attest uses packages:write (sidecar push) + id-token:write
# (OIDC), both already covered.
permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- docker-build happy path -----
  # Happy path exercises sign + attest + sbom end-to-end so the catalog
  # itself verifies cosign works on the runner pool. Until 2026-05-20 the
  # ARC runner image lacked gettext-base/envsubst (cosign-installer prereq)
  # and these were forced false. The custom actions-runner-image cutover
  # bakes gettext-base, so flipping these true also serves as the proof
  # that downstream repos (actions-runner-image, etc.) can run sign:true.
  test-docker-build:
    # GitHub-hosted wie alle Docker-Tests hier: der amd64-Pool ist dauerhaft
    # knapp (2 von 8; die Kapazitaet kommt nicht zurueck), und ein
    # self-hosted Job im PR-Pfad laesst jeden Pull Request Stunden warten.
    #
    # Die self-hosted-Abdeckung ist damit NICHT aufgegeben, sondern verschoben:
    # nightly-runner-parity.yml baut dieselbe Fixture einmal pro Nacht auf dem
    # Pool, den die Adopter erben. Das ist noetig, weil eine ganze Fehlerklasse
    # nur auf persistenten Runnern existiert — der /tmp/digests-Fund vom
    # 2026-08-25 war auf GitHub-Runnern unsichtbar, weil deren /tmp je Job
    # frisch ist, und ging deshalb bis in ein Adopter-Release durch.
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/minimal-go
      dockerfile: tests/fixtures/minimal-go/Dockerfile
      image_name: ${{ github.repository }}/test-fixture
      # Exercises the optional ref input end-to-end. Deliberately the PR HEAD
      # and not github.sha: on a pull_request those differ (github.sha is the
      # merge commit), and that difference is the whole point — it is what
      # lets assert-attestation-verifies prove the attestation names the
      # commit that was BUILT rather than the one that triggered the run.
      # Until 2026-08-25 this passed github.sha, so the assertion could not
      # have distinguished the two and the defect went unseen.
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sign: true
      attest: true
      sbom: true
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'

  # ----- Einzel-Plattform-Pfad (Audit K-6) -----
  #
  # `docker-build.yml` faehrt IMMER eine Matrix mit beiden Architekturen und
  # ueberspringt die nicht gewaehlte per Schritt ("Check platform selected");
  # `merge` laedt die Digests danach bedingt
  # (`if: contains(inputs.platforms, 'linux/amd64')`).
  #
  # Kein Aufruf hat je einen Einzel-Plattform-Wert uebergeben. Beide Zweige
  # liefen also nie: weder das Ueberspringen noch ein merge, dem nur EIN
  # Digest vorliegt. Die Fixture go-root-multi-image RENDERT zwar
  # `platforms: linux/amd64` an einer Komponente — ausgefuehrt wurde das nie.
  #
  # sign/attest/sbom sind hier aus: geprueft wird der Plattform-Pfad, und die
  # Signaturkette hat in test-docker-build ihre eigene Abdeckung.
  test-docker-build-single-platform:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/minimal-go
      dockerfile: tests/fixtures/minimal-go/Dockerfile
      image_name: ${{ github.repository }}/test-fixture-single
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      platforms: linux/amd64
      sign: false
      attest: false
      sbom: false
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'

  assert-docker-build-single-platform:
    needs: test-docker-build-single-platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: GHCR login (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Assert the image carries exactly one platform
        env:
          IMG_REF: ${{ needs.test-docker-build-single-platform.outputs.image_ref }}
        run: |
          set -euo pipefail
          if [[ -z "$IMG_REF" ]]; then
            echo "::error::image_ref is empty — the single-platform build produced no reference"
            exit 1
          fi
          raw=$(docker buildx imagetools inspect --raw "$IMG_REF")

          # `.manifests` fehlt bei einem einzelnen Manifest und ist bei einer
          # Manifest-Liste vorhanden. Beides ist fuer eine Plattform gueltig —
          # geprueft wird deshalb die MENGE der Plattformen, nicht die Form.
          # `attestation-manifest` zaehlt nicht mit: buildx legt SBOM- und
          # Provenance-Anhaenge als zusaetzliche Eintraege mit
          # platform.architecture == "unknown" ab.
          platforms=$(jq -r '
            if .manifests then
              [ .manifests[]
                | select((.platform.architecture // "unknown") != "unknown")
                | "\(.platform.os)/\(.platform.architecture)" ]
            else
              ["single-manifest"]
            end | sort | join(",")' <<<"$raw")

          echo "platforms in manifest: [${platforms}]"
          if [[ "$platforms" != "linux/amd64" && "$platforms" != "single-manifest" ]]; then
            echo "::error::expected exactly linux/amd64, got [${platforms}] — the arm64 build was not skipped, or merge referenced a digest it never built"
            exit 1
          fi
          echo "single-platform path intact."

  # ----- attestation verification (proves the cosign attest step produced
  # a sigstore-bundled SLSA predicate at the OCI sidecar location) -----
  assert-attestation-verifies:
    needs: test-docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: GHCR login (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
      - name: Verify cosign SLSA attestation
        env:
          IMG_REF: ${{ needs.test-docker-build.outputs.image_ref }}
        run: |
          set -euo pipefail
          # OIDC identity: cosign attest was invoked from docker-build.yml on this
          # branch, so the cert SAN contains the docker-build.yml workflow path
          # (NOT integration.yml). The regexp matches any ref-suffix.
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/serverkraken/reusable-workflows/\.github/workflows/docker-build\.yml@' \
            "$IMG_REF" > /tmp/att.json
          # Defensive: validate the output is well-formed JSON.
          # cosign's exit code is the actual verification signal.
          jq empty /tmp/att.json
          echo "Cosign SLSA attestation verifies for $IMG_REF"

      - name: Assert the attestation names the commit that was built
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          attested=$(head -n1 /tmp/att.json | jq -r '.payload' | base64 -d \
            | jq -r '.predicate.invocation.configSource.digest.sha1')
          echo "attested=$attested  built=$EXPECTED_SHA"
          if [[ "$attested" != "$EXPECTED_SHA" ]]; then
            echo "::error::attestation names $attested, but the image was built from $EXPECTED_SHA"
            exit 1
          fi

      - name: Assert the moving tag resolves to the signed digest
        # Phase 2 of the two-phase publish. The moving tag is pushed only
        # after cosign has signed the digest, so verifying it by name must
        # succeed — if it were pushed before signing, or pointed at a
        # different manifest, this fails.
        env:
          MOVING_REF: ${{ needs.test-docker-build.outputs.moving_ref }}
        run: |
          set -euo pipefail
          if [[ -z "$MOVING_REF" ]]; then
            echo "::error::no moving_ref published — this fixture builds a prerelease and must have one"
            exit 1
          fi
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/serverkraken/reusable-workflows/\.github/workflows/docker-build\.yml@' \
            "$MOVING_REF" > /dev/null
          echo "Moving tag $MOVING_REF carries the signature from the version tag"

  # ----- trivy-image happy path (no findings against clean fixture) -----
  test-trivy-image-happy:
    needs: test-docker-build
    uses: ./.github/workflows/trivy-image.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      image_ref: ${{ needs.test-docker-build.outputs.image_ref }}
      # Scannen, was gebaut wurde: test-docker-build nimmt den Default von
      # docker-build.yml (linux/amd64,linux/arm64) und scannte nur amd64.
      # Die Multi-Plattform-Verdrahtung selbst hat in test-trivy-image-cve
      # eigene Abdeckung; hier geht es um die Regel, nicht um den Mechanismus -
      # check-scan-covers-build.py setzt sie einheitlich durch.
      platforms: linux/amd64,linux/arm64
      fail_on_findings: false
      upload_sarif: false

  assert-trivy-image-clean:
    needs: test-trivy-image-happy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify findings_count == 0
        env:
          COUNT: ${{ needs.test-trivy-image-happy.outputs.findings_count }}
        run: |
          if [[ "$COUNT" != "0" ]]; then
            echo "::error::Expected 0 findings on clean fixture, got $COUNT"
            exit 1
          fi

  # ----- trivy-fs happy path -----
  test-trivy-fs-happy:
    uses: ./.github/workflows/trivy-fs.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      # Two trivy-fs calls in one workflow: without report_slug both upload an
      # artifact called `trivy-fs-sarif` and nobody can tell which scan produced
      # which (verified on run 32843843244 — two same-named artifacts, green run).
      report_slug: happy
      paths_ignore: |
        tests/fixtures/with-secret
        tests/fixtures/lint-test/helm-lint-fail
        tests/fixtures/gitops-planted-secret
      fail_on_findings: false
      upload_sarif: false

  # ----- trivy-fs failure path: must detect secrets on the secret fixture -----
  test-trivy-fs-failure:
    uses: ./.github/workflows/trivy-fs.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      report_slug: findings
      paths_ignore: |
        tests/fixtures/lint-test/helm-lint-fail
        tests/fixtures/gitops-planted-secret
      # Echter Upload (Audit K-13). `upload_sarif` stand in JEDEM Aufruf auf
      # false — der Pfad, ueber den ein Adopter seine Funde ins code-scanning
      # bekommt, lief also nie. Genau hier ist er sinnvoll: dieser Aufruf
      # findet nachweislich etwas (die Assertion unten zaehlt > 0), also
      # transportiert der Upload auch wirklich Inhalt statt eines leeren
      # Berichts.
      #
      # Folge, bewusst: die Fixture-Funde erscheinen im Security-Tab des
      # Katalogs. Sie sind ueber `report_slug: findings` eindeutig
      # kategorisiert und damit als das erkennbar, was sie sind.
      upload_sarif: true
      fail_on_findings: false   # don't fail the job; we assert on findings_count below

  assert-trivy-fs-finds-secrets:
    needs: test-trivy-fs-failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify findings_count > 0
        env:
          COUNT: ${{ needs.test-trivy-fs-failure.outputs.findings_count }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            echo "::error::Expected secret findings on with-secret fixture, got 0"
            exit 1
          fi
          echo "trivy-fs correctly detected $COUNT findings"

  # ----- trivy-image failure path: CVE fixture must have findings -----
  test-docker-build-cve:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/with-cve
      dockerfile: tests/fixtures/with-cve/Dockerfile
      image_name: ${{ github.repository }}/test-fixture-cve
      sign: false
      attest: false
      sbom: false
      # GitHub-hosted: dieses Repo ist oeffentlich, also sind sie kostenlos und
      # sofort verfuegbar, waehrend der self-hosted amd64-Pool der Engpass ist
      # (zeitweise 2 von 8 online). arm64 via ubuntu-24.04-arm, seit 2025 fuer
      # oeffentliche Repos ebenfalls kostenlos.
      # Bewusst NICHT alle Aufrufe: test-docker-build bleibt self-hosted, siehe
      # den Kommentar dort.
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'


  test-trivy-image-cve:
    needs: test-docker-build-cve
    uses: ./.github/workflows/trivy-image.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      image_ref: ${{ needs.test-docker-build-cve.outputs.image_ref }}
      ignore_unfixed: false   # alpine:3.15 HIGH/CRITICAL CVEs all have upstream fixes; without this the test detects 0
      fail_on_findings: false   # don't fail the job; we assert on findings_count below
      upload_sarif: false
      # Two platforms on purpose. Every caller here used to scan a single one,
      # so the multi-platform wiring had no coverage at all and three bugs in it
      # reached an adopter's release instead: the SARIF upload rejected for
      # carrying several runs under one category, trivy-image.json no longer
      # written (summary silently showed 0/0/0/0), and one CVE on both arches
      # counted twice. assert-trivy-image-cve-merges-platforms guards the shape.
      platforms: linux/amd64,linux/arm64

  assert-trivy-image-cve-finds-vulns:
    needs: test-trivy-image-cve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify findings_count > 0
        env:
          COUNT: ${{ needs.test-trivy-image-cve.outputs.findings_count }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            echo "::error::Expected CVEs on alpine:3.15 fixture, got 0"
            exit 1
          fi
          echo "trivy-image correctly detected $COUNT vulns"

  # ----- multi-platform merge: the shape code-scanning and the summary need.
  #       A directory of per-platform SARIFs is rejected by the CodeQL action
  #       ("multiple SARIF runs with the same category"), and the summary reads
  #       trivy-image.json by that exact name. Both are asserted here because
  #       upload_sarif is off in CI, so the upload itself cannot be exercised.
  assert-trivy-image-cve-merges-platforms:
    needs: test-trivy-image-cve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Matched by pattern rather than the exact slug: the scan derives the
          # artifact name from image_ref, so spelling it out here would break
          # on a repo rename.
          pattern: trivy-image-sarif-*test-fixture-cve
          merge-multiple: true
          path: report
      - name: Assert one SARIF run and a merged JSON report
        run: |
          set -euo pipefail
          runs=$(jq '.runs | length' report/trivy-image.sarif)
          if [[ "$runs" != "1" ]]; then
            echo "::error::merged SARIF carries $runs runs; code-scanning rejects more than one per category"
            exit 1
          fi
          # How MANY results survived. Without this every check below is
          # vacuously true on an empty merge: one run, no mismatched rule
          # indices, `.Results` present — a merge that dropped everything used
          # to pass the whole assertion (audit K-19). Reproduced against three
          # synthetic merges before this line existed; all three passed.
          merged=$(jq '.runs[0].results | length' report/trivy-image.sarif)
          if [[ "$merged" == "0" ]]; then
            echo "::error::merged SARIF carries 0 results — the CVE fixture must produce findings"
            exit 1
          fi

          # No result may appear twice. The merger collapses a finding seen on
          # both platforms using [ruleId, level, message.text, locations]
          # (scripts/merge-sarif-runs.py:_result_key); the same key twice means
          # it concatenated instead of deduplicating, and every alert would be
          # filed twice in code-scanning.
          dupes=$(jq '[.runs[0].results[]? | [.ruleId, .level, .message.text, .locations]]
                      | group_by(.) | map(select(length > 1)) | length' report/trivy-image.sarif)
          if [[ "$dupes" != "0" ]]; then
            echo "::error::$dupes finding(s) appear twice in the merged SARIF — dedup did not run"
            exit 1
          fi

          # Bracket the count by what the platforms actually reported: never
          # more than both together, never fewer than one alone.
          sum=0; max=0
          for f in report/trivy-sarif/*.sarif; do
            n=$(jq '[.runs[]?.results[]?] | length' "$f")
            sum=$(( sum + n ))
            (( n > max )) && max=$n
          done
          if (( merged > sum )); then
            echo "::error::merged SARIF has $merged results but the platforms reported $sum in total"
            exit 1
          fi
          if (( merged < max )); then
            echo "::error::merged SARIF has $merged results, fewer than the $max a single platform reported"
            exit 1
          fi

          # Every result must point at its own rule: ruleIndex is a position in
          # tool.driver.rules, so a copied index mislabels the alert.
          bad=$(jq -r '.runs[0] as $r | [$r.results[]? | select($r.tool.driver.rules[.ruleIndex].id != .ruleId) | .ruleId] | length' report/trivy-image.sarif)
          if [[ "$bad" != "0" ]]; then
            echo "::error::$bad SARIF result(s) point at the wrong rule after merging"
            exit 1
          fi
          # The name the summary and the annotations read.
          jq -e '.Results' report/trivy-image.json > /dev/null
          # Both platforms were scanned and kept as detail.
          shopt -s nullglob
          per_platform=(report/trivy-sarif/*.sarif)
          if [[ "${#per_platform[@]}" != "2" ]]; then
            echo "::error::expected 2 per-platform SARIFs, found ${#per_platform[@]}"
            exit 1
          fi
          echo "merged SARIF: 1 run, $merged results (<= $sum reported, >= $max per platform), no duplicates, rule indices consistent, JSON report present, 2 platforms scanned"

  # ----- cleanup-images smoke: verify the workflow accepts inputs -----
  # Runs after all image scans complete so prerelease tags aren't deleted
  # before scanning finishes.
  test-cleanup-images:
    needs:
      - test-trivy-image-happy
      - assert-trivy-image-cve-finds-vulns
      - assert-trivy-image-cve-merges-platforms
    uses: ./.github/workflows/cleanup-images.yml
    with:
      package_name: ${{ github.event.repository.name }}/test-fixture
      keep_stable_versions: 1000
      prerelease_age_days: 365
      runs_on: '["ubuntu-latest"]'

  # ----- cleanup-images edge case: a package that was never published is a
  #       no-op, not a failure. Before the existence probe this exact call
  #       ended in "Package not found. (HTTP 404)" -> jq error -> exit 5,
  #       which is what turned krakenchores' weekly cron red from its
  #       onboarding until its first release. The job passing IS the
  #       assertion; the name is deliberately one that can never exist. -----
  test-cleanup-images-missing-package:
    uses: ./.github/workflows/cleanup-images.yml
    with:
      package_name: ${{ github.event.repository.name }}/never-published-fixture
      runs_on: '["ubuntu-latest"]'

  # ----- docker-build-multi happy path: matrix build of 2 images from
  #       the multi-image fixture, manifest stitched, push by digest. -----
  test-docker-build-multi:
    uses: ./.github/workflows/docker-build-multi.yml
    secrets: inherit
    with:
      tag: ''
      prerelease: true
      context: tests/fixtures/multi-image
      images: >-
        [
          {"dockerfile": "tests/fixtures/multi-image/Dockerfile",
           "image_name": "serverkraken/reusable-workflows/test-multi-api"},
          {"dockerfile": "tests/fixtures/multi-image/Dockerfile.worker",
           "image_name": "serverkraken/reusable-workflows/test-multi-worker"}
        ]
      sign: true
      attest: true
      sbom: true
      caller_id: happy
      # GitHub-hosted, siehe Begruendung bei test-docker-build-cve.
      runs_on_amd64: '["ubuntu-latest"]'
      runs_on_arm64: '["ubuntu-24.04-arm"]'
      runs_on_merge: '["ubuntu-latest"]'
      runs_on_parse: '["ubuntu-latest"]'


  # ----- goreleaser happy path: snapshot build against the cli-go fixture
  #       with a valid .goreleaser.yaml. No artifacts published. -----
  test-goreleaser:
    uses: ./.github/workflows/goreleaser.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      working_directory: tests/fixtures/cli-go-with-goreleaser
      snapshot: true

  # ----- helm-publish happy path: dry-run publish of the helm-only fixture
  #       to a test OCI registry path. No actual push (dry_run: true). -----
  test-helm-publish:
    uses: ./.github/workflows/helm-publish.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      chart_path: tests/fixtures/helm-only
      oci_registry: ghcr.io/serverkraken/test
      dry_run: true

  # ----- kube-validate happy path: valid fixture tree must succeed -----
  # ----- chart-image-bump: bis zum K-2-Fix rief KEIN Self-CI-Workflow dieses
  #       Atom auf. Getestet war nur die Python-Logik in
  #       tests/shell/chart-image-bump.bats — das Wiring drumherum (App-Token,
  #       Katalog-Checkout am Aufrufer-SHA, Skriptaufruf mit echten Inputs,
  #       `changed`-Output, Summary) lief nie. Der einzige Aufrufer war das
  #       Adopter-Template. -----
  test-chart-image-bump:
    uses: ./.github/workflows/chart-image-bump.yml
    secrets: inherit
    with:
      values_file: tests/fixtures/chart-image-bump/values.yaml
      key_template: 'images.{name}.tag'
      # Nur `api` gilt als released. `worker` steht im images-Mapping, fehlt
      # aber in `releases` — genau die Unterscheidung, fuer die es den Input
      # gibt, und der Fixture-Kommentar haelt sie fest.
      releases: '{"images/api": {"version": "9.9.9"}}'
      images: >-
        {"images/api": ["serverkraken/reusable-workflows/api"],
         "images/worker": ["serverkraken/reusable-workflows/worker"]}
      # commit:false — das Atom checkt das AUFRUFENDE Repo aus und pusht
      # dorthin; aus einem PR-Lauf des Katalogs heraus ist das weder moeglich
      # (detached HEAD) noch wuenschenswert. Der Push-Pfad bleibt damit
      # ungetestet; das ist K-11 und ausdruecklich nicht mit erledigt.
      commit: false
      runs_on: '["ubuntu-latest"]'

  assert-chart-image-bump:
    needs: test-chart-image-bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the atom reported a pin change
        env:
          CHANGED: ${{ needs.test-chart-image-bump.outputs.changed }}
        run: |
          set -euo pipefail
          # `result == success` allein waere zu schwach: das Atom ist auch dann
          # gruen, wenn es nichts zu tun fand. Die Fixture MUSS eine Aenderung
          # ergeben — sonst hat der Bump die falsche Zeile gesucht.
          if [[ "$CHANGED" != "true" ]]; then
            echo "::error::changed='${CHANGED:-<leer>}', erwartet 'true' — der Bump hat nichts gefunden"
            exit 1
          fi
          echo "chart-image-bump meldete changed=true"

  # ----- K-12a: helm-publish OHNE dry_run -----
  #
  # Jeder Aufruf uebergab `dry_run: true` — geprueft war damit `helm lint` und
  # `helm package`, nie das Anmelden an der Registry und der Push. Bei einem
  # Atom, dessen Zweck der Push ist.
  #
  # Der Registry-Pfad traegt die run_id, ist also je Lauf ein EIGENES Paket:
  # zwei gleichzeitige PR-Laeufe koennen sich nicht ins Gehege kommen, und das
  # Aufraeumen loescht das ganze Paket statt einzelner Versionen — GitHub
  # verweigert das Loeschen der letzten getaggten Version (gemessen bei K-8).
  # NACH dem Dry-Run, nicht daneben. helm-publish gruppiert auf
  # `helm-publish-<repo>-<chart_path>-<ref>`, und beide Aufrufer benutzen
  # dieselbe Fixture auf demselben Ref — also dieselbe Gruppe. Der Dry-Run
  # laeuft mit `cancel-in-progress: true` und bricht den scharfen Lauf ab;
  # gemessen am Lauf 33072655784 (`conclusion=cancelled`, 0s).
  #
  # In der Praxis kollidiert das nicht: ein echter Publish laeuft auf einem
  # Tag-Ref, ein Dry-Run auf einem Branch-Ref. Erst dieser Test legt beide auf
  # denselben Ref, deshalb wird hier verkettet und nicht das Atom geaendert.
  test-helm-publish-real:
    needs: test-helm-publish
    uses: ./.github/workflows/helm-publish.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      runs_on: '["ubuntu-latest"]'
      chart_path: tests/fixtures/helm-only
      oci_registry: ghcr.io/serverkraken/selftest-${{ github.run_id }}
      dry_run: false

  assert-helm-publish-real:
    needs: test-helm-publish-real
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Assert the chart really landed in the registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATOM: ${{ needs.test-helm-publish-real.result }}
          PKG: selftest-${{ github.run_id }}/fixture
        run: |
          set -euo pipefail
          if [[ "$ATOM" != "success" ]]; then
            echo "::error::helm-publish failed with dry_run:false (result=${ATOM})"
            exit 1
          fi

          enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PKG")
          body=$(gh api "/orgs/serverkraken/packages/container/${enc}/versions")
          tags=$(jq -r '[.[] | .metadata.container.tags // [] | .[]] | join(",")' <<<"$body")
          echo "published tags: [${tags}]"

          # Die Fixture steht auf 0.1.0. Ein Paket ohne genau diesen Tag hiesse:
          # gepusht wurde etwas anderes als das, was gepackt wurde.
          if [[ "$tags" != *"0.1.0"* ]]; then
            echo "::error::expected the chart version 0.1.0 in the registry, got [${tags}]"
            exit 1
          fi
          echo "helm-publish logged in and pushed — the publish path works."

      - name: Remove the fixture package
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: selftest-${{ github.run_id }}/fixture
        run: |
          enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PKG")
          gh api -X DELETE "/orgs/serverkraken/packages/container/${enc}" >/dev/null 2>&1 \
            && echo "fixture package removed" \
            || echo "fixture package already gone"

  # ----- K-11: der PUSH-Pfad der beiden schreibenden Atome -----
  #
  # `version-badges` und `chart-image-bump` haben beide einen `commit`-Eingang,
  # der auf `true` steht — und JEDER Aufrufer im Katalog uebergab `false`. Die
  # VORGABE war damit der ungetestete Pfad, bei zwei Atomen, deren einzige
  # Wirkung ein Commit ist.
  #
  # Erreichbar war er aus der PR-CI auch gar nicht: beide Atome checkten den
  # Ref des Aufrufers aus, und auf einem `pull_request` ist das ein DETACHED
  # Merge-Commit — `git push` scheitert dort grundsaetzlich. Deshalb haben
  # beide Atome jetzt einen additiven `ref`-Eingang.
  #
  # Der Lauf legt sich seine Opfer selbst an und raeumt sie weg: ein
  # Wegwerf-Branch je Atom und Lauf, danach sind sie fort. Kein Sandbox-Repo,
  # kein fremdes Repo in Gefahr, und `main` wird nie beruehrt.
  prepare-push-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Create one throwaway branch per push atom
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Von github.sha, damit die Branches die Fixtures DIESES PRs tragen.
          for b in "ci/selftest-badges-${RUN_ID}" "ci/selftest-bump-${RUN_ID}"; do
            git push origin "HEAD:refs/heads/${b}"
            echo "angelegt: ${b}"
          done

  # HINTEREINANDER, nicht parallel. `version-badges` und `chart-image-bump`
  # teilen sich seit D-10 die Concurrency-Gruppe `repo-push-<repo>` — sie
  # serialisiert Pushes in dieses Repo. GitHub haelt je Gruppe genau EINEN
  # laufenden und EINEN wartenden Lauf; jeder weitere bricht den wartenden ab.
  #
  # Gemessen am Lauf 33070088661: mit den neuen Aufrufen waren vier Mitglieder
  # in der Gruppe (self-ci laeuft gleichzeitig), und zwei Jobs endeten auf
  # `cancelled` — darunter der BESTEHENDE Dry-Run-Test. Die Kette haelt die
  # Gruppe auf einem Mitglied je Workflow-Lauf.
  test-version-badges-commit:
    needs: [prepare-push-selftest, assert-chart-image-bump]
    if: always() && needs.prepare-push-selftest.result == 'success'
    uses: ./.github/workflows/version-badges.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      runs_on: '["ubuntu-latest"]'
      ref: ci/selftest-badges-${{ github.run_id }}
      manifest_path: tests/fixtures/version-badges/.release-please-manifest.json
      config_path: tests/fixtures/version-badges/release-please-config.json
      readme_path: tests/fixtures/version-badges/README.md
      badges_dir: tests/fixtures/version-badges/badges
      # Der Punkt der Sache.
      commit: true

  assert-version-badges-commit:
    needs: [prepare-push-selftest, test-version-badges-commit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Assert the atom really committed and pushed
        env:
          PREPARE: ${{ needs.prepare-push-selftest.result }}
          ATOM: ${{ needs.test-version-badges-commit.result }}
          BRANCH: ci/selftest-badges-${{ github.run_id }}
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$PREPARE" != "success" ]]; then
            echo "::error::the throwaway branch was never created (result=${PREPARE}) — the test proves nothing"
            exit 1
          fi
          if [[ "$ATOM" != "success" ]]; then
            echo "::error::version-badges failed with commit:true (result=${ATOM})"
            exit 1
          fi

          git fetch origin "$BRANCH"
          head=$(git rev-parse "origin/${BRANCH}")

          # Der Branch MUSS sich bewegt haben. Stuende er noch auf BASE, waere
          # der Commit-Schritt uebersprungen worden — und `result: success`
          # allein haette das nicht verraten.
          if [[ "$head" == "$BASE" ]]; then
            echo "::error::${BRANCH} still points at ${BASE} — the atom pushed nothing"
            exit 1
          fi

          author=$(git log -1 --format='%an' "$head")
          if [[ "$author" != "serverkraken-release-bot[bot]" ]]; then
            echo "::error::commit author is '${author}', expected serverkraken-release-bot[bot]"
            exit 1
          fi

          files=$(git diff --name-only "${BASE}..${head}")
          echo "committed files:"
          while IFS= read -r f; do echo "  $f"; done <<<"$files"
          # Beide Haelften pruefen: die README-Ersetzung UND die erzeugten SVGs.
          # Nur eine davon waere auch dann erfuellt, wenn die andere still
          # ausfaellt.
          echo "$files" | grep -qx 'tests/fixtures/version-badges/README.md' || {
            echo "::error::the README is not in the commit"; exit 1; }
          echo "$files" | grep -q '^tests/fixtures/version-badges/badges/.*\.svg$' || {
            echo "::error::no badge SVG is in the commit"; exit 1; }

          echo "version-badges committed as the bot and pushed — the write path works."

      - name: Remove the throwaway branch
        if: always()
        env:
          BRANCH: ci/selftest-badges-${{ github.run_id }}
        run: |
          git push origin --delete "$BRANCH" >/dev/null 2>&1 \
            && echo "branch removed" || echo "branch already gone"

  test-chart-image-bump-commit:
    needs: [prepare-push-selftest, assert-version-badges-commit]
    if: always() && needs.prepare-push-selftest.result == 'success'
    uses: ./.github/workflows/chart-image-bump.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      runs_on: '["ubuntu-latest"]'
      ref: ci/selftest-bump-${{ github.run_id }}
      values_file: tests/fixtures/chart-image-bump/values.yaml
      key_template: 'images.{name}.tag'
      releases: '{"images/api": {"version": "9.9.9"}}'
      images: >-
        {"images/api": ["serverkraken/reusable-workflows/api"],
         "images/worker": ["serverkraken/reusable-workflows/worker"]}
      commit: true

  assert-chart-image-bump-commit:
    needs: [prepare-push-selftest, test-chart-image-bump-commit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Assert the atom really committed and pushed
        env:
          PREPARE: ${{ needs.prepare-push-selftest.result }}
          ATOM: ${{ needs.test-chart-image-bump-commit.result }}
          BRANCH: ci/selftest-bump-${{ github.run_id }}
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$PREPARE" != "success" ]]; then
            echo "::error::the throwaway branch was never created (result=${PREPARE}) — the test proves nothing"
            exit 1
          fi
          if [[ "$ATOM" != "success" ]]; then
            echo "::error::chart-image-bump failed with commit:true (result=${ATOM})"
            exit 1
          fi

          git fetch origin "$BRANCH"
          head=$(git rev-parse "origin/${BRANCH}")
          if [[ "$head" == "$BASE" ]]; then
            echo "::error::${BRANCH} still points at ${BASE} — the atom pushed nothing"
            exit 1
          fi

          author=$(git log -1 --format='%an' "$head")
          if [[ "$author" != "serverkraken-release-bot[bot]" ]]; then
            echo "::error::commit author is '${author}', expected serverkraken-release-bot[bot]"
            exit 1
          fi

          files=$(git diff --name-only "${BASE}..${head}")
          echo "committed files:"
          while IFS= read -r f; do echo "  $f"; done <<<"$files"
          echo "$files" | grep -qx 'tests/fixtures/chart-image-bump/values.yaml' || {
            echo "::error::the values file is not in the commit"; exit 1; }

          # Und der Pin muss wirklich auf 9.9.9 stehen. Ein Commit, der die
          # Datei anfasst aber den falschen Wert schreibt, waere sonst gruen.
          git show "${head}:tests/fixtures/chart-image-bump/values.yaml" | grep -q '9\.9\.9' || {
            echo "::error::the committed values.yaml does not carry the 9.9.9 pin"; exit 1; }

          echo "chart-image-bump committed the pin as the bot and pushed."

      - name: Remove the throwaway branch
        if: always()
        env:
          BRANCH: ci/selftest-bump-${{ github.run_id }}
        run: |
          git push origin --delete "$BRANCH" >/dev/null 2>&1 \
            && echo "branch removed" || echo "branch already gone"

  test-kube-validate-happy:
    uses: ./.github/workflows/kube-validate.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      manifests_paths: |-
        tests/fixtures/gitops-cluster/kubernetes/apps
        tests/fixtures/gitops-cluster/kubernetes/argo
      sops: false

  # ----- kube-lint happy path: clean fixture + permissive config → 0 -----
  test-kube-lint-happy:
    uses: ./.github/workflows/kube-lint.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      manifests_path: tests/fixtures/gitops-cluster/kubernetes/apps
      config_path: tests/fixtures/gitops-cluster/.kube-linter.yaml
      fail_on_findings: false
      upload_sarif: false

  assert-kube-lint-clean:
    needs: test-kube-lint-happy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count == 0
        env:
          COUNT: ${{ needs.test-kube-lint-happy.outputs.findings_count }}
        run: |
          if [[ "$COUNT" != "0" ]]; then
            echo "::error::Expected 0 kube-linter findings on clean fixture, got $COUNT"
            exit 1
          fi

  # ----- kube-lint find-something: violation fixture + baseline config → >0 -----
  test-kube-lint-findings:
    uses: ./.github/workflows/kube-lint.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      manifests_path: tests/fixtures/gitops-lint-violation/kubernetes/apps
      fail_on_findings: false
      upload_sarif: false

  assert-kube-lint-finds:
    needs: test-kube-lint-findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count > 0
        env:
          COUNT: ${{ needs.test-kube-lint-findings.outputs.findings_count }}
        run: |
          if [[ "$COUNT" == "0" ]]; then
            echo "::error::Expected kube-linter findings on violation fixture, got 0"
            exit 1
          fi
          echo "kube-lint correctly detected $COUNT finding(s)"

  # ----- secret-scan im GIT-Modus (Audit K-9) -----
  #
  # Jeder bisherige Aufruf uebergibt `no_git: true` — also den Modus, den der
  # Atom-Kopf ausdruecklich als "used for fixture tests and ad-hoc scans"
  # bezeichnet. Der VORGABE-Modus, den Adopter bekommen, lief nie:
  #
  #     no_git:false + pull_request  ->  --log-opts="--no-merges BASE..HEAD"
  #     no_git:false + push          ->  --log-opts="--no-merges -1 HEAD"
  #     no_git:false + sonst         ->  volle Historie
  #
  # Drei Zweige, keiner je ausgefuehrt. Bricht die Bereichsberechnung, scannt
  # gitleaks einen leeren Bereich, meldet 0 Funde und der Job ist gruen — also
  # "keine Secrets", obwohl nichts angesehen wurde.
  #
  # Was dieser Job beweist: der Bereich ist AUFLOESBAR. Ein kaputter
  # `--log-opts`-Bereich laesst git innerhalb von gitleaks scheitern, und
  # `--exit-code 0` unterdrueckt nur den Fund-Exitcode, nicht den Fehler. Ein
  # gruener Lauf heisst also: BASE..HEAD wurde wirklich aufgeloest.
  #
  # Was er NICHT beweist: dass ein im PR eingefuegtes Secret gefunden wuerde.
  # Dafuer muesste der Katalog-PR selbst ein Secret tragen. Der push- und der
  # Vollhistorie-Zweig bleiben ebenfalls offen — ein Vollhistorie-Scan wuerde
  # heute an den absichtlich gepflanzten Fixtures haengenbleiben, solange der
  # Katalog keine eigene .gitleaks.toml hat.
  #
  # `fail_on_findings: false`: beruehrt ein PR eine der Secret-Fixturen, sind
  # Funde erwartbar und duerfen den Lauf nicht rot machen.
  test-secret-scan-git-mode:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
    with:
      runs_on: '["ubuntu-latest"]'
      report_slug: gitmode
      no_git: false
      fail_on_findings: false
      upload_sarif: false

  assert-secret-scan-git-mode:
    needs: test-secret-scan-git-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the git-mode scan resolved its range
        env:
          COUNT: ${{ needs.test-secret-scan-git-mode.outputs.findings_count }}
        run: |
          set -euo pipefail
          # Leer heisst: der Zaehlschritt lief nicht oder gitleaks lieferte
          # keinen Report. Der Atom-Kommentar haelt ausdruecklich fest, dass
          # eine leere Ausgabe zu "0" gemuenzt wird — kommt hier trotzdem
          # nichts an, ist die Verdrahtung kaputt.
          if [[ -z "${COUNT}" ]]; then
            echo "::error::findings_count is empty — the git-mode scan produced no count at all"
            exit 1
          fi
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::findings_count is not a number: '${COUNT}'"
            exit 1
          fi
          echo "git-mode scan resolved its commit range and reported ${COUNT} finding(s)."

  # ----- secret-scan happy path: clean fixture, no-git mode → 0 -----
  test-secret-scan-happy:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      no_git: true
      scan_path: tests/fixtures/gitops-cluster
      fail_on_findings: false
      upload_sarif: false

  assert-secret-scan-clean:
    needs: test-secret-scan-happy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count == 0
        env:
          COUNT: ${{ needs.test-secret-scan-happy.outputs.findings_count }}
        run: |
          if [[ "$COUNT" != "0" ]]; then
            echo "::error::Expected 0 secrets on clean fixture, got $COUNT"
            exit 1
          fi

  # ----- secret-scan find-something: planted secret, no-git mode → >0 -----
  test-secret-scan-findings:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      no_git: true
      scan_path: tests/fixtures/gitops-planted-secret
      fail_on_findings: false
      upload_sarif: false

  assert-secret-scan-finds:
    needs: test-secret-scan-findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify findings_count is a number and greater than zero
        env:
          COUNT: ${{ needs.test-secret-scan-findings.outputs.findings_count }}
        run: |
          set -euo pipefail

          # Audit K-17: die Pruefung war `[[ "$COUNT" == "0" ]]` — und genau
          # deshalb bestand sie auch bei einer LEEREN Ausgabe. Ist das
          # Output-Wiring kaputt, ist "" nicht gleich "0", und der Test war
          # gruen, obwohl der Scan gar nichts gemeldet hat. Der haeufigste
          # Weg, wie ein Atom-Output verlorengeht, war damit unsichtbar.
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::findings_count ist keine Zahl, sondern '${COUNT:-<leer>}' — die Ausgabe des Atoms kommt nicht durch" >&2
            exit 1
          fi

          # Keine exakte Zahl: die haengt am Regelsatz von gitleaks und wuerde
          # bei jedem Versionssprung brechen, ohne dass etwas kaputt waere.
          # Die Fixture traegt ein AWS-Schluesselpaar, also mindestens einen Fund.
          if [[ "$COUNT" -lt 1 ]]; then
            echo "::error::Expected secret findings on planted-secret fixture, got $COUNT" >&2
            exit 1
          fi
          echo "secret-scan correctly detected $COUNT secret(s)"

  # ----- semantic-release dry-run: exercise the atom against the catalog's
  #       own release-please configs WITHOUT mutating remote state.
  #       skip-github-release + skip-github-pull-request flags on the
  #       release-please-action prevent PR/release/tag mutations. The
  #       atom-level !dry_run guard on the "Move floating major/minor tags"
  #       step prevents the git push --force --tags. So this job exercises
  #       app-token mint, checkout, release-please logic, and output wiring
  #       without any production side-effects.
  test-semantic-release-dry-run:
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      dry_run: true

  assert-semantic-release-outputs:
    needs: test-semantic-release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: paths_released / releases are well-formed JSON and agree
        env:
          PATHS: ${{ needs.test-semantic-release-dry-run.outputs.paths_released }}
          RELEASES: ${{ needs.test-semantic-release-dry-run.outputs.releases }}
          CREATED: ${{ needs.test-semantic-release-dry-run.outputs.release_created }}
          TAG: ${{ needs.test-semantic-release-dry-run.outputs.tag_name }}
        run: |
          set -euo pipefail

          # Audit K-3: die Form allein sagt nichts.
          #
          # Vorher wurden nur `type == "array"` und `type == "object"` geprueft
          # plus ein diff der beiden Schluesselmengen. Ein Lauf mit `[]` und
          # `{}` besteht alle drei: leer gegen leer ist gleich. Damit war ein
          # Trockenlauf, der GAR NICHTS erzeugt hat, gruen — und genau das ist
          # der Fall, den ein kaputtes Output-Wiring produziert.
          #
          # "Nicht leer" zu verlangen waere falsch: der Trockenlauf laeuft gegen
          # den Katalog selbst, und "seit dem letzten Tag liegt nichts
          # Releasebares an" ist ein voellig gueltiger Zustand. Geprueft wird
          # deshalb die INVARIANTE zwischen dem Boolean und den Listen — die
          # gilt in beiden Zustaenden und ist in beiden verletzbar.
          jq -e 'type == "array"' <<< "$PATHS" > /dev/null
          jq -e 'type == "object"' <<< "$RELEASES" > /dev/null
          # every released path has a map entry and vice versa
          diff <(jq -r '.[]' <<< "$PATHS" | sort) <(jq -r 'keys[]' <<< "$RELEASES" | sort)

          n_paths=$(jq -r 'length' <<< "$PATHS")
          n_rel=$(jq -r 'length' <<< "$RELEASES")
          echo "release_created=$CREATED paths=$n_paths releases=$n_rel tag=${TAG:-<leer>}"

          case "$CREATED" in
            true)
              # Ein Release wurde gemeldet: dann MUSS auch etwas darin stehen.
              if [[ "$n_paths" -eq 0 || "$n_rel" -eq 0 ]]; then
                echo "::error::release_created=true, aber paths_released=$n_paths und releases=$n_rel — das Output-Wiring liefert leere Listen" >&2
                exit 1
              fi
              if [[ -z "$TAG" ]]; then
                echo "::error::release_created=true, aber tag_name ist leer" >&2
                exit 1
              fi
              ;;
            false|"")
              # Kein Release: dann darf auch nichts darin stehen.
              #
              # LEER ist hier gueltig und nicht etwa ein Ausfall: dieser Test
              # ruft mit `dry_run: true` auf, und dann bekommt release-please
              # `skip-github-release`/`skip-github-pull-request` gesetzt, tut
              # nichts und emittiert folglich gar keine Ausgabe.
              #
              # Die erste Fassung dieser Pruefung hat genau deshalb hier
              # abgebrochen ("die Ausgabe kommt nicht durch") — sie war zu
              # streng, weil sie den Trockenlauf nicht kannte. Der Fehlschlag
              # war aber lehrreich: `release_created` ist mal 'true', mal
              # 'false', mal leer. Ein Aufrufer, der auf == 'false' prueft,
              # liegt im Trockenlauf falsch. Der Vertrag waere staerker, wenn
              # das Atom in diesem Fall ausdruecklich 'false' emittierte —
              # notiert als eigener Punkt, nicht hier nebenbei geaendert.
              if [[ "$n_paths" -ne 0 || "$n_rel" -ne 0 ]]; then
                echo "::error::release_created='${CREATED:-<leer>}' meldet kein Release, aber paths_released=$n_paths und releases=$n_rel — die Ausgaben widersprechen sich" >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::release_created ist weder 'true' noch 'false' noch leer, sondern '$CREATED' — die Ausgabe ist unbrauchbar" >&2
              exit 1
              ;;
          esac

  # ----- Audit K-7: der Aufruf oben prueft sonst nur, DASS der Workflow nicht
  #       scheitert. Die geparste Matrix ist seine eigentliche Entscheidung —
  #       was aus `images` wurde und wie viele Builds daraus entstanden.
  assert-docker-build-multi-matrix:
    needs: test-docker-build-multi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Matrix spiegelt die uebergebenen Images
        env:
          MATRIX: ${{ needs.test-docker-build-multi.outputs.matrix }}
        run: |
          set -euo pipefail

          if [[ -z "${MATRIX:-}" ]]; then
            echo "::error::matrix-Ausgabe ist leer — das Output-Wiring kommt nicht durch" >&2
            exit 1
          fi
          jq -e 'type == "object" and (.include | type == "array")' <<< "$MATRIX" > /dev/null

          n=$(jq -r '.include | length' <<< "$MATRIX")
          if [[ "$n" -ne 2 ]]; then
            echo "::error::erwartet wurden 2 Matrix-Eintraege (api + worker), gemeldet sind $n" >&2
            jq -c . <<< "$MATRIX" >&2
            exit 1
          fi

          # Jeder Eintrag muss beide Felder tragen — ein halb gefuellter Eintrag
          # laesst den Build-Job mit leerem image_name laufen.
          jq -e '[.include[] | select((.dockerfile // "") == "" or (.image_name // "") == "")] | length == 0' \
            <<< "$MATRIX" > /dev/null \
            || { echo "::error::ein Matrix-Eintrag hat ein leeres dockerfile oder image_name" >&2; exit 1; }

          # Und zwar genau die, die oben uebergeben wurden — nicht irgendwelche.
          # `-` als zweites Argument: das Heredoc geht auf stdin, und ohne das
          # bekaeme diff nur EINE Datei und braeche mit einem Benutzungsfehler
          # ab — was wie ein bestandener Vergleich aussieht, wenn niemand den
          # Rueckgabewert liest.
          diff <(jq -r '.include[].image_name' <<< "$MATRIX" | sort) - <<'EOF'
          serverkraken/reusable-workflows/test-multi-api
          serverkraken/reusable-workflows/test-multi-worker
          EOF
          echo "matrix: $n Eintraege, beide Felder gesetzt, Namen wie uebergeben"

  # ----- Audit K-16: `release.yml` ist der Einstiegspunkt, den Adopter
  #       referenzieren (`uses: …/workflows/release.yml@v4`) — und wurde von
  #       der self-CI NIE aufgerufen. Genau hier hat schon einmal ein fehlender
  #       `permissions`-Block alle Cross-Repo-Aufrufe gebrochen; getestet war
  #       das nirgends.
  #
  #       Der Trockenlauf beruehrt nichts: release-please bekommt
  #       `skip-github-release`, setzt keine Ausgabe, und weil docker-build und
  #       trivy-image an `release_created == 'true'` haengen, entfallen sie von
  #       selbst. Geprueft wird damit das WIRING — Permissions-Union,
  #       Eingabe-Weitergabe, Gestalt der verschachtelten Aufrufe.
  test-release-orchestrator-dry-run:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      dry_run: true
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on_release: '["ubuntu-latest"]'
      build_image: false
      run_trivy: false

  assert-release-orchestrator-skips-build:
    needs: test-release-orchestrator-dry-run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Der Trockenlauf darf nichts gebaut haben
        env:
          RESULT: ${{ needs.test-release-orchestrator-dry-run.result }}
        run: |
          set -euo pipefail
          # Der Aufruf selbst muss durchlaufen — daran haengt die ganze
          # Wiring-Aussage. Ein Fehlschlag hier bedeutet: der oeffentliche
          # Orchestrator ist fuer Adopter kaputt.
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::release.yml (Trockenlauf) endete mit '$RESULT' — der Orchestrator, den Adopter referenzieren, laeuft nicht durch" >&2
            exit 1
          fi
          echo "release.yml lief im Trockenlauf durch — Wiring intakt."

  # ----- onboard dry-run: exercise detect + render against the catalog itself -----
  test-onboard-dry-run:
    uses: ./.github/workflows/onboard.yml
    with:
      target_repos: serverkraken/reusable-workflows
      language: auto
      dry_run: true
      pin_version: v1
      use_go_cli: false
    secrets: inherit

  # ----- onboard dry-run (Go path): same as above, but forces the onboard
  #       actions through sk-workflows. -----
  test-onboard-dry-run-go:
    uses: ./.github/workflows/onboard.yml
    with:
      target_repos: serverkraken/reusable-workflows
      language: auto
      dry_run: true
      pin_version: v1
      use_go_cli: true
    secrets: inherit

  # ----- Audit K-14: die beiden Trockenlaeufe oben fahren denselben
  #       Onboarding-Pfad gegen dasselbe Repo — einmal ueber die Bash-Engine,
  #       einmal ueber die Go-CLI — und NICHTS verglich ihre Ergebnisse. Beide
  #       mussten nur gruen sein. Haetten sie unterschiedlich gerendert, waere
  #       das unbemerkt geblieben, obwohl `use_go_cli` im Betrieb darueber
  #       entscheidet, welches Ergebnis ein Adopter bekommt.
  #
  #       Das Paritaets-Gate (check-engine-parity.sh) vergleicht Detect und
  #       Render ueber 28 Fixtures — aber ohne Composite-Actions, ohne echte
  #       GitHub-Metadaten und ohne diesen Schalter. Genau die Schicht fehlte.
  #
  #       Verglichen werden die GERENDERTEN Dateien, die beide Laeufe als
  #       Trockenlauf-Diagnose hochladen; `rendered_at` ist dabei schon
  #       entfernt, weil ein Zeitstempel zwischen zwei Laeufen zwangslaeufig
  #       abweicht. -----
  assert-onboard-engines-agree:
    needs: [test-onboard-dry-run, test-onboard-dry-run-go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Bash-rendered output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: onboard-rendered-serverkraken-reusable-workflows-bash
          path: rendered-bash
      - name: Download Go-rendered output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: onboard-rendered-serverkraken-reusable-workflows-go
          path: rendered-go
      - name: Both engines must render byte-identical output
        run: |
          set -euo pipefail
          # Gegen den LOCK zaehlen, nicht nur gegen null.
          #
          # Die erste Fassung prueft nur `n > 0`. Das reichte NICHT: der Upload
          # schloss versteckte Dateien aus, es kamen 2 von 7 an, und der
          # Vergleich meldete zufrieden "identisch" — ueber zwei Dateien, die
          # zufaellig nicht mit einem Punkt beginnen. Ein Vergleich, der zwei
          # Siebtel prueft und Erfolg meldet, ist genau die Sorte gruen, die
          # dieser Audit ueberall gefunden hat.
          #
          # Der Lock nennt die erwartete Menge selbst. Damit kann die
          # Abdeckung nicht mehr still schrumpfen: faellt kuenftig wieder
          # etwas aus dem Artefakt, faellt der Job.
          expected=$(( $(jq '.files | length' rendered-bash/onboard.lock.json) + 1 ))
          n_bash=$(find rendered-bash -type f | wc -l)
          n_go=$(find rendered-go -type f | wc -l)
          echo "expected ${expected} file(s) per side (lock + $((expected - 1)) rendered)"
          echo "bash: ${n_bash} file(s), go: ${n_go} file(s)"
          for side in bash go; do
            n=$([[ "$side" == bash ]] && echo "$n_bash" || echo "$n_go")
            if (( n != expected )); then
              echo "::error::${side} side carries ${n} file(s), expected ${expected} — the artifact lost files, and comparing what is left proves nothing"
              find "rendered-${side}" -type f | sed "s|^|  ${side}: |"
              exit 1
            fi
          done

          if ! diff -ru rendered-bash rendered-go; then
            echo "::error::the Bash and Go onboarding engines rendered DIFFERENT output for the same repo"
            echo "::error::use_go_cli then decides what an adopter gets, and the diff shows nothing of it"
            exit 1
          fi
          echo "Both engines rendered identical output (${n_bash} files)."

  # ----- release-flutter-android: happy. Exercises the create_release=true
  #       (manual/ad-hoc) path: the atom itself creates the throwaway prerelease
  #       at the fixture tag, builds+signs the fixture APK, attaches it, then
  #       cleanup deletes the release+tag. An explicit fixture version is passed
  #       (not auto-derive) so CI never touches the catalog's real vX tag
  #       namespace — the auto-derive path is exercised by real adopters. -----
  test-release-flutter-android:
    uses: ./.github/workflows/release-flutter-android.yml
    secrets: inherit
    with:
      # GitHub-hosted: PR-Pfad, siehe nightly-runner-parity.yml
      runs_on: '["ubuntu-latest"]'
      working_directory: tests/fixtures/flutter-app
      version: v0.0.1-fixture-${{ github.run_id }}
      create_release: true
      use_build_runner: false
      # APK UND AAB (Audit K-10). `build_aab` stand ueberall auf false, der
      # Bundle-Pfad lief also nie — obwohl er derjenige ist, den der Play
      # Store verlangt. Signierung ist ohnehin schon eingerichtet: der
      # APK-Release-Build nutzt dieselben Keystore-Secrets.
      build_apk: true
      build_aab: true
      prerelease: true
      dart_define_secret_names: "GREETING"
      artefact_name_prefix: catalog-test-flutter-app

  # Audit K-10. `build_aab: false` in jedem Aufruf hiess: der Bundle-Pfad lief
  # nie. Ein `result == success` allein waere hier zu schwach — der Schritt ist
  # `if: inputs.build_aab`, also waere er bei einem Fehler in der Bedingung
  # einfach uebersprungen und der Job trotzdem gruen. Geprueft wird deshalb,
  # was am Release HAENGT.
  assert-flutter-release-has-apk-and-aab:
    needs: test-release-flutter-android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert both artefacts are attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.1-fixture-${{ github.run_id }}
          PREFIX: catalog-test-flutter-app
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | sort | join(" ")')
          echo "assets: ${names}"
          for ext in apk aab; do
            if [[ "$names" != *"${PREFIX}-${TAG}.${ext}"* ]]; then
              echo "::error::release ${TAG} carries no ${ext} — expected ${PREFIX}-${TAG}.${ext}, got [${names}]"
              exit 1
            fi
          done
          echo "APK and AAB both attached."

  # summary-exempt: Aufraeumjob, kein Test. Er loescht das Fixture-Release
  # und schluckt den Fehler per '|| true', kann also gar nicht rot werden;
  # ihn in needs: zu haengen wuerde dem Required Check eine Zusicherung
  # andichten, die er nicht gibt.
  cleanup-flutter-release:
    # Auch auf die Assertion warten (Audit K-10): sonst kann der Cleanup das
    # Release loeschen, BEVOR assert-flutter-release-has-apk-and-aab seine
    # Assets liest — und die Zusicherung waere ein Rennen.
    needs: [test-release-flutter-android, assert-flutter-release-has-apk-and-aab]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete fixture release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.1-fixture-${{ github.run_id }}
        run: gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true

  # ----- e2e-kind moved to nightly-runner-parity.yml -----
  # It creates a kind cluster in the runner pod's dind sidecar, so it only
  # proves anything on the self-hosted ARC topology — GitHub-hosted runners
  # have a different container setup entirely. That makes it a genuine
  # self-hosted anchor, but the amd64 pool is permanently short, so keeping
  # it on the PR path would leave every pull request waiting on it. It runs
  # unchanged once a night instead. -----

  # ----- Summary: aggregates ALL happy-path children into a single status.
  #       Branch-protection will require ONLY this check. Atom-failure-path
  #       tests (cleanup-images-fail, docker-build-multi-fail, goreleaser-fail,
  #       helm-publish-fail) moved to failure-paths-nightly.yml (Phase 9.5).
  #
  #       The find-something tests (test-trivy-fs-failure, test-docker-build-cve,
  #       test-trivy-image-cve) stay here — they exit 0 with fail_on_findings:false
  #       and the assert-* siblings check the count, not the job result. -----
  summary:
    name: "integration / summary"
    needs:
      - test-docker-build
      - assert-attestation-verifies
      - assert-docker-build-single-platform
      - assert-flutter-release-has-apk-and-aab
      - assert-onboard-engines-agree
      - assert-secret-scan-git-mode
      - assert-version-badges-commit
      - assert-chart-image-bump-commit
      - assert-helm-publish-real
      - test-trivy-image-happy
      - assert-trivy-image-clean
      - test-trivy-fs-happy
      - test-trivy-fs-failure
      - assert-trivy-fs-finds-secrets
      - test-docker-build-cve
      - test-trivy-image-cve
      - assert-trivy-image-cve-finds-vulns
      - test-cleanup-images
      - test-cleanup-images-missing-package
      - test-semantic-release-dry-run
      - assert-semantic-release-outputs
      - test-onboard-dry-run
      - test-onboard-dry-run-go
      - test-docker-build-multi
      - assert-docker-build-multi-matrix
      - test-release-orchestrator-dry-run
      - assert-release-orchestrator-skips-build
      - test-goreleaser
      - test-helm-publish
      - test-release-flutter-android
      - test-chart-image-bump
      - assert-chart-image-bump
      - test-kube-validate-happy
      - test-kube-lint-happy
      - assert-kube-lint-clean
      - test-kube-lint-findings
      - assert-kube-lint-finds
      - test-secret-scan-happy
      - assert-secret-scan-clean
      - test-secret-scan-findings
      - assert-secret-scan-finds
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate child statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | .[].key
          ')
          if [[ -n "$failed" ]]; then
            echo "::error::Failing summary children:"
            while IFS= read -r line; do
              echo "  - $line"
            done <<< "$failed"
            exit 1
          fi
          echo "All required children passed (count=$(echo "$NEEDS_JSON" | jq 'keys | length'))."
