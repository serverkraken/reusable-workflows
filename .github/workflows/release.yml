# .github/workflows/release.yml
# Opinionated end-to-end release pipeline. Most consumers should call this
# rather than wiring the atoms directly.
name: release
on:
  workflow_call:
    inputs:
      dry_run:
        description: >-
          Trockenlauf: reicht `dry_run` an semantic-release durch, das dann
          `skip-github-release`/`skip-github-pull-request` setzt. Weil die
          nachgelagerten Jobs an `release_created == 'true'` haengen und
          release-please im Trockenlauf gar keine Ausgabe setzt, entfallen
          Build und Scan von selbst — es entsteht kein Tag, kein Image, kein
          Release.

          Existiert, damit dieser Orchestrator ueberhaupt testbar ist (Audit
          K-16): er ist der Einstiegspunkt, den Adopter referenzieren, und
          wurde von der self-CI nie aufgerufen — obwohl genau hier schon
          einmal ein fehlender `permissions`-Block Cross-Repo-Aufrufe brach.
        required: false
        type: boolean
        default: false
      runs_on_release:
        description: >-
          Runner-Labels fuer den semantic-release-Schritt, als JSON-Array.
          Wird durchgereicht; ohne diesen Eingang laesst sich der Orchestrator
          nicht auf GitHub-gehosteten Runnern pruefen.
        required: false
        type: string
        default: '["self-hosted","Linux","low-performance"]'
      build_image:
        required: false
        type: boolean
        default: true
      run_trivy:
        required: false
        type: boolean
        default: true
      dockerfile:
        required: false
        type: string
        default: './Dockerfile'
      context:
        required: false
        type: string
        default: '.'
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      sign:
        description: 'Cosign-sign the manifest list. Pass false on runners without gettext-base / cosign prereqs.'
        required: false
        type: boolean
        default: true
      attest:
        description: 'Generate SLSA v0.2 build provenance attestation for the image. Uses cosign keyless signing (free-tier compatible). Verify with `cosign verify-attestation --type slsaprovenance`.'
        required: false
        type: boolean
        default: true
      sbom:
        description: 'Generate and upload an SPDX SBOM artifact for the image.'
        required: false
        type: boolean
        default: true
      trivy_severity:
        required: false
        type: string
        default: 'HIGH,CRITICAL'
      trivy_fail_on_findings:
        description: |
          Whether trivy findings at or above `trivy_severity` should fail the
          release. Default true. Set false for images that by-design carry
          inherited CVEs you can't patch (e.g. runner images with a baked
          Docker daemon / buildkit / kubelet libs). SARIF still uploads to
          Code Scanning when false — only the gating behaviour changes.
        required: false
        type: boolean
        default: true
      image_name:
        description: 'Image name. Default: caller repo (owner/repo). Passed through to docker-build.yml.'
        required: false
        type: string
        default: ''
      runs_on_amd64:
        required: false
        type: string
        default: '["self-hosted","Linux","X64","performance"]'
      runs_on_arm64:
        required: false
        type: string
        default: '["self-hosted","Linux","ARM64"]'
      runs_on_merge:
        required: false
        type: string
        default: '["self-hosted","Linux","low-performance"]'
    secrets:
      release_please_app_client_id:
        required: true
      release_please_app_private_key:
        required: true

permissions:
  # UNION of nested calls: semantic-release (contents/pull-requests/issues:write),
  # docker-build (packages/id-token:write + pull-requests:write),
  # trivy-image (security-events:write, packages:read, actions:read).
  # Required so cross-repo callers (`uses: …/release.yml@v4`) don't hit the
  # strict-intersection permission-ceiling on the nested workflow_call jobs.
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  issues: write
  security-events: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    uses: ./.github/workflows/semantic-release.yml
    secrets: inherit
    with:
      dry_run: ${{ inputs.dry_run }}
      runs_on: ${{ inputs.runs_on_release }}

  # Dieser Orchestrator ist per Bauart EIN Paket: er nimmt genau einen
  # image_name, ein dockerfile, einen context. Ein Monorepo kann er gar nicht
  # bedienen (Audit F-6).
  #
  # Das Problem war nicht, dass er es nicht kann — sondern dass er dabei
  # SCHWIEG. release-please setzt die unpraefixierten Ausgaben
  # (release_created, tag_name) nur fuer das Wurzelpaket "."; jedes andere
  # bekommt `<pfad>--release_created`. Das steht im semantic-release-Atom
  # nicht nur als Kommentar, sondern im jq: `pick` faellt ausschliesslich bei
  # `$p == "."` auf die nackten Namen zurueck.
  #
  # Ein Monorepo-Aufrufer bekam damit: Tags und GitHub-Releases entstehen,
  # docker-build und trivy-image haengen an `release_created == 'true'` und
  # entfallen kommentarlos. Gebaut und gescannt wird nichts, und der Lauf ist
  # gruen.
  #
  # Derselbe Widerspruch wie J-6, nur eine Ebene hoeher: dort stand im
  # gerenderten Adopter-Workflow der falsche Diskriminator, hier fehlt die
  # Feststellung, dass dieser Weg fuer Monorepos nicht gedacht ist.
  #
  # Nicht im Trockenlauf: dort setzt release-please planmaessig gar nichts,
  # paths_released ist "[]", und dass Build und Scan entfallen, ist genau der
  # Zweck (Audit K-16).
  assert-single-package:
    needs: semantic-release
    if: always() && inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject a monorepo release on the single-package orchestrator
        env:
          PATHS: ${{ needs.semantic-release.outputs.paths_released }}
          CREATED: ${{ needs.semantic-release.outputs.release_created }}
        run: |
          set -euo pipefail
          # "[]" heisst: release-please hat nichts released. Das ist ein
          # regulaerer Lauf ohne Release, kein Fehler.
          paths="${PATHS:-[]}"
          nonroot="$(jq -r '[.[] | select(. != ".")] | join(", ")' <<<"$paths")"
          if [[ -z "$nonroot" ]]; then
            exit 0
          fi
          echo "::error::release.yml is a SINGLE-PACKAGE pipeline (one image_name/dockerfile/context), but release-please released non-root packages: ${nonroot}"
          echo "::error::their outputs are named '<path>--release_created', so docker-build and trivy-image would be skipped silently — tags published, nothing built"
          echo "::error::use the rendered per-component release.yml from the catalog templates, or wire the atoms directly against paths_released/releases"
          exit 1

  docker-build:
    needs: semantic-release
    if: needs.semantic-release.outputs.release_created == 'true' && inputs.build_image
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      tag: ${{ needs.semantic-release.outputs.tag_name }}
      prerelease: false
      image_name: ${{ inputs.image_name }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      platforms: ${{ inputs.platforms }}
      sign: ${{ inputs.sign }}
      attest: ${{ inputs.attest }}
      sbom: ${{ inputs.sbom }}
      runs_on_amd64: ${{ inputs.runs_on_amd64 }}
      runs_on_arm64: ${{ inputs.runs_on_arm64 }}
      runs_on_merge: ${{ inputs.runs_on_merge }}
      # Build from the released tag, not the triggering event's SHA: with
      # back-to-back merges the event SHA predates release-please's bump
      # commit (semantic-release resolves the merged release PR via the API).
      ref: ${{ needs.semantic-release.outputs.tag_name }}

  trivy-image:
    needs: [semantic-release, docker-build]
    if: needs.semantic-release.outputs.release_created == 'true' && inputs.build_image && inputs.run_trivy
    uses: ./.github/workflows/trivy-image.yml
    secrets: inherit
    with:
      image_ref: ${{ needs.docker-build.outputs.image_ref }}
      # Dieselbe Liste scannen, die gebaut wurde (Audit F-2). Trivy waehlt fuer
      # eine Multi-Arch-Referenz EINE Plattform, per Vorgabe linux/amd64 - ohne
      # diese Zeile ging jede weitere veroeffentlichte Architektur ungeprueft
      # raus. `platforms` steht hier auf linux/amd64,linux/arm64 als Default,
      # der Regelfall ist also multi-arch.
      #
      # Das Atom kann das laengst und sagt es im Kommentar ("Callers that
      # publish multi-arch pass the same list they built"); die drei
      # Adopter-Templates reichen es auch weiter. Nur dieser Orchestrator, der
      # als `release.yml` im Vertrag steht, tat es nicht.
      platforms: ${{ inputs.platforms }}
      severity: ${{ inputs.trivy_severity }}
      fail_on_findings: ${{ inputs.trivy_fail_on_findings }}
