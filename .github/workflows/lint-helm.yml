# .github/workflows/lint-helm.yml
# Reusable workflow: lint Helm chart(s) with `helm lint` + `ct lint`.
# Summary convention: docs/conventions/step-summary.md
name: lint-helm
on:
  workflow_call:
    inputs:
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux"]'
      working_directory:
        description: 'Repo root for ct (charts_dir is relative to this).'
        required: false
        type: string
        default: '.'
      charts_dir:
        description: 'Directory containing one or more charts (relative to working_directory).'
        required: false
        type: string
        default: 'charts'
      # renovate: datasource=github-releases depName=helm/helm
      helm_version:
        description: 'Helm CLI version.'
        required: false
        type: string
        default: 'v3.16.3'
      # renovate: datasource=github-releases depName=helm/chart-testing
      ct_version:
        description: 'chart-testing (ct) version.'
        required: false
        type: string
        default: 'v3.11.0'
      unittest:
        description: 'Run helm-unittest (tests/*_test.yaml inside each chart) after linting.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lint-helm-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working_directory }}-${{ inputs.charts_dir }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        # Fest auf den Workspace: der Waechter laeuft VOR dem Checkout, und ein
        # Job-Ebene `defaults.run.working-directory` (goreleaser.yml) zeigt auf
        # ein Verzeichnis, das es dann noch nicht gibt. Ohne diese Zeile
        # scheitert der Schritt mit "No such file or directory", statt den Wert
        # zu pruefen — gemessen an Lauf 33062297620.
        working-directory: ${{ github.workspace }}
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0   # ct needs git history for --target-branch diff

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: ${{ inputs.helm_version }}

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: ${{ inputs.ct_version }}

      - name: helm lint (all charts)
        id: helm_lint
        working-directory: ${{ inputs.working_directory }}
        env:
          CHARTS_DIR: ${{ inputs.charts_dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # If charts_dir is itself a chart, lint it directly; else lint each subdir that has Chart.yaml.
          if [[ -f "$CHARTS_DIR/Chart.yaml" ]]; then
            helm lint "$CHARTS_DIR"
          else
            found=0
            for d in "$CHARTS_DIR"/*/; do
              if [[ -f "${d%/}/Chart.yaml" ]]; then
                helm lint "${d%/}"
                found=1
              fi
            done
            if (( found == 0 )); then
              echo "::error::no chart found in $CHARTS_DIR (no Chart.yaml in $CHARTS_DIR or its immediate subdirs)"
              exit 1
            fi
          fi

      - name: ct lint
        id: ct_lint
        working-directory: ${{ inputs.working_directory }}
        env:
          CHARTS_DIR: ${{ inputs.charts_dir }}
          TARGET_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          # If charts_dir is itself a chart, lint just that chart; else let ct
          # discover every chart under charts_dir. Mirrors the helm-lint /
          # helm-unittest branch above — a chart-shaped charts_dir must never
          # be treated as "a directory containing charts" (that would make ct
          # sweep in sibling charts under the same parent directory).
          if [[ -f "$CHARTS_DIR/Chart.yaml" ]]; then
            ct lint --charts "$CHARTS_DIR" --validate-maintainers=false \
              --target-branch="$TARGET_BRANCH"
          else
            ct lint --all --validate-maintainers=false \
              --chart-dirs="$CHARTS_DIR" \
              --target-branch="$TARGET_BRANCH"
          fi

      # Third-party plugin on a long-lived runner: pinned release into a
      # job-private plugin dir, so neither a plugin left behind by an earlier
      # job nor the upstream default branch decides what runs. <1.1.0 is
      # enforced by a Renovate packageRule: 1.1.0 switched plugin.yaml to
      # `platformHooks`, which Helm v3's plugin loader rejects outright.
      - name: Install helm-unittest
        id: helm_unittest_install
        if: inputs.unittest && success()
        env:
          HELM_PLUGINS: ${{ runner.temp }}/helm-plugins
          # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
          HELM_UNITTEST_VERSION: v1.0.3
        run: |
          set -euo pipefail
          rm -rf "$HELM_PLUGINS" && mkdir -p "$HELM_PLUGINS"
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "${HELM_UNITTEST_VERSION#v}"

      - name: helm unittest
        if: inputs.unittest && success()
        id: helm_unittest
        working-directory: ${{ inputs.working_directory }}
        env:
          HELM_PLUGINS: ${{ runner.temp }}/helm-plugins
          CHARTS_DIR: ${{ inputs.charts_dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # `unittest: true` ist ein OPT-IN: der Adopter erklaert damit, dass
          # sein Chart Helm-Tests hat. Ein Chart ohne Testdateien lief bisher
          # trotzdem gruen durch (Audit G-4). Gemessen mit helm-unittest 1.1.2
          # an einem Chart mit Chart.yaml und templates/, aber ohne tests/:
          #
          #   Test Suites: 0 passed, 0 total
          #   Tests:       0 passed, 0 total
          #   rc=0
          #
          # Der Job war gruen, geprueft wurde nichts, und der Adopter hatte
          # erklaert, dass hier etwas zu pruefen ist. Dieselbe Klasse wie A-3,
          # A-4, B-4 und J-8: hier deklariert, dort passiert nichts.
          #
          # Geprueft wird die AUSGABE und nicht das Vorhandensein von
          # tests/*_test.yaml: das Suchmuster von helm-unittest ist
          # konfigurierbar, die Zusammenfassungszeile dagegen sagt, was
          # tatsaechlich gelaufen ist.
          run_unittest() {
            local chart="$1" out rc=0
            out="$(helm unittest "$chart" 2>&1)" || rc=$?
            printf '%s\n' "$out"
            (( rc == 0 )) || return "$rc"
            if grep -qE '^Test Suites:[[:space:]]+0 passed, 0 total' <<<"$out"; then
              echo "::error::unittest is enabled but $chart has no test suites — helm-unittest reported '0 passed, 0 total' and exited 0; add tests under the chart or set unittest: false"
              return 1
            fi
          }

          if [[ -f "$CHARTS_DIR/Chart.yaml" ]]; then
            run_unittest "$CHARTS_DIR"
          else
            found=0
            for d in "$CHARTS_DIR"/*/; do
              if [[ -f "${d%/}/Chart.yaml" ]]; then
                run_unittest "${d%/}"
                found=1
              fi
            done
            if (( found == 0 )); then
              echo "::error::no chart found in $CHARTS_DIR (no Chart.yaml in $CHARTS_DIR or its immediate subdirs)"
              exit 1
            fi
          fi

      - name: Summary
        if: always()
        env:
          WD: ${{ inputs.working_directory }}
          CHARTS_DIR: ${{ inputs.charts_dir }}
          HELM_LINT_OUTCOME: ${{ steps.helm_lint.outcome }}
          CT_LINT_OUTCOME: ${{ steps.ct_lint.outcome }}
          HELM_UNITTEST_OUTCOME: ${{ steps.helm_unittest.outcome }}
          UNITTEST_INSTALL_OUTCOME: ${{ steps.helm_unittest_install.outcome }}
          UNITTEST_REQUESTED: ${{ inputs.unittest }}
        run: |
          glyph() {
            case "$1" in
              success) echo "✓" ;;
              failure) echo "✗" ;;
              skipped) echo "−" ;;
              *)       echo "?" ;;
            esac
          }
          # `skipped` galt hier pauschal als in Ordnung — auch dann, wenn
          # unittest ANGEFORDERT war und der Schritt nur uebersprungen wurde,
          # weil ein frueherer scheiterte (Audit G-7).
          #
          # Der Fall war real und unsichtbar: `Install helm-unittest` hatte
          # keine id und tauchte in dieser Bilanz gar nicht auf. Scheitert die
          # Plugin-Installation, wird `helm unittest` wegen `success()`
          # uebersprungen, helm_lint und ct_lint stehen auf success — und die
          # Zusammenfassung meldete "✓ passed" auf einem ROTEN Job.
          #
          # Jetzt zaehlen die beiden unittest-Schritte nur, wenn unittest
          # angefordert wurde; dann aber muessen sie BEIDE bestanden haben.
          # Bei `unittest: false` bleiben sie `−` und zaehlen nicht mit.
          ok=1
          [[ "$HELM_LINT_OUTCOME" == "success" ]] || ok=0
          [[ "$CT_LINT_OUTCOME" == "success" ]] || ok=0
          if [[ "$UNITTEST_REQUESTED" == "true" ]]; then
            [[ "$UNITTEST_INSTALL_OUTCOME" == "success" ]] || ok=0
            [[ "$HELM_UNITTEST_OUTCOME" == "success" ]] || ok=0
          fi
          if (( ok == 1 )); then
            result="✓ passed"
          else
            result="✗ failed"
          fi
          {
            echo "## lint-helm"
            echo ""
            echo "**Tools:** helm lint, chart-testing"
            echo "**Working dir:** \`${WD}\`"
            echo "**Charts dir:** \`${CHARTS_DIR}\`"
            echo "**Result:** ${result}"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| helm lint | $(glyph "$HELM_LINT_OUTCOME") |"
            echo "| ct lint | $(glyph "$CT_LINT_OUTCOME") |"
            echo "| helm-unittest install | $(glyph "$UNITTEST_INSTALL_OUTCOME") |"
            echo "| helm unittest | $(glyph "$HELM_UNITTEST_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY" || true
