# .github/workflows/test-rust.yml
# Reusable workflow: run cargo test + cargo-llvm-cov coverage gate.
# Summary convention: docs/conventions/step-summary.md
name: test-rust
on:
  workflow_call:
    inputs:
      runs_on:
        description: 'JSON-encoded array of runner labels.'
        required: false
        type: string
        default: '["self-hosted","Linux","X64"]'
      working_directory:
        description: 'Crate root directory.'
        required: false
        type: string
        default: '.'
      rust_toolchain:
        description: 'rustup toolchain. Empty → rustup defaults.'
        required: false
        type: string
        default: ''
      coverage_threshold:
        description: 'Minimum line coverage percentage (integer 0-100).'
        required: false
        type: number
        default: 80
      # renovate: datasource=github-releases depName=taiki-e/cargo-llvm-cov extractVersion=^v(?<version>.+)$
      cargo_llvm_cov_version:
        description: 'cargo-llvm-cov release version (bare semver — taiki-e/install-action rejects a leading v).'
        required: false
        type: string
        default: '0.6.16'

permissions:
  contents: read

concurrency:
  group: test-rust-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    steps:
      # Ein leeres runs_on faellt NICHT von selbst auf. GitHub plant den Job
      # dann auf irgendeinem Runner der Default-Gruppe ein und laesst ihn
      # arbeiten. `fromJSON` oben faengt nur KAPUTTES JSON ab — `[]` ist
      # gueltiges JSON und kommt hier an.
      # Hintergrund und der gemessene Lauf: tests/conventions/check-runs-on-guard.py
      - name: Reject an empty runs_on
        env:
          RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          trimmed="${RUNS_ON//[[:space:]]/}"
          if [[ "$trimmed" != "["*"]" || ! "$trimmed" =~ [A-Za-z0-9] ]]; then
            echo "::error::runs_on must be a non-empty JSON array of runner labels, got: ${RUNS_ON}" >&2
            echo "::error::an empty array does NOT fail the job — GitHub schedules it on any runner in the default group" >&2
            exit 1
          fi


      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate coverage_threshold
        env:
          THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          set -euo pipefail
          # Der Eingang ist als "0-100" dokumentiert, erzwungen hat das NICHTS
          # (Audit G-3).
          #
          # Das Gate weiter unten rechnet mit `thr + 0`. awk macht daraus bei
          # einem leeren oder nicht numerischen Wert eine 0 — und damit besteht
          # das Gate IMMER. Gemessen bei 12,5 % Abdeckung:
          #
          #   thr=80    gescheitert      richtig
          #   thr=''    BESTANDEN        Gate still abgeschaltet
          #   thr=abc   BESTANDEN        Gate still abgeschaltet
          #   thr=-1    BESTANDEN        Gate still abgeschaltet
          #   thr=150   gescheitert      unerfuellbar, aber wenigstens laut
          #
          # Ueber die gerenderten Adopter-Workflows ist das weitgehend
          # abgefangen: dort steht `fromJSON(vars.SK_COVERAGE_THRESHOLD || '80')`,
          # eine nicht gesetzte Variable faellt also auf 80 zurueck. Die Atome
          # sind aber auch fuer handgeschriebene Aufrufer da — die README
          # fuehrt sie als Vertrag —, und ein Vertrag, den nichts prueft, ist
          # keiner.
          #
          # Dezimalwerte sind ausdruecklich ERLAUBT, obwohl die Beschreibung
          # von einem Integer spricht: pytest nimmt `--cov-fail-under=87.5`
          # anstandslos, und ein Waechter, der legitime Aufrufer abweist, waere
          # schlimmer als der Fund. Geprueft wird, was wirklich schadet: leer,
          # nicht numerisch, negativ, ueber 100.
          #
          # Frueh im Job und nicht erst im Gate: sonst laeuft erst die ganze
          # Testsuite, nur um die Konfiguration danach abzulehnen.
          if ! awk -v t="$THRESHOLD" 'BEGIN { exit (t ~ /^[0-9]+(\.[0-9]+)?$/ && t + 0 <= 100) ? 0 : 1 }'; then
            echo "::error::coverage_threshold must be a number between 0 and 100, got \"${THRESHOLD}\" — an empty or non-numeric value makes the coverage gate pass silently" >&2
            exit 1
          fi

      - name: Install Rust toolchain (explicit)
        if: inputs.rust_toolchain != ''
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: llvm-tools-preview

      - name: Install Rust toolchain (default)
        if: inputs.rust_toolchain == ''
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ inputs.working_directory }}

      - uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2
        with:
          tool: cargo-llvm-cov@${{ inputs.cargo_llvm_cov_version }}

      - name: cargo llvm-cov with threshold
        id: coverage
        working-directory: ${{ inputs.working_directory }}
        env:
          THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          set -o pipefail
          rc=0
          cargo llvm-cov --summary-only --fail-under-lines "$THRESHOLD" | tee llvm-cov.out || rc=$?
          # Re-run with --json to extract line-coverage precisely (text TOTAL row's last % is branch, not line).
          cargo llvm-cov report --json --output-path llvm-cov.json >/dev/null 2>&1 || true
          if [[ -f llvm-cov.json ]] && command -v jq >/dev/null 2>&1; then
            pct=$(jq -r '.data[0].totals.lines.percent | tostring | .[0:5]' llvm-cov.json 2>/dev/null)
          else
            # Fallback: position-based parse of the TOTAL row. cargo-llvm-cov's --summary-only
            # currently emits 13 columns; line coverage is the 10th field (after Lines / Missed Lines).
            pct=$(awk '/^TOTAL/ {gsub("%","",$10); print $10}' llvm-cov.out)
          fi
          echo "coverage_pct=${pct:-N/A}" >> "$GITHUB_OUTPUT"
          echo "threshold=${THRESHOLD}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summary
        if: always()
        env:
          WD: ${{ inputs.working_directory }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          PCT: ${{ steps.coverage.outputs.coverage_pct }}
          THRESHOLD: ${{ steps.coverage.outputs.threshold }}
        run: |
          if [[ "$COVERAGE_OUTCOME" == "success" ]]; then
            result="✓ coverage ${PCT}% ≥ threshold ${THRESHOLD}%"
          elif [[ -n "$PCT" && "$PCT" != "N/A" ]]; then
            result="✗ coverage ${PCT}% < threshold ${THRESHOLD}% (or tests failed)"
          else
            result="✗ tests failed"
          fi
          {
            echo "## test-rust"
            echo ""
            echo "**Tool:** cargo-llvm-cov"
            echo "**Working dir:** \`${WD}\`"
            echo "**Result:** ${result}"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Coverage | ${PCT:-N/A}% |"
            echo "| Threshold | ${THRESHOLD}% |"
          } >> "$GITHUB_STEP_SUMMARY" || true
