version: "2"

linters:
  settings:
    errcheck:
      # CLI diagnostics written to the injected stdout/stderr writers are
      # best-effort by design: a failed write to a closed pipe must not turn
      # a correct exit code into extra error handling at every print site.
      # Contract-relevant writes (step summary, lockfile) check errors
      # explicitly in code.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

# gofmt als Formatierer einschalten.
#
# Zwei Testdateien lagen ungeformt im Repo (internal/manifest/manifest_test.go
# und yaml_test.go) — `gofmt -l` meldete sie, golangci-lint nicht, weil es in
# v2 keinen `formatters`-Abschnitt gab. Ein Formatierungs-Gate, das niemand
# faehrt, ist keines.
formatters:
  enable:
    - gofmt
