name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  actions: read

jobs:
  release-please:
    uses: serverkraken/reusable-workflows/.github/workflows/semantic-release.yml@v2
    secrets: inherit

  docker-build:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    with:
      dockerfile: Dockerfile
      image_name: repo
      tag: ${{ needs.release-please.outputs.tag_name }}
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan:
    needs: [docker-build]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    with:
      image_ref: ${{ needs.docker-build.outputs.image_ref }}
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit
  helm-publish:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: serverkraken/reusable-workflows/.github/workflows/helm-publish.yml@v2
    with:
      chart_path: charts/svc
      oci_registry: ghcr.io//charts
      # Checkout the released tag, not the triggering event's SHA: with
      # back-to-back merges the event SHA predates release-please's bump
      # commit and the job silently republishes the PREVIOUS chart version.
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
