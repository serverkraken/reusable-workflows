schema: 1
components:
  - path: .
    language: go
    dockerfiles:
      - path: images/tools/Dockerfile
        image: acme/multi/tools
      # Zweites Image derselben Komponente: erst ab zwei greift die
      # $imgSuffix-Herleitung, und release.yml.tmpl leitet sie an ZWEI Stellen
      # her (Job-Definition und die needs-Liste von chart-image-pins). Weichen
      # sie voneinander ab, zeigt needs auf einen Job, den es nicht gibt.
      - path: images/tools/Dockerfile.debug
        image: acme/multi/tools-debug
  - path: images/api
    image: acme/multi/api
    # Deckt das Scan-GATE ab (Audit L-4) - severity und fail_on_findings, im
    # Unterschied zu scanners/upload_sarif am worker weiter unten, die den SCAN
    # selbst betreffen. Beide Template-Zweige wurden von KEINER Fixture
    # gerendert: sie waren geparst und validiert, aber ihre Weitergabe ins
    # gerenderte release.yml/prerelease.yml war nie gemessen - dieselbe Klasse
    # wie J-0c beim chart-image-pins-Zweig.
    #
    # Bewusst an einer ANDEREN Komponente als scanners/upload_sarif, damit die
    # Vorgabewerte (`vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL'`) an den uebrigen
    # Images weiter mitgeprueft werden.
    severity: CRITICAL
    fail_on_findings: false
  - path: images/worker
    image: acme/multi/worker
    context: .
    platforms: linux/amd64
    # Covers the scan-option emit path: an image that vendors third-party
    # manifests cannot pass the atom's default scanner set.
    scanners: vuln,secret
    upload_sarif: false
  - path: charts/demo
    type: helm
    unittest: true
    # Covers the extra-files emit: without it a chart's appVersion freezes
    # while its version keeps moving.
    app_version: true
workflows:
  e2e:
    script: test/e2e/run.sh
    schedule: "0 3 * * *"
release:
  dispatch_trigger: true
  badges: true
  # Deckt den chart-image-pins-Zweig ab. Ohne ihn wurde er von KEINER Fixture
  # gerendert: der Job baut seine `needs:`-Liste aus einer zweiten
  # $imgSuffix-Herleitung (Audit J-0c), und weicht die von der ersten ab, zeigt
  # `needs:` auf einen Job, den es nicht gibt. Actionlint faengt das - aber nur,
  # wenn der Zweig ueberhaupt gerendert wird.
  chart_pins:
    values: charts/demo/values.yaml
    key: images.{name}.tag
gitops:
  - repo: acme/gitops-prod
    scope: [kubernetes/apps/multi/**]
  - repo: acme/gitops-lab
