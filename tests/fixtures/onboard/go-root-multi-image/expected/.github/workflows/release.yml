name: release
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  actions: read

jobs:
  release-please:
    uses: serverkraken/reusable-workflows/.github/workflows/semantic-release.yml@v4
    secrets: inherit

  docker-build-tools:
    needs: [release-please]
    if: contains(fromJSON(needs.release-please.outputs.paths_released), '.')
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v4
    with:
      dockerfile: images/tools/Dockerfile
      image_name: acme/multi/tools
      tag: v${{ fromJSON(needs.release-please.outputs.releases)['.'].version }}
      ref: ${{ fromJSON(needs.release-please.outputs.releases)['.'].tag_name }}
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-tools:
    needs: [docker-build-tools]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v4
    with:
      image_ref: ${{ needs.docker-build-tools.outputs.image_ref }}
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit

  docker-build-tools-debug:
    needs: [release-please]
    if: contains(fromJSON(needs.release-please.outputs.paths_released), '.')
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v4
    with:
      dockerfile: images/tools/Dockerfile.debug
      image_name: acme/multi/tools-debug
      tag: v${{ fromJSON(needs.release-please.outputs.releases)['.'].version }}
      ref: ${{ fromJSON(needs.release-please.outputs.releases)['.'].tag_name }}
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-tools-debug:
    needs: [docker-build-tools-debug]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v4
    with:
      image_ref: ${{ needs.docker-build-tools-debug.outputs.image_ref }}
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit

  docker-build-images-api:
    needs: [release-please]
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'images/api')
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v4
    with:
      context: images/api
      dockerfile: images/api/Dockerfile
      image_name: acme/multi/api
      tag: v${{ fromJSON(needs.release-please.outputs.releases)['images/api'].version }}
      ref: ${{ fromJSON(needs.release-please.outputs.releases)['images/api'].tag_name }}
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-images-api:
    needs: [docker-build-images-api]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v4
    with:
      image_ref: ${{ needs.docker-build-images-api.outputs.image_ref }}
      platforms: linux/amd64,linux/arm64
      severity: CRITICAL
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
      fail_on_findings: false
    secrets: inherit

  docker-build-images-worker:
    needs: [release-please]
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'images/worker')
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v4
    with:
      dockerfile: images/worker/Dockerfile
      image_name: acme/multi/worker
      platforms: linux/amd64
      tag: v${{ fromJSON(needs.release-please.outputs.releases)['images/worker'].version }}
      ref: ${{ fromJSON(needs.release-please.outputs.releases)['images/worker'].tag_name }}
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-images-worker:
    needs: [docker-build-images-worker]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v4
    with:
      image_ref: ${{ needs.docker-build-images-worker.outputs.image_ref }}
      scanners: vuln,secret
      platforms: linux/amd64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
      upload_sarif: false
    secrets: inherit

  helm-publish-charts-demo:
    needs: [release-please]
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'charts/demo')
    uses: serverkraken/reusable-workflows/.github/workflows/helm-publish.yml@v4
    permissions:
      contents: read
      packages: write
    with:
      chart_path: charts/demo
      oci_registry: ghcr.io/repo/charts
      ref: ${{ fromJSON(needs.release-please.outputs.releases)['charts/demo'].tag_name }}
    secrets: inherit

  chart-image-pins:
    needs: [release-please, docker-build-tools, docker-build-tools-debug, docker-build-images-api, docker-build-images-worker]
    if: ${{ !failure() && !cancelled() && needs.release-please.outputs.paths_released != '[]' }}
    uses: serverkraken/reusable-workflows/.github/workflows/chart-image-bump.yml@v4
    permissions:
      contents: write
    with:
      values_file: charts/demo/values.yaml
      key_template: images.{name}.tag
      images: |
        {".":["acme/multi/tools","acme/multi/tools-debug"],"images/api":["acme/multi/api"],"images/worker":["acme/multi/worker"]}
      releases: ${{ needs.release-please.outputs.releases }}
    secrets: inherit

  version-badges:
    needs: [release-please]
    if: needs.release-please.outputs.paths_released != '[]'
    uses: serverkraken/reusable-workflows/.github/workflows/version-badges.yml@v4
    permissions:
      contents: write
    secrets: inherit
