name: prerelease
on:
  workflow_dispatch: {}

jobs:
  build:
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v4
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    secrets: inherit
    with:
      prerelease: true
      dockerfile: images/tools/Dockerfile
      image_name: acme/multi/tools
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
  scan:
    needs: build
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v4
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    secrets: inherit
    with:
      image_ref: ${{ needs.build.outputs.image_ref }}
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
  build-images-api:
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v4
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    secrets: inherit
    with:
      prerelease: true
      context: images/api
      dockerfile: images/api/Dockerfile
      image_name: acme/multi/api
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
  scan-images-api:
    needs: build-images-api
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v4
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    secrets: inherit
    with:
      image_ref: ${{ needs.build-images-api.outputs.image_ref }}
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
  build-images-worker:
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v4
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    secrets: inherit
    with:
      prerelease: true
      dockerfile: images/worker/Dockerfile
      image_name: acme/multi/worker
      platforms: linux/amd64
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
  scan-images-worker:
    needs: build-images-worker
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v4
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    secrets: inherit
    with:
      image_ref: ${{ needs.build-images-worker.outputs.image_ref }}
      scanners: vuln,secret
      platforms: linux/amd64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
      upload_sarif: false
