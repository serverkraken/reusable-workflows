name: e2e
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  e2e:
    uses: serverkraken/reusable-workflows/.github/workflows/e2e-kind.yml@v4
    permissions:
      contents: read
      packages: read
    with:
      script: test/e2e/run.sh
      helm_version: ${{ vars.SK_HELM_VERSION || 'v3.16.3' }}
    secrets: inherit
