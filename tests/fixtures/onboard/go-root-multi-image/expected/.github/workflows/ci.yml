name: ci
on:
  pull_request:

jobs:
  secscan:
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-fs.yml@v4
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit

  lint-go-root:
    uses: serverkraken/reusable-workflows/.github/workflows/lint-go.yml@v4
    with:
      working_directory: "."
      go_version: ${{ vars.SK_GO_VERSION || '' }}
      golangci_lint_version: ${{ vars.SK_GOLANGCI_LINT_VERSION || 'v2.12.2' }}
      cgo_enabled: ${{ fromJSON(vars.SK_CGO_ENABLED || 'false') }}
    secrets: inherit
  test-go-root:
    uses: serverkraken/reusable-workflows/.github/workflows/test-go.yml@v4
    with:
      working_directory: "."
      go_version: ${{ vars.SK_GO_VERSION || '' }}
      coverage_threshold: ${{ fromJSON(vars.SK_COVERAGE_THRESHOLD || '80') }}
      cgo_enabled: ${{ fromJSON(vars.SK_CGO_ENABLED || 'false') }}
    secrets: inherit
  lint-helm-charts-demo:
    uses: serverkraken/reusable-workflows/.github/workflows/lint-helm.yml@v4
    with:
      working_directory: .
      charts_dir: "charts/demo"
      unittest: true
    secrets: inherit
  helm-publish-dryrun-charts-demo:
    uses: serverkraken/reusable-workflows/.github/workflows/helm-publish.yml@v4
    permissions:
      contents: read
      packages: write
    with:
      chart_path: "charts/demo"
      oci_registry: ghcr.io/go-root-multi-image/charts
      dry_run: true
    secrets: inherit

  shellcheck:
    uses: serverkraken/reusable-workflows/.github/workflows/lint-shell.yml@v4
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      paths: |-
        images/**/*.sh
        test/**/*.sh
      shellcheck_version: ${{ vars.SK_SHELLCHECK_VERSION || '' }}
    secrets: inherit
