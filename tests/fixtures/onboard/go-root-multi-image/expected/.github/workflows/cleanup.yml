name: cleanup
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  cleanup-multi-tools:
    uses: serverkraken/reusable-workflows/.github/workflows/cleanup-images.yml@v4
    with:
      package_name: "multi/tools"
  cleanup-multi-tools-debug:
    uses: serverkraken/reusable-workflows/.github/workflows/cleanup-images.yml@v4
    with:
      package_name: "multi/tools-debug"
  cleanup-multi-api:
    uses: serverkraken/reusable-workflows/.github/workflows/cleanup-images.yml@v4
    with:
      package_name: "multi/api"
  cleanup-multi-worker:
    uses: serverkraken/reusable-workflows/.github/workflows/cleanup-images.yml@v4
    with:
      package_name: "multi/worker"
