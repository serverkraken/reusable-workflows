name: ci
on:
  pull_request:

jobs:
  secscan:
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-fs.yml@v4
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit

  lint-go-root:
    uses: serverkraken/reusable-workflows/.github/workflows/lint-go.yml@v4
    with:
      working_directory: "."
      go_version: ${{ vars.SK_GO_VERSION || '' }}
      golangci_lint_version: ${{ vars.SK_GOLANGCI_LINT_VERSION || 'v2.12.2' }}
      cgo_enabled: ${{ fromJSON(vars.SK_CGO_ENABLED || 'false') }}
    secrets: inherit
  test-go-root:
    uses: serverkraken/reusable-workflows/.github/workflows/test-go.yml@v4
    with:
      working_directory: "."
      go_version: ${{ vars.SK_GO_VERSION || '' }}
      coverage_threshold: ${{ fromJSON(vars.SK_COVERAGE_THRESHOLD || '80') }}
      cgo_enabled: ${{ fromJSON(vars.SK_CGO_ENABLED || 'false') }}
    secrets: inherit

  tofu-validate:
    uses: serverkraken/reusable-workflows/.github/workflows/tofu-validate.yml@v4
    permissions:
      contents: read
    with:
      working_directories: |-
        tofu
      tofu_version: ${{ vars.SK_TOFU_VERSION || '' }}
    secrets: inherit

  # tofu-plan: einkommentieren, sobald ein Remote-Backend konfiguriert ist.
  #
  # OHNE Backend scheitert dieser Job NICHT — er plant gegen einen leeren
  # lokalen State und meldet gruen, ohne irgendetwas zu pruefen. Das ist
  # schlimmer als kein Check, deshalb steht er hier auskommentiert.
  #
  # emit_plan: true legt den (verschluesselten) Plan als Artefakt ab; danach
  # kann tofu-apply.yml ihn per workflow_dispatch mit dieser Run-ID anwenden.
  # Dafuer wird das Secret TF_ENCRYPTION_PASSPHRASE gebraucht.
  #
  # tofu-plan:
  #   uses: serverkraken/reusable-workflows/.github/workflows/tofu-plan.yml@v4
  #   permissions:
  #     contents: read
  #     pull-requests: write
  #   with:
  #     working_directory: tofu
  #     emit_plan: true
  #   secrets: inherit

  shellcheck:
    uses: serverkraken/reusable-workflows/.github/workflows/lint-shell.yml@v4
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      paths: |-
        .taskfiles/**/*.sh
        scripts/**/*.sh
      shellcheck_version: ${{ vars.SK_SHELLCHECK_VERSION || '' }}
    secrets: inherit
