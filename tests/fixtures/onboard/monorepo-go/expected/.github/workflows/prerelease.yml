name: prerelease
on:
  workflow_dispatch: {}

jobs:
  build-services-api:
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    secrets: inherit
    with:
      prerelease: true
      context: "services/api"
      dockerfile: "services/api/Dockerfile"
      image_name: "repo-api"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
  scan-services-api:
    needs: build-services-api
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    secrets: inherit
    with:
      image_ref: "${{ needs.build-services-api.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
  build-services-worker:
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    secrets: inherit
    with:
      prerelease: true
      context: "services/worker"
      dockerfile: "services/worker/Dockerfile"
      image_name: "repo-worker"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
  scan-services-worker:
    needs: build-services-worker
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    secrets: inherit
    with:
      image_ref: "${{ needs.build-services-worker.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
