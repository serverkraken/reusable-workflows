name: release
on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  actions: read

jobs:
  release-please:
    uses: serverkraken/reusable-workflows/.github/workflows/semantic-release.yml@v2
    secrets: inherit

  docker-build-services-api:
    needs: [release-please]
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'services/api')
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    with:
      context: "services/api"
      dockerfile: "services/api/Dockerfile"
      image_name: "repo-api"
      tag: "v${{ fromJSON(needs.release-please.outputs.releases)['services/api'].version }}"
      ref: "${{ fromJSON(needs.release-please.outputs.releases)['services/api'].tag_name }}"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-services-api:
    needs: [docker-build-services-api]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    with:
      image_ref: "${{ needs.docker-build-services-api.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit

  docker-build-services-worker:
    needs: [release-please]
    if: contains(fromJSON(needs.release-please.outputs.paths_released), 'services/worker')
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    with:
      context: "services/worker"
      dockerfile: "services/worker/Dockerfile"
      image_name: "repo-worker"
      tag: "v${{ fromJSON(needs.release-please.outputs.releases)['services/worker'].version }}"
      ref: "${{ fromJSON(needs.release-please.outputs.releases)['services/worker'].tag_name }}"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-services-worker:
    needs: [docker-build-services-worker]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    with:
      image_ref: "${{ needs.docker-build-services-worker.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit
