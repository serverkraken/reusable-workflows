name: cleanup
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  cleanup-repo-api:
    uses: serverkraken/reusable-workflows/.github/workflows/cleanup-images.yml@v2
    with:
      package_name: ${{ github.event.repository.name }}-api
  cleanup-repo-worker:
    uses: serverkraken/reusable-workflows/.github/workflows/cleanup-images.yml@v2
    with:
      package_name: ${{ github.event.repository.name }}-worker
