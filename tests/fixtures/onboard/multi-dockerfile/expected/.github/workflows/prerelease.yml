name: prerelease
on:
  workflow_dispatch: {}

jobs:
  build-repo:
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    secrets: inherit
    with:
      prerelease: true
      dockerfile: "Dockerfile"
      image_name: "repo"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
  scan-repo:
    needs: build-repo
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    secrets: inherit
    with:
      image_ref: "${{ needs.build-repo.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}

  build-custom-worker:
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    secrets: inherit
    with:
      prerelease: true
      dockerfile: "Dockerfile.worker"
      image_name: "custom-worker"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
  scan-custom-worker:
    needs: build-custom-worker
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    secrets: inherit
    with:
      image_ref: "${{ needs.build-custom-worker.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
