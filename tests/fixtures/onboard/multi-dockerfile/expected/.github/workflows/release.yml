name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  actions: read

jobs:
  release-please:
    uses: serverkraken/reusable-workflows/.github/workflows/semantic-release.yml@v2
    secrets: inherit

  docker-build-repo:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    with:
      dockerfile: "Dockerfile"
      image_name: "repo"
      tag: "${{ needs.release-please.outputs.tag_name }}"
      ref: "${{ needs.release-please.outputs.tag_name }}"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-repo:
    needs: [docker-build-repo]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    with:
      image_ref: "${{ needs.docker-build-repo.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit

  docker-build-custom-worker:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: serverkraken/reusable-workflows/.github/workflows/docker-build.yml@v2
    with:
      dockerfile: "Dockerfile.worker"
      image_name: "custom-worker"
      tag: "${{ needs.release-please.outputs.tag_name }}"
      ref: "${{ needs.release-please.outputs.tag_name }}"
      sign: ${{ fromJSON(vars.SK_SIGN || 'true') }}
      attest: ${{ fromJSON(vars.SK_ATTEST || 'true') }}
      sbom: ${{ fromJSON(vars.SK_SBOM || 'true') }}
    secrets: inherit

  scan-custom-worker:
    needs: [docker-build-custom-worker]
    uses: serverkraken/reusable-workflows/.github/workflows/trivy-image.yml@v2
    with:
      image_ref: "${{ needs.docker-build-custom-worker.outputs.image_ref }}"
      platforms: linux/amd64,linux/arm64
      severity: ${{ vars.SK_TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
      trivy_version: ${{ vars.SK_TRIVY_VERSION || '' }}
    secrets: inherit
